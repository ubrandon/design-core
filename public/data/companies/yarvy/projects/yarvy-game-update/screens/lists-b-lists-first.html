<style>
  /* Lists, variant B, lists first: the person's lists lead, a favorite is one starred row sorted first, the three views sit below as a quieter group. */
  html, body, .yv-shot { scrollbar-gutter: auto; }
  .yv-shot #nav-you { order: 3; } .yv-shot #nav-tasks { order: 4; }
  .yv-shot { position: relative; height: 844px; overflow: hidden; background: var(--shell); color: var(--text); font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-base); -webkit-font-smoothing: antialiased; }
  .yv-shot #app { height: 844px; min-height: 0; overflow: hidden; }
  .yv-shot #rail, .yv-shot #fab { position: absolute; }
  .yv-shot #projects-view { overflow: hidden; }
  .yv-shot .app-toast { display: none; }
  /* Counts are bare numbers: the page is about tasks, so the unit is known (section 6). */
  .yv-shot #projects-nav .tnav-count { font-size: var(--fs-sm); min-width: 1.5em; text-align: right; }
  /* Add list is a 44px icon button, the same size as every other row control (section 9). */
  .yv-shot #projects-nav .tnav-spaces-head .add-space-btn { width: var(--task-touch-target); padding-inline: 0; }
  .yv-shot #projects-nav .tnav-spaces-head { margin-top: 20px; }
  /* A favorite is one row with a star, sorted first, instead of the same list twice (section 5, stable meaning). */
  .yv-shot .lm-star { font-size: 13px; color: var(--accent-2); vertical-align: 1px; margin-left: 2px; }
  .yv-shot #projects-nav > .tnav-spaces-head:first-child { margin-top: 0; }
  /* Archived: the app's foldable section, collapsed at rest; the count says one list is inside. */
  .yv-shot #projects-nav .tnav-archived-head { min-height: var(--task-touch-target); }
</style>
