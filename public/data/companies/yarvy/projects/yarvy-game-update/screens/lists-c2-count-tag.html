<style>
  /* Lists, variant C2, count tag: C with each count as a small tag right after the name instead of a number in the trailing column, so the controls own the right edge. Otherwise identical to lists-c-quiet-tree. Variant C, quiet tree: A's rows and Favorites section, with the More menu on every row and the caret at the right on parents, and Add list as a 44px button beside the page title. */
  html, body, .yv-shot { scrollbar-gutter: auto; }
  .yv-shot #nav-you { order: 3; } .yv-shot #nav-tasks { order: 4; }
  .yv-shot { position: relative; height: 844px; overflow: hidden; background: var(--shell); color: var(--text); font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-base); -webkit-font-smoothing: antialiased; }
  .yv-shot #app { height: 844px; min-height: 0; overflow: hidden; }
  .yv-shot #rail, .yv-shot #fab { position: absolute; }
  .yv-shot #projects-view { overflow: hidden; }
  .yv-shot .app-toast { display: none; }
  /* Counts are bare numbers: the page is about tasks, so the unit is known (section 6). */
  .yv-shot #projects-nav .tnav-count { font-size: var(--fs-sm); min-width: 1.5em; text-align: right; }
  .yv-shot #projects-nav .tnav-spaces-head { margin-top: 20px; }
  /* A favorite is one row with a star, sorted first, instead of the same list twice (section 5, stable meaning). */
  .yv-shot .lm-star { font-size: 13px; color: var(--accent-2); vertical-align: 1px; margin-left: 2px; }
  /* Add list: this page is the only place a list is created, so it gets a real 44px button beside the title. The FAB adds tasks and notes. */
  .yv-shot .projects-head { align-items: center; }
  .yv-shot .lm-c-add { flex: 0 0 auto; display: inline-grid; place-items: center; width: var(--task-touch-target); height: var(--task-touch-target); border: 0; border-radius: var(--radius-pill); background: none; color: var(--text); font-family: inherit; cursor: pointer; }
  .yv-shot .lm-c-add i { font-size: 26px; }
  /* Every list row keeps its More menu at the right edge, always; a parent shows its caret just before it. Controls sit at the trailing edge, so labels start in one line. */
  .yv-shot #projects-nav .tnav-tree-row { padding-left: calc(var(--list-depth, 0) * var(--task-touch-target)); }
  /* Sections divide with one hairline and a header, nothing else. */
  .yv-shot #projects-nav .tnav-spaces-head { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  /* Archived: the app's foldable section, collapsed at rest; the count says one list is inside. */
  .yv-shot #projects-nav .tnav-archived-head { min-height: var(--task-touch-target); }
  /* Add list on the Your lists line: a 32px disc in the control surface color with a dark plus, on the 44px minimum target. Same material as the app's other quiet controls. */
  .yv-shot #projects-nav .tnav-spaces-head .add-space-btn { position: relative; width: var(--task-touch-target); padding: 0; background: none; color: var(--text); margin-right: -6px; }
  .yv-shot #projects-nav .tnav-spaces-head .add-space-btn::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--control-surface); }
  .yv-shot #projects-nav .tnav-spaces-head .add-space-btn i { position: relative; font-size: 18px; }
  .yv-shot #projects-nav .tnav-spaces-head:has(.add-space-btn) { margin-block: 8px 0; }
  .yv-shot #projects-nav .tnav-actions { flex-basis: auto; width: auto; }
  .yv-shot #projects-nav .tnav-caret, .yv-shot #projects-nav .tnav-caret-space { width: var(--task-touch-target); flex-basis: var(--task-touch-target); }
  .yv-shot #projects-nav .tnav-kebab { width: var(--task-touch-target); }
  /* Count tag: the number sits beside the name in a soft pill, same as the Tasks and Notes switch counts on the list page. */
  .yv-shot #projects-nav .tnav-name { align-items: center; }
  .yv-shot #projects-nav .lm-tag { flex: 0 0 auto; min-width: 20px; padding: 2px 7px; border-radius: var(--radius-pill); background: var(--tag-bg); color: var(--tag-text); font-size: var(--fs-xs); font-weight: var(--fw-bold); line-height: 1.2; text-align: center; margin-left: 2px; }
  .yv-shot #projects-nav .tnav-name > span:not(.cic):not(.lm-tag) { flex: 0 1 auto; }
</style>
