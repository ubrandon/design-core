<style>
  /* Life option 3: each area names what went into it, so the section explains itself. */
  html, body { margin: 0; }
  .yl { padding: 28px 32px 32px; background: var(--shell); color: var(--text); font-family: var(--font-sans); font-size: var(--fs-body); line-height: var(--lh-base); -webkit-font-smoothing: antialiased; }
  .yl-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .yl-head h2 { margin: 0; font-size: var(--fs-h2); font-weight: var(--fw-bold); letter-spacing: var(--ls-tight); line-height: var(--lh-snug); }
  .yl-head p { margin: 2px 0 0; font-size: var(--fs-sm); color: var(--muted); }
  .yl-link { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 10px; margin-right: -10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--accent-2); font: inherit; font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); cursor: pointer; white-space: nowrap; }
  .yl-link:hover { background: var(--surface-hover); }
  .t-health { --tone: var(--cat-health); --wash: var(--cat-health-soft); }
  .t-work { --tone: var(--cat-create); --wash: var(--cat-create-soft); }
  .t-learn { --tone: var(--cat-learn); --wash: var(--cat-learn-soft); }
  .t-money { --tone: var(--cat-money); --wash: var(--cat-money-soft); }
  .t-rel { --tone: var(--accent); --wash: var(--chip-active); }
  .t-home { --tone: var(--muted); --wash: var(--surface-hover); }
  .yl-well { display: grid; place-items: center; flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; background: var(--wash); color: var(--tone); font-size: 20px; }
  .yl-quiet { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin-top: 12px; font-size: var(--fs-sm); color: var(--muted); }
  .yl-quiet button { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; margin-left: -10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
  .yl-quiet button:hover { background: var(--surface-hover); }
  .yl-quiet i { font-size: 16px; color: var(--tone); }
  .yl-quiet b { color: var(--text); font-weight: var(--fw-semibold); }
  .yl-quiet .warm b { color: var(--accent-2); }
  .r-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .r-row { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 16px 12px 14px; border: 0; border-radius: var(--radius-xl); background: var(--panel); box-shadow: var(--shadow-soft); color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .r-row:hover { background: var(--card-hover); }
  .r-body { flex: 1; min-width: 0; }
  .r-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .r-top b { font-size: var(--fs-body); font-weight: var(--fw-semibold); }
  .r-top span { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
  .r-top span strong { color: var(--text); font-weight: var(--fw-semibold); }
  .r-body small { display: block; margin-top: 2px; font-size: var(--fs-sm); color: var(--muted); }
  .r-row > .ph-caret-right { color: var(--muted); font-size: 16px; }
</style>
<div class="yl" style="background: var(--shell);">
<div class="yl-head"><div><h2>What you did this week</h2><p>Sorted by the part of your life it helped.</p></div><button type="button" class="yl-link">Edit areas</button></div><div class="r-grid"><button type="button" class="r-row t-health"><span class="yl-well" aria-hidden="true"><i class="ph ph-person-simple-run"></i></span><span class="r-body"><span class="r-top"><b>Health</b><span><strong>4</strong> done</span></span><small>Long run, meditated twice, cooked once</small></span><i class="ph ph-caret-right" aria-hidden="true"></i></button><button type="button" class="r-row t-work"><span class="yl-well" aria-hidden="true"><i class="ph ph-briefcase"></i></span><span class="r-body"><span class="r-top"><b>Work</b><span><strong>4</strong> done</span></span><small>Standup, highlights draft, 2 moments</small></span><i class="ph ph-caret-right" aria-hidden="true"></i></button><button type="button" class="r-row t-learn"><span class="yl-well" aria-hidden="true"><i class="ph ph-book-open"></i></span><span class="r-body"><span class="r-top"><b>Learning</b><span><strong>1</strong> done</span></span><small>Chapter 9 of Piranesi</small></span><i class="ph ph-caret-right" aria-hidden="true"></i></button><button type="button" class="r-row t-money"><span class="yl-well" aria-hidden="true"><i class="ph ph-wallet"></i></span><span class="r-body"><span class="r-top"><b>Money</b><span><strong>1</strong> done</span></span><small>Moved $300 to savings</small></span><i class="ph ph-caret-right" aria-hidden="true"></i></button></div><div class="yl-quiet"><button type="button" class="t-rel warm"><i class="ph ph-heart" aria-hidden="true"></i><b>Relationships</b> quiet for 2 weeks</button><button type="button" class="t-home"><i class="ph ph-house" aria-hidden="true"></i><b>Home</b> paused</button></div>
</div>
