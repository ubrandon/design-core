    <div style="width:56px;height:56px;border-radius:12px;background:#e3a071;"></div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
    <div style="width:56px;height:56px;border-radius:12px;background:#f7d9c0;border:1px solid rgba(0,0,0,0.1);"></div>
    <span style="font-size:0.65rem;text-align:center;color:rgba(0,0,0,0.5);"><strong style="display:block;color:rgba(0,0,0,0.7);">Clay light</strong>#f7d9c0</span>
