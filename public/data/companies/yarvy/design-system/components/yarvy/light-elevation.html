<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:520px;padding:10px 6px 18px;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:100%;height:66px;border-radius:14px;background:#fffdf9;border:1px solid #efe7d8;box-shadow:var(--yv-shadow-card);"></div>
    <span style="font-size:0.65rem;text-align:center;color:rgba(0,0,0,0.5);"><strong style="display:block;color:rgba(0,0,0,0.7);">Resting</strong>--yv-shadow-card</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:100%;height:66px;border-radius:14px;background:#fffdf9;border:1px solid #efe7d8;box-shadow:var(--yv-shadow-raised);"></div>
    <span style="font-size:0.65rem;text-align:center;color:rgba(0,0,0,0.5);"><strong style="display:block;color:rgba(0,0,0,0.7);">Raised</strong>--yv-shadow-raised</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div style="width:100%;height:66px;border-radius:14px;background:#fffdf9;border:1px solid #efe7d8;box-shadow:var(--yv-shadow-pop);"></div>
    <span style="font-size:0.65rem;text-align:center;color:rgba(0,0,0,0.5);"><strong style="display:block;color:rgba(0,0,0,0.7);">Pop</strong>--yv-shadow-pop</span>
  </div>
</div>
