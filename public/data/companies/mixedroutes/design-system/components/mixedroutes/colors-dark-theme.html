<div class="mr-scope mr-scope--color-palette">
  <div class="mr-color-panels">
    <div class="mr-color-panel">
      <p class="mr-subsection-title">Canvas & surfaces</p>
      <div class="mr-color-grid">
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #0f1318"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Background</span>
            <code>#0f1318</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #181d25"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Surface 1</span>
            <code>#181d25</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #1f252f"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Surface 2</span>
            <code>#1f252f</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #272d38"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Surface 3</span>
            <code>#272d38</code>
          </div>
        </div>
      </div>
    </div>
    <div class="mr-color-panel">
      <p class="mr-subsection-title">Text & borders</p>
      <div class="mr-color-grid">
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #f6f8fc"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Text</span>
            <code>#f6f8fc</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #bac6d0"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Secondary text</span>
            <code>#bac6d0</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #8591a2"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Muted text</span>
            <code>#8591a2</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #343c4a"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Border</span>
            <code>#343c4a</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: #22d3ee"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Primary cyan (dark)</span>
            <code>#22d3ee</code>
          </div>
        </div>
      </div>
    </div>
    <div class="mr-color-panel mr-color-panel--narrow">
      <p class="mr-subsection-title">Overlays</p>
      <div class="mr-color-grid">
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: rgba(0, 0, 0, 0.55)"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Scrim heavy</span>
            <code>rgba(0,0,0,0.55)</code>
          </div>
        </div>
        <div class="mr-color-card">
          <div class="mr-color-swatch" style="background: rgba(0, 0, 0, 0.35)"></div>
          <div class="mr-color-info">
            <span class="mr-color-name">Scrim medium</span>
            <code>rgba(0,0,0,0.35)</code>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
