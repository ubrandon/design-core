<div class="mr-scope mr-scope--light">
  <p class="mr-subsection-title">Styles</p>
  <div class="mr-button-grid mr-button-grid--styles">
    <div class="mr-button-item">
      <button type="button" class="btn btn-primary">Primary</button>
      <code>btn-primary</code>
    </div>
    <div class="mr-button-item">
      <button type="button" class="btn btn-secondary">Secondary</button>
      <code>btn-secondary</code>
    </div>
    <div class="mr-button-item">
      <button type="button" class="btn btn-white">On dark / hero</button>
      <code>btn-white</code>
    </div>
  </div>

  <p class="mr-subsection-title">App state variants</p>
  <div class="mr-button-row">
    <button type="button" class="btn btn-tint-primary">Primary tint</button>
    <button type="button" class="btn btn-success">Success</button>
    <button type="button" class="btn btn-secondary">Muted</button>
    <button type="button" class="btn btn-danger">Danger</button>
  </div>

  <p class="mr-subsection-title">Sizes</p>
  <div class="mr-button-grid mr-button-grid--sizes">
    <div class="mr-button-item">
      <button type="button" class="btn btn-primary btn-sm">Small</button>
      <code>btn-sm</code>
    </div>
    <div class="mr-button-item">
      <button type="button" class="btn btn-primary">Default</button>
      <code>default</code>
    </div>
    <div class="mr-button-item">
      <button type="button" class="btn btn-primary btn-lg">Large</button>
      <code>btn-lg</code>
    </div>
  </div>

  <p class="mr-subsection-title">With icon</p>
  <div class="mr-button-row">
    <button type="button" class="btn btn-primary">
      <i class="ph-fill ph-globe" aria-hidden="true"></i>
      Web app
    </button>
    <button type="button" class="btn btn-secondary">
      <i class="ph-fill ph-calendar" aria-hidden="true"></i>
      Schedule
    </button>
  </div>

  <p class="mr-subsection-title">Store downloads (marketing)</p>
  <div class="mr-button-row">
    <button type="button" class="btn btn-app-store">
      <i class="ph-fill ph-apple-logo" aria-hidden="true"></i>
      <span class="btn-app-store-text">
        <span class="btn-app-store-label">Download on the</span>
        <span class="btn-app-store-name">App Store</span>
      </span>
    </button>
    <button type="button" class="btn btn-app-store">
      <i class="ph-fill ph-google-play-logo" aria-hidden="true"></i>
      <span class="btn-app-store-text">
        <span class="btn-app-store-label">Get it on</span>
        <span class="btn-app-store-name">Google Play</span>
      </span>
    </button>
  </div>
</div>
