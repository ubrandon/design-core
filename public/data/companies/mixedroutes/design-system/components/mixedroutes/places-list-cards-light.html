<div class="mr-scope mr-scope--light" style="display: flex; flex-direction: column; gap: 24px; width: 360px">

  <div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 12px">
      <span style="font-size: 1.4rem; font-weight: 800; color: var(--text)">Saved places</span>
      <span class="mr-section-action">New list</span>
    </div>
    <div class="mr-places-list-grid">
      <button type="button" class="mr-places-list-card">
        <div class="mr-places-list-card-icon">❤️</div>
        <div class="mr-places-list-card-body">
          <div class="mr-places-list-card-title">Saved</div>
          <div class="mr-places-list-card-count">8 places</div>
          <div class="mr-places-list-card-meta">Private</div>
        </div>
      </button>
      <button type="button" class="mr-places-list-card">
        <div class="mr-places-list-card-icon">📋</div>
        <div class="mr-places-list-card-body">
          <div class="mr-places-list-card-title">Asheville</div>
          <div class="mr-places-list-card-count">4 places</div>
          <div class="mr-places-list-card-meta">Shared</div>
        </div>
      </button>
    </div>
  </div>

  <div>
    <div style="font-size: 0.78rem; font-weight: 800; color: #858b94; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px">Compact rows (sheets, pickers)</div>
    <div style="display: flex; flex-direction: column; gap: 0">
      <button type="button" class="mr-places-list-row mr-places-list-row--selected">
        <div class="mr-places-list-row-icon">🏔️</div>
        <div class="mr-places-list-row-body">
          <div class="mr-places-list-row-title">Trail wishlist</div>
          <div class="mr-places-list-row-meta">9 places · Shared with 4 friends</div>
        </div>
        <span style="width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(145deg, #14b8a6, #3b82f6); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #ffffff"></i></span>
      </button>
      <button type="button" class="mr-places-list-row">
        <div class="mr-places-list-row-icon">☕️</div>
        <div class="mr-places-list-row-body">
          <div class="mr-places-list-row-title">Trailhead coffee spots</div>
          <div class="mr-places-list-row-meta">4 places · Shared with 6 friends</div>
        </div>
        <span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #e1e3e6"></span>
      </button>
    </div>
  </div>

</div>
