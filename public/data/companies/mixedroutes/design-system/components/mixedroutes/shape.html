<div class="mr-scope mr-scope--shape">
  <div class="mr-shape-layout">
    <section class="mr-shape-block mr-shape-block--radius">
      <p class="mr-subsection-title">Radius</p>
      <div class="mr-radius-grid">
        <div class="mr-radius-item">
          <div class="mr-radius-box" style="border-radius: var(--radius-sm)"></div>
          <div class="mr-radius-info">
            <span>Small</span>
            <code>8px</code>
          </div>
        </div>
        <div class="mr-radius-item">
          <div class="mr-radius-box" style="border-radius: var(--radius-md)"></div>
          <div class="mr-radius-info">
            <span>Medium</span>
            <code>12px</code>
          </div>
        </div>
        <div class="mr-radius-item">
          <div class="mr-radius-box" style="border-radius: var(--radius-lg)"></div>
          <div class="mr-radius-info">
            <span>Large</span>
            <code>16px</code>
          </div>
        </div>
        <div class="mr-radius-item">
          <div class="mr-radius-box" style="border-radius: var(--radius-xl)"></div>
          <div class="mr-radius-info">
            <span>Extra large</span>
            <code>24px</code>
          </div>
        </div>
        <div class="mr-radius-item">
          <div class="mr-radius-box" style="border-radius: 9999px"></div>
          <div class="mr-radius-info">
            <span>Full</span>
            <code>9999px</code>
          </div>
        </div>
      </div>
    </section>
    <section class="mr-shape-block mr-shape-block--shadows">
      <p class="mr-subsection-title">Shadows</p>
      <div class="mr-shadow-grid">
        <div class="mr-shadow-item">
          <div class="mr-shadow-box" style="box-shadow: var(--shadow-soft)"></div>
          <div class="mr-shadow-info">
            <span>Soft</span>
            <code>--shadow-soft</code>
          </div>
        </div>
        <div class="mr-shadow-item">
          <div class="mr-shadow-box" style="box-shadow: var(--shadow)"></div>
          <div class="mr-shadow-info">
            <span>Default</span>
            <code>--shadow</code>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
