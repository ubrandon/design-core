<div class="mr-scope">
  <div style="display: flex; flex-wrap: wrap; gap: 24px">
    <div class="mr-empty-state">
      <div class="mr-empty-state-icon" aria-hidden="true">
        <i class="ph ph-calendar"></i>
      </div>
      <div class="mr-empty-state-title">No plans yet</div>
      <div class="mr-empty-state-desc">Create a plan and invite your friends to start something fun together.</div>
      <button type="button" class="btn btn-primary">Create a plan</button>
    </div>

    <div class="mr-empty-state">
      <div class="mr-empty-state-icon" aria-hidden="true">
        <i class="ph ph-map-pin"></i>
      </div>
      <div class="mr-empty-state-title">No events nearby</div>
      <div class="mr-empty-state-desc">There aren't any events in your area right now. Try expanding your search radius.</div>
      <button type="button" class="btn btn-secondary">Expand search</button>
    </div>

    <div class="mr-empty-state">
      <div class="mr-empty-state-icon" aria-hidden="true">
        <i class="ph ph-chats-circle"></i>
      </div>
      <div class="mr-empty-state-title">No messages</div>
      <div class="mr-empty-state-desc">Start a conversation with a friend or group to coordinate plans.</div>
      <button type="button" class="btn btn-primary btn-sm">Start a chat</button>
    </div>
  </div>

  <div style="margin-top: 32px; display: flex; flex-direction: column; gap: 12px; max-width: 360px">
    <div style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.45)">Inline empty banner</div>

    <button type="button" class="mr-empty-banner">
      <div class="mr-empty-banner-icon" aria-hidden="true">
        <i class="ph-fill ph-calendar-plus"></i>
      </div>
      <div class="mr-empty-banner-body">
        <div class="mr-empty-banner-title">Plan something</div>
        <div class="mr-empty-banner-desc">No plans yet — get the crew out</div>
      </div>
      <i class="ph ph-caret-right mr-empty-banner-caret" aria-hidden="true"></i>
    </button>

    <button type="button" class="mr-empty-banner">
      <div class="mr-empty-banner-icon" aria-hidden="true">
        <i class="ph-fill ph-map-pin"></i>
      </div>
      <div class="mr-empty-banner-body">
        <div class="mr-empty-banner-title">Save a place</div>
        <div class="mr-empty-banner-desc">No saved places yet — bookmark spots you love</div>
      </div>
      <i class="ph ph-caret-right mr-empty-banner-caret" aria-hidden="true"></i>
    </button>

    <button type="button" class="mr-empty-banner">
      <div class="mr-empty-banner-icon" aria-hidden="true">
        <i class="ph-fill ph-user-plus"></i>
      </div>
      <div class="mr-empty-banner-body">
        <div class="mr-empty-banner-title">Invite friends</div>
        <div class="mr-empty-banner-desc">No one in this group yet — bring the crew</div>
      </div>
      <i class="ph ph-caret-right mr-empty-banner-caret" aria-hidden="true"></i>
    </button>
  </div>
</div>
