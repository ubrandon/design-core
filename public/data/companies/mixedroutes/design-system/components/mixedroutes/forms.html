<div class="mr-scope">
  <div class="mr-form-demo">
    <div class="form-group">
      <label for="mr-ds-text">Text input</label>
      <input id="mr-ds-text" type="text" placeholder="Enter your name…" />
    </div>
    <div class="form-group">
      <label for="mr-ds-email">Email input</label>
      <input id="mr-ds-email" type="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label for="mr-ds-select">Select</label>
      <select id="mr-ds-select">
        <option value="" disabled selected>Choose a category…</option>
        <option>Music</option>
        <option>Sports</option>
        <option>Food & Drink</option>
        <option>Outdoors</option>
        <option>Gaming</option>
      </select>
    </div>
    <div class="form-group">
      <label for="mr-ds-area">Textarea</label>
      <textarea id="mr-ds-area" placeholder="Write your message…"></textarea>
    </div>
  </div>
</div>
