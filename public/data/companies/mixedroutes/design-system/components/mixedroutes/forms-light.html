<div class="mr-scope mr-scope--light">
  <div class="mr-form-demo">
    <div class="form-group">
      <label for="mr-ds-text-light">Text input</label>
      <input id="mr-ds-text-light" type="text" placeholder="Enter your name…" />
    </div>
    <div class="form-group">
      <label for="mr-ds-email-light">Email input</label>
      <input id="mr-ds-email-light" type="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label for="mr-ds-select-light">Select</label>
      <select id="mr-ds-select-light">
        <option value="" disabled selected>Choose a category…</option>
        <option>Music</option>
        <option>Sports</option>
        <option>Food & Drink</option>
        <option>Outdoors</option>
        <option>Gaming</option>
      </select>
    </div>
    <div class="form-group">
      <label for="mr-ds-area-light">Textarea</label>
      <textarea id="mr-ds-area-light" placeholder="Write your message…"></textarea>
    </div>
  </div>
</div>
