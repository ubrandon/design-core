<div class="mr-scope mr-scope--light">
  <div style="display: flex; flex-direction: column; gap: 14px; max-width: 360px">
    <div class="mr-toast">
      <div class="mr-toast-icon mr-toast-success">
        <i class="ph-fill ph-check" aria-hidden="true"></i>
      </div>
      <div class="mr-toast-content">
        <div class="mr-toast-title">Plan created!</div>
        <div class="mr-toast-desc">Pizza Night is live — invite your friends</div>
      </div>
      <button type="button" class="mr-toast-action">View</button>
    </div>

    <div class="mr-toast">
      <div class="mr-toast-icon mr-toast-error">
        <i class="ph-fill ph-warning" aria-hidden="true"></i>
      </div>
      <div class="mr-toast-content">
        <div class="mr-toast-title">Connection lost</div>
        <div class="mr-toast-desc">Check your internet and try again</div>
      </div>
      <button type="button" class="mr-toast-action">Retry</button>
    </div>

    <div class="mr-toast">
      <div class="mr-toast-icon mr-toast-info">
        <i class="ph-fill ph-users" aria-hidden="true"></i>
      </div>
      <div class="mr-toast-content">
        <div class="mr-toast-title">Mike joined your plan</div>
        <div class="mr-toast-desc">3 friends are going to Game Night</div>
      </div>
    </div>

    <div class="mr-toast">
      <div class="mr-toast-icon mr-toast-success">
        <i class="ph-fill ph-check" aria-hidden="true"></i>
      </div>
      <div class="mr-toast-content">
        <div class="mr-toast-title">Friend request sent</div>
      </div>
      <button type="button" class="mr-toast-action">Undo</button>
    </div>
  </div>
</div>
