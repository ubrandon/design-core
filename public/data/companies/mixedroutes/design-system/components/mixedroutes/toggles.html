<div class="mr-scope">
  <p class="mr-subsection-title">Toggle states</p>
  <div style="display:flex;gap:20px;align-items:center;margin-bottom:20px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <button type="button" class="mr-toggle" aria-label="Off"></button>
      <span style="font-size:0.75rem;color:rgba(255,255,255,0.45);">Off</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <button type="button" class="mr-toggle mr-toggle-on" aria-label="On"></button>
      <span style="font-size:0.75rem;color:rgba(255,255,255,0.45);">On</span>
    </div>
  </div>

  <p class="mr-subsection-title">Settings rows</p>
  <div style="display:flex;flex-direction:column;gap:10px;max-width:390px;">
    <div class="mr-toggle-row">
      <div class="mr-toggle-label">
        <span class="mr-toggle-label-title">Push notifications</span>
        <span class="mr-toggle-label-desc">Get notified when friends are active</span>
      </div>
      <button type="button" class="mr-toggle mr-toggle-on" aria-label="Push notifications"></button>
    </div>
    <div class="mr-toggle-row">
      <div class="mr-toggle-label">
        <span class="mr-toggle-label-title">Location sharing</span>
        <span class="mr-toggle-label-desc">Let friends see your current area</span>
      </div>
      <button type="button" class="mr-toggle" aria-label="Location sharing"></button>
    </div>
    <div class="mr-toggle-row">
      <div class="mr-toggle-label">
        <span class="mr-toggle-label-title">Dark mode</span>
        <span class="mr-toggle-label-desc">Always use the dark theme</span>
      </div>
      <button type="button" class="mr-toggle mr-toggle-on" aria-label="Dark mode"></button>
    </div>
  </div>
</div>
