<div class="mr-scope mr-scope--light">
  <p class="mr-section-note">
    Tappable filters in a horizontal row — <code>.mr-chip</code> + <code>.mr-chip-active</code> for selection.
  </p>
  <p class="mr-subsection-title">Topics & interests</p>
  <div class="mr-chip-row">
    <button type="button" class="mr-chip mr-chip-active">All</button>
    <button type="button" class="mr-chip"><span>🎵</span> Music</button>
    <button type="button" class="mr-chip"><span>🎨</span> Art</button>
    <button type="button" class="mr-chip"><span>🥾</span> Hiking</button>
    <button type="button" class="mr-chip"><span>🎮</span> Games</button>
  </div>
  <p class="mr-subsection-title">Time & schedule</p>
  <div class="mr-chip-row">
    <button type="button" class="mr-chip">Tonight</button>
    <button type="button" class="mr-chip">Tomorrow</button>
    <button type="button" class="mr-chip">This weekend</button>
    <button type="button" class="mr-chip">Next week</button>
    <button type="button" class="mr-chip">All day</button>
    <button type="button" class="mr-chip">Flexible</button>
  </div>
</div>
