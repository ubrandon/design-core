<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<style>.tag-scroll{scrollbar-width:none;-ms-overflow-style:none}.tag-scroll::-webkit-scrollbar{display:none;width:0;height:0}</style>

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Invite</span>
      <span style="font-size: 0.85rem; font-weight: 800; color: #6dd5ed">Done</span>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="padding: 12px 14px; border-radius: 14px; background: var(--mr-input-surface); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px">
        <i class="ph ph-magnifying-glass" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
        <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: rgba(76, 217, 154, 0.22); border: 1px solid rgba(76, 217, 154, 0.4); font-size: 0.76rem; font-weight: 700; color: #8af0c0">
          <i class="ph-fill ph-game-controller" style="font-size: 10px"></i>Gamers · 11
          <i class="ph ph-x" style="font-size: 10px; opacity: 0.6"></i>
        </span>
        <input type="text" placeholder="Search…" style="flex: 1; min-width: 60px; background: transparent; border: 0; color: var(--text); font-size: 0.88rem; outline: none" />
      </div>

      <div style="font-size: 0.66rem; font-weight: 800; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px; display: flex; align-items: center; gap: 5px">
        <i class="ph ph-tag" style="font-size: 11px"></i>Tap to add a whole tag
      </div>

      <div class="tag-scroll" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 14px; -webkit-overflow-scrolling: touch">
        <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: rgba(76, 217, 154, 0.28); border: 1px solid rgba(76, 217, 154, 0.5); font-size: 0.78rem; font-weight: 800; color: #8af0c0">
          <i class="ph-fill ph-game-controller" style="font-size: 11px"></i>Gamers
          <span style="opacity: 0.85; font-weight: 700">11</span>
          <i class="ph-fill ph-check" style="font-size: 10px"></i>
        </button>
        <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: rgba(255, 99, 132, 0.1); border: 1px solid rgba(255, 99, 132, 0.24); font-size: 0.78rem; font-weight: 700; color: #ffb6c5">
          <i class="ph-fill ph-heart" style="font-size: 11px"></i>Close
          <span style="opacity: 0.7; font-weight: 600">8</span>
        </button>
        <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: rgba(255, 191, 80, 0.1); border: 1px solid rgba(255, 191, 80, 0.24); font-size: 0.78rem; font-weight: 700; color: #ffd99c">
          <i class="ph-fill ph-briefcase" style="font-size: 11px"></i>Coworkers
          <span style="opacity: 0.7; font-weight: 600">6</span>
        </button>
        <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; padding: 6px 11px; border-radius: 999px; background: transparent; border: 1px dashed rgba(255,255,255,0.18); font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.55)">
          <i class="ph ph-plus" style="font-size: 11px"></i>New
        </button>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px; display: flex; align-items: center; gap: 6px">
        <i class="ph-fill ph-users-three" style="font-size: 12px; color: #c0c8ff"></i>Or post to a group
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6dd5ed, #2193b0); display: flex; align-items: center; justify-content: center; font-size: 18px">🎮</div>
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Tuesday Night Valorant</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Group · 8 members see this plan</div></div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #ff9b6a, #ff5c8a); display: flex; align-items: center; justify-content: center; font-size: 18px">🕹️</div>
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Smash Sundays</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Group · 5 members see this plan</div></div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">People · 11 from "Gamers"</div>

      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=51" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Riley Stone</div>
            <div style="display: flex; gap: 4px; margin-top: 2px">
              <span style="display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; background: rgba(76, 217, 154, 0.14); font-size: 0.62rem; font-weight: 700; color: #8af0c0"><i class="ph-fill ph-game-controller" style="font-size: 8px"></i>Gamers</span>
            </div>
          </div>
          <i class="ph-fill ph-check-circle" style="font-size: 20px; color: #8af0c0"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=22" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Jordan Lee</div>
            <div style="display: flex; gap: 4px; margin-top: 2px">
              <span style="display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; background: rgba(76, 217, 154, 0.14); font-size: 0.62rem; font-weight: 700; color: #8af0c0"><i class="ph-fill ph-game-controller" style="font-size: 8px"></i>Gamers</span>
            </div>
          </div>
          <i class="ph-fill ph-check-circle" style="font-size: 20px; color: #8af0c0"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Sam Rivera</div><div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">No tags</div></div>
          <i class="ph ph-circle" style="font-size: 20px; color: rgba(255,255,255,0.3)"></i>
        </div>
      </div>
    </div>
  </div>
</div>
