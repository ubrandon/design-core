<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: rgba(0, 0, 0, 0.6); overflow-x: clip; min-height: 100vh; padding-top: 200px">
  <div
    style="
      background: var(--bg-0);
      border-radius: 24px 24px 0 0;
      padding: 14px 16px 24px;
      border: 1px solid rgba(255,255,255,0.06);
    "
  >
    <div class="mr-scope">
      <div style="width: 48px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.18); margin: 0 auto 18px"></div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 4px 4px 18px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 10px">
        <img src="https://i.pravatar.cc/96?img=32" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px">
            <div style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Sarah Kim</div>
            <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: rgba(232, 201, 107, 0.14); border: 1px solid rgba(232, 201, 107, 0.35); font-size: 0.65rem; font-weight: 800; color: #e8c96b; letter-spacing: 0.04em; text-transform: uppercase">
              <i class="ph-fill ph-shield-check" style="font-size: 10px"></i>
              Admin
            </span>
          </div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@sarahk · Admin since Mar 18</div>
        </div>
      </div>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: var(--text); text-align: left">
        <i class="ph ph-user" style="font-size: 22px; color: rgba(255,255,255,0.7)"></i>
        <span style="font-size: 0.98rem; font-weight: 700">View profile</span>
      </button>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: var(--text); text-align: left">
        <i class="ph ph-chat-circle" style="font-size: 22px; color: rgba(255,255,255,0.7)"></i>
        <span style="font-size: 0.98rem; font-weight: 700">Send message</span>
      </button>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 6px 0"></div>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: var(--text); text-align: left">
        <i class="ph ph-shield-slash" style="font-size: 22px; color: rgba(255,255,255,0.7)"></i>
        <div style="flex: 1">
          <div style="font-size: 0.98rem; font-weight: 700">Remove admin</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Stays in the group as a regular member</div>
        </div>
      </button>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: var(--text); text-align: left">
        <i class="ph ph-crown-simple" style="font-size: 22px; color: #e8c96b"></i>
        <div style="flex: 1">
          <div style="font-size: 0.98rem; font-weight: 700">Transfer ownership</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Make Sarah the group creator</div>
        </div>
      </button>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 6px 0"></div>

      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; border: 0; padding: 14px 8px; color: #ff7a85; text-align: left">
        <i class="ph ph-user-minus" style="font-size: 22px"></i>
        <span style="font-size: 0.98rem; font-weight: 700">Remove from group</span>
      </button>

      <button type="button" class="btn btn-secondary" style="width: 100%; padding: 14px; border-radius: 999px; margin-top: 14px">
        Cancel
      </button>
    </div>
  </div>
</div>
