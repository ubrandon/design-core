<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: rgba(0, 0, 0, 0.65); overflow-x: clip; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px">
  <div
    style="
      width: 100%;
      max-width: 340px;
      background: var(--bg-0);
      border-radius: 22px;
      padding: 24px 22px 18px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    "
  >
    <div class="mr-scope" style="text-align: center">
      <div
        style="
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: rgba(255, 122, 133, 0.1);
          border: 1px solid rgba(255, 122, 133, 0.25);
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0 auto 14px;
        "
      >
        <i class="ph ph-sign-out" style="font-size: 26px; color: #ff7a85"></i>
      </div>
      <div style="font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 8px">Leave Hiking Crew?</div>
      <div style="font-size: 0.88rem; color: rgba(255,255,255,0.6); line-height: 1.5; margin-bottom: 18px">
        You'll lose access to the chat, plans, and shared lists. You can rejoin only if someone sends you a new invite.
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button
          type="button"
          style="
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            background: rgba(255, 122, 133, 0.14);
            border: 1px solid rgba(255, 122, 133, 0.4);
            color: #ff7a85;
            font-size: 0.95rem;
            font-weight: 800;
          "
        >
          Leave group
        </button>
        <button
          type="button"
          style="
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            background: transparent;
            border: 0;
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            font-weight: 700;
          "
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
