<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<style>.tag-scroll{scrollbar-width:none;-ms-overflow-style:none}.tag-scroll::-webkit-scrollbar{display:none;width:0;height:0}</style>

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 8px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <span style="font-size: 1.6rem; font-weight: 800; color: var(--text)">Friends</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Notifications"><i class="ph ph-bell" aria-hidden="true"></i></button>
        <img class="mr-top-nav-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
      </div>
    </header>

    <div style="padding: 6px 16px 12px">
      <div class="mr-search-bar">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search friends…" autocomplete="off" />
      </div>
    </div>

    <div style="padding: 12px 16px 8px; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Filtered</span>
        <span style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">11 friends</span>
      </div>
    </div>

    <div class="tag-scroll" style="padding: 0 16px 8px; display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch">
      <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.55)">
        All <span style="opacity: 0.6; font-weight: 600">47</span>
      </button>
      <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(76, 217, 154, 0.28); border: 1px solid rgba(76, 217, 154, 0.5); font-size: 0.8rem; font-weight: 800; color: #8af0c0">
        <i class="ph-fill ph-game-controller" style="font-size: 12px"></i>Gamers <span style="opacity: 0.85; font-weight: 700">11</span>
        <i class="ph ph-x" style="font-size: 11px; opacity: 0.7"></i>
      </button>
      <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; background: rgba(255, 99, 132, 0.1); border: 1px solid rgba(255, 99, 132, 0.22); font-size: 0.78rem; font-weight: 700; color: #ffb6c5">
        <i class="ph-fill ph-heart" style="font-size: 11px"></i>Close <span style="opacity: 0.7; font-weight: 600">8</span>
      </button>
      <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; background: rgba(255, 191, 80, 0.1); border: 1px solid rgba(255, 191, 80, 0.22); font-size: 0.78rem; font-weight: 700; color: #ffd99c">
        <i class="ph-fill ph-briefcase" style="font-size: 11px"></i>Coworkers <span style="opacity: 0.7; font-weight: 600">6</span>
      </button>
    </div>

    <div style="padding: 10px 16px 14px">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 12px 16px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.92rem">
        <i class="ph-fill ph-calendar-plus" style="font-size: 16px"></i>Add all to plan
      </button>
    </div>

    <div style="padding: 0 16px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img src="https://i.pravatar.cc/72?img=51" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Riley Stone</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 1px">Smash Sundays · @rileyplays</div>
        </div>
        <button type="button" style="background: transparent; border: 0; padding: 4px"><i class="ph ph-dots-three" style="font-size: 18px; color: rgba(255,255,255,0.4)"></i></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img src="https://i.pravatar.cc/72?img=22" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Jordan Lee</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 1px">Tuesday Night Valorant · @jlee</div>
        </div>
        <button type="button" style="background: transparent; border: 0; padding: 4px"><i class="ph ph-dots-three" style="font-size: 18px; color: rgba(255,255,255,0.4)"></i></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Alex Park</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 1px">Solo friend · @alexp</div>
        </div>
        <button type="button" style="background: transparent; border: 0; padding: 4px"><i class="ph ph-dots-three" style="font-size: 18px; color: rgba(255,255,255,0.4)"></i></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img src="https://i.pravatar.cc/72?img=44" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Mia Tanaka</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 1px">Tuesday Night Valorant · @mtanaka</div>
        </div>
        <button type="button" style="background: transparent; border: 0; padding: 4px"><i class="ph ph-dots-three" style="font-size: 18px; color: rgba(255,255,255,0.4)"></i></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Casey Wright</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 1px">Tuesday Night Valorant · @caseyw</div>
        </div>
        <button type="button" style="background: transparent; border: 0; padding: 4px"><i class="ph ph-dots-three" style="font-size: 18px; color: rgba(255,255,255,0.4)"></i></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img src="https://i.pravatar.cc/72?img=27" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Devon Walker</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 1px">Solo friend · @dev</div>
        </div>
        <button type="button" style="background: transparent; border: 0; padding: 4px"><i class="ph ph-dots-three" style="font-size: 18px; color: rgba(255,255,255,0.4)"></i></button>
      </div>
    </div>
  </div>
</div>
