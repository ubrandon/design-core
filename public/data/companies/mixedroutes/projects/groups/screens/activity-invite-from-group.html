<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Invite</span>
      <span style="width: 32px"></span>
    </header>

    <div style="padding: 8px 16px 4px">
      <div style="font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 6px">Nudge specific members</div>
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="" style="width: 18px; height: 18px; border-radius: 50%; object-fit: cover; flex: 0 0 auto" loading="lazy" />
        <span style="font-size: 0.86rem; color: rgba(255,255,255,0.7); line-height: 1.4">All <strong style="color: var(--text); font-weight: 800">Hiking Crew</strong> members can already see this plan. Send a direct nudge to the people you most want to come.</span>
      </div>

      <div class="mr-search-bar" style="margin-bottom: 12px">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search Hiking Crew" autocomplete="off" />
      </div>
    </div>

    <div class="ds-scroll-x" style="display: flex; gap: 8px; padding: 4px 16px 14px">
      <button type="button" class="mr-chip mr-chip-active" style="flex: 0 0 auto">All · 12</button>
      <button type="button" class="mr-chip" style="flex: 0 0 auto">Not yet going · 9</button>
      <button type="button" class="mr-chip" style="flex: 0 0 auto">Going · 2</button>
      <button type="button" class="mr-chip" style="flex: 0 0 auto">Pending · 1</button>
    </div>

    <div style="padding: 0 16px 8px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Going · 2</span>
      <span style="font-size: 0.72rem; color: rgba(255,255,255,0.4); font-weight: 700">Already in</span>
    </div>

    <div style="padding: 0 16px 4px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <span style="position: relative; flex: 0 0 auto">
          <img src="https://i.pravatar.cc/72?img=8" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block" loading="lazy" />
          <span style="position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #34d399; border: 2px solid var(--bg-0); display: inline-flex; align-items: center; justify-content: center">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#06080e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Brandon Unglaub</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Going · <span style="color: #f5c451; font-weight: 700">Host</span></div>
        </div>
        <span aria-label="Already going" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: rgba(52,211,153,0.14); color: #34d399; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">
          <i class="ph-fill ph-check" style="font-size: 10px" aria-hidden="true"></i>
          Going
        </span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <span style="position: relative; flex: 0 0 auto">
          <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block" loading="lazy" />
          <span style="position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #34d399; border: 2px solid var(--bg-0); display: inline-flex; align-items: center; justify-content: center">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#06080e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Riley Stone</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">@riley · Going</div>
        </div>
        <span aria-label="Already going" style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: rgba(52,211,153,0.14); color: #34d399; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">
          <i class="ph-fill ph-check" style="font-size: 10px" aria-hidden="true"></i>
          Going
        </span>
      </div>
    </div>

    <div style="padding: 16px 16px 6px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Pending · 1</span>
    </div>

    <div style="padding: 0 16px 4px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Tom Unglaub</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">@tomu · Nudged 2d ago</div>
        </div>
        <button type="button" style="flex: 0 0 auto; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: var(--text); font-size: 0.78rem; font-weight: 800; cursor: pointer">Nudge again</button>
      </div>
    </div>

    <div style="padding: 16px 16px 6px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Not yet going · 9</span>
      <button type="button" style="background: transparent; border: 0; color: #6dd5ed; font-size: 0.78rem; font-weight: 700">Select all</button>
    </div>

    <div style="padding: 0 16px 8px; display: flex; flex-direction: column">

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Rivera</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@srivera</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: inline-flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e" aria-hidden="true"></i></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=53" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Chen</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@sammy_c</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: inline-flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e" aria-hidden="true"></i></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=20" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Jordan Lee</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@jordanl</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=32" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sarah Kim</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@sarahk</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Jenna Park</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@jenna</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=27" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Devon Walker</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@dev</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=41" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Alex Rivers</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@alex</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=19" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Priya Nair</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@priya</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </label>

      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; cursor: pointer">
        <img src="https://i.pravatar.cc/72?img=45" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Theo Larson</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@theo</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </label>
    </div>

    <div style="padding: 18px 16px 6px">
      <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px dashed rgba(255,255,255,0.16); color: var(--text); text-align: left; cursor: pointer">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.06); color: var(--text); flex: 0 0 auto">
          <i class="ph ph-user-plus" style="font-size: 16px" aria-hidden="true"></i>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.9rem; font-weight: 800; color: var(--text); line-height: 1.2">Invite someone outside the group</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); margin-top: 2px">Friends or a shareable link</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)" aria-hidden="true"></i>
      </button>
    </div>

    <div style="position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 32%); pointer-events: none">
      <div style="pointer-events: auto; display: flex; align-items: center; gap: 10px">
        <button type="button" style="flex: 0 0 auto; padding: 16px 20px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 0; color: var(--text); font-size: 0.95rem; font-weight: 800; cursor: pointer">
          Cancel
        </button>
        <button type="button" style="flex: 1; padding: 16px 20px; border-radius: 999px; background: linear-gradient(135deg,#6dd5ed,#5b8def 60%,#7c6dee); border: 0; color: #ffffff; font-size: 0.95rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph-fill ph-paper-plane-tilt" style="font-size: 14px" aria-hidden="true"></i>
          Nudge 2 members
        </button>
      </div>
    </div>
  </div>
</div>
