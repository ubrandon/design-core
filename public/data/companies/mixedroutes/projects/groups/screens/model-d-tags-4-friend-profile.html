<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <button type="button" class="mr-nav-icon-btn" aria-label="More"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
    </header>

    <div style="display: flex; flex-direction: column; align-items: center; padding: 4px 16px 14px">
      <img src="https://i.pravatar.cc/240?img=51" alt="" style="width: 88px; height: 88px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1)" loading="lazy" />
      <div style="font-size: 1.35rem; font-weight: 800; color: var(--text); margin-top: 12px">Riley Stone</div>
      <div style="color: rgba(255,255,255,0.55); font-size: 0.84rem; margin-top: 2px">@rileyplays</div>

      <div style="display: flex; gap: 5px; margin-top: 10px; align-items: center">
        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(76, 217, 154, 0.14); border: 1px solid rgba(76, 217, 154, 0.28); font-size: 0.7rem; font-weight: 700; color: #8af0c0">
          <i class="ph-fill ph-game-controller" style="font-size: 10px"></i>Gamers
        </span>
        <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 99, 132, 0.12); border: 1px solid rgba(255, 99, 132, 0.26); font-size: 0.7rem; font-weight: 700; color: #ffb6c5">
          <i class="ph-fill ph-heart" style="font-size: 10px"></i>Close
        </span>
        <button type="button" style="display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px; background: transparent; border: 1px dashed rgba(255,255,255,0.18); font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.5)">
          <i class="ph ph-tag" style="font-size: 10px"></i>Tag
        </button>
      </div>
    </div>

    <div style="padding: 0 16px 16px; display: flex; gap: 10px">
      <button type="button" class="btn btn-primary" style="flex: 1; padding: 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><i class="ph-fill ph-calendar-plus" style="font-size: 16px"></i>Plan</button>
      <button type="button" class="btn btn-secondary" style="flex: 1; padding: 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><i class="ph-fill ph-chat-circle" style="font-size: 16px"></i>Message</button>
    </div>

    <div style="padding: 0 16px 8px"><span style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">In groups with you</span></div>

    <div style="padding: 0 16px 6px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6dd5ed, #2193b0); display: flex; align-items: center; justify-content: center; font-size: 18px">🎮</div>
        <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Tuesday Night Valorant</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">8 members · owned by Jake</div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #ff9b6a, #ff5c8a); display: flex; align-items: center; justify-content: center; font-size: 18px">🕹️</div>
        <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Smash Sundays</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">5 members · owned by Riley</div></div>
      </div>
    </div>

    <div style="padding: 18px 16px 0"><span style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Mutual friends · 7</span></div>
    <div style="padding: 10px 16px 0">
      <div class="plan-card-mini-avatar-stack" aria-hidden="true">
        <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
        <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=32" alt="" loading="lazy" />
        <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=8" alt="" loading="lazy" />
        <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
      </div>
    </div>
  </div>
</div>
