<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New circle</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="display: flex; flex-direction: column; align-items: center; padding: 8px 0 18px">
        <button type="button" style="width: 84px; height: 84px; border-radius: 24px; background: rgba(76, 217, 154, 0.18); border: 2px dashed rgba(76, 217, 154, 0.5); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-game-controller" style="font-size: 38px; color: #8af0c0"></i>
        </button>
        <div style="font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-top: 8px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800">Tap to change icon</div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Name</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 6px">
        <input type="text" value="Gamer Friends" style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none" />
      </div>
      <div style="font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-bottom: 18px">Only you'll see this name.</div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px">Try one</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px">
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem; color: rgba(255,255,255,0.7); font-weight: 700">
          <i class="ph-fill ph-heart" style="font-size: 12px; color: #ffb6c5"></i>Close friends
        </button>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem; color: rgba(255,255,255,0.7); font-weight: 700">
          <i class="ph-fill ph-briefcase" style="font-size: 12px; color: #ffd99c"></i>Coworkers
        </button>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem; color: rgba(255,255,255,0.7); font-weight: 700">
          <i class="ph-fill ph-house" style="font-size: 12px; color: #c0c8ff"></i>Family
        </button>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem; color: rgba(255,255,255,0.7); font-weight: 700">
          <i class="ph-fill ph-graduation-cap" style="font-size: 12px; color: #8af0c0"></i>College
        </button>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 0.82rem; color: rgba(255,255,255,0.7); font-weight: 700">
          <i class="ph-fill ph-bicycle" style="font-size: 12px; color: #ffd99c"></i>Cycling
        </button>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Add friends · 4 selected</label>

      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px; margin-bottom: 12px">
        <i class="ph ph-magnifying-glass" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
        <input type="text" placeholder="Find friends…" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.92rem; outline: none" />
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px">Suggested · plays games with you</div>

      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=51" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Riley Stone</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Smash Sundays</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=22" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Jordan Lee</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Tuesday Night Valorant</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=44" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Mia Tanaka</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Tuesday Night Valorant</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Alex Park</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Solo friend · played Valorant together</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Casey Wright</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Solo friend</div></div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 28%)">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">Create circle · 4 friends</button>
    </div>
  </div>
</div>
