<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Post to</label>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px">
        <label style="padding: 12px 14px; border-radius: 14px; background: rgba(173, 130, 255, 0.12); border: 1px solid rgba(173, 130, 255, 0.32); display: flex; align-items: center; gap: 12px; cursor: pointer">
          <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Hiking Crew</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">12 members · own RSVP list</div></div>
          <i class="ph-fill ph-check-square" style="font-size: 22px; color: #c8b3ff"></i>
        </label>
        <label style="padding: 12px 14px; border-radius: 14px; background: rgba(173, 130, 255, 0.12); border: 1px solid rgba(173, 130, 255, 0.32); display: flex; align-items: center; gap: 12px; cursor: pointer">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #ff9b6a, #ff5c8a); display: flex; align-items: center; justify-content: center; font-size: 14px">👨‍👩‍👧</div>
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Family</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">8 members · own RSVP list</div></div>
          <i class="ph-fill ph-check-square" style="font-size: 22px; color: #c8b3ff"></i>
        </label>
        <label style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px; cursor: pointer">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #4cd99a, #2ba56e); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-graduation-cap" style="font-size: 14px; color: white"></i></div>
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">College Friends</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">9 members</div></div>
          <i class="ph ph-square" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
      </div>

      <div style="padding: 12px; border-radius: 12px; background: rgba(173, 130, 255, 0.08); border: 1px solid rgba(173, 130, 255, 0.22); display: flex; gap: 10px; margin-bottom: 18px">
        <i class="ph-fill ph-broadcast" style="font-size: 18px; color: #c8b3ff; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.84rem; font-weight: 800; color: var(--text); margin-bottom: 4px">2 copies will be created</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.65); line-height: 1.5">Each group sees its own version. Edit once — both update. RSVP lists stay separate.</div>
        </div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">What</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 14px">
        <input type="text" value="Baby shower for Mia" style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none" />
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">When</label>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-calendar" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i><span style="color: var(--text); font-size: 0.95rem">Sat, May 11</span>
        </div>
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-clock" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i><span style="color: var(--text); font-size: 0.95rem">2:00 PM</span>
        </div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 28%)">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">Broadcast to 2 groups</button>
    </div>
  </div>
</div>
