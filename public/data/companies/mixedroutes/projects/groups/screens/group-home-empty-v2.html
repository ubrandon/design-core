<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">

    <div style="position: relative; min-height: 360px; overflow: hidden">
      <div
        aria-hidden="true"
        style="
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse at top, rgba(91, 109, 248, 0.45), transparent 65%),
            radial-gradient(ellipse at 30% 80%, rgba(156, 77, 255, 0.32), transparent 60%),
            linear-gradient(180deg, rgba(91, 109, 248, 0.18), rgba(0,0,0,0.4));
        "
      ></div>
      <div
        aria-hidden="true"
        style="
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.05) 36%, rgba(0,0,0,0.45) 78%, var(--bg-0) 100%);
        "
      ></div>

      <div style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 18px 16px 0">
        <button type="button" aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0; color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer">
          <i class="ph ph-arrow-left" style="font-size: 18px" aria-hidden="true"></i>
        </button>
        <button type="button" aria-label="Settings" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0; color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer">
          <i class="ph ph-gear" style="font-size: 18px" aria-hidden="true"></i>
        </button>
      </div>

      <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 18px 16px 22px">
        <div
          style="
            width: 168px;
            height: 168px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5b6df8, #9c4dff);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid rgba(255,255,255,0.16);
            box-shadow: 0 22px 44px rgba(0,0,0,0.5);
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-users-three" style="font-size: 72px; color: rgba(255,255,255,0.95)"></i>
        </div>
        <div style="font-size: 1.75rem; font-weight: 800; color: #fff; margin-top: 14px; letter-spacing: -0.01em">Hiking Crew</div>
        <button type="button" style="background: transparent; border: 0; padding: 0; margin-top: 4px; color: rgba(255,255,255,0.7); font-size: 0.86rem; cursor: pointer">
          3 members <i class="ph ph-caret-right" style="font-size: 10px"></i>
        </button>
      </div>
    </div>

    <div style="padding: 14px 16px 0; display: flex; gap: 10px">
      <button type="button" class="btn btn-primary" style="flex: 1; padding: 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
        <i class="ph-fill ph-calendar-plus" style="font-size: 18px"></i>
        Plan something
      </button>
      <button type="button" class="btn btn-secondary" style="padding: 14px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px">
        <i class="ph-fill ph-chat-circle-text" style="font-size: 18px"></i>
        Chat
      </button>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 14px; width: calc(100% - 32px); margin: 18px 16px 0; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: var(--text); text-align: left; cursor: pointer">
      <div style="display: inline-flex; align-items: center; flex: 0 0 auto">
        <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0)" loading="lazy" />
        <img src="https://i.pravatar.cc/72?img=32" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0); margin-left: -12px" loading="lazy" />
        <img src="https://i.pravatar.cc/72?img=8" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0); margin-left: -12px" loading="lazy" />
        <span
          aria-label="Invite more friends"
          style="
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1.5px dashed rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.7);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: -12px;
            box-shadow: 0 0 0 2px var(--bg-0);
          "
        >
          <i class="ph ph-plus" style="font-size: 14px"></i>
        </span>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); line-height: 1.2">3 members</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 2px">Invite more friends</div>
      </div>
      <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)" aria-hidden="true"></i>
    </button>

    <div style="padding: 22px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Upcoming</span>
      </div>
      <button
        type="button"
        style="
          width: 100%;
          padding: 18px 16px;
          border-radius: 18px;
          background: rgba(255,255,255,0.03);
          border: 1.5px dashed rgba(255,255,255,0.14);
          color: var(--text);
          display: flex;
          align-items: center;
          gap: 12px;
          text-align: left;
          cursor: pointer;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(91, 109, 248, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b9cff;
            flex: 0 0 auto;
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-calendar-plus" style="font-size: 20px"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Plan something</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 2px">No plans yet — get the crew out</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)" aria-hidden="true"></i>
      </button>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Saved places</span>
      </div>
      <button
        type="button"
        style="
          width: 100%;
          padding: 18px 16px;
          border-radius: 18px;
          background: rgba(255,255,255,0.03);
          border: 1.5px dashed rgba(255,255,255,0.14);
          color: var(--text);
          display: flex;
          align-items: center;
          gap: 12px;
          text-align: left;
          cursor: pointer;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(109, 213, 237, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6dd5ed;
            flex: 0 0 auto;
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-map-pin" style="font-size: 20px"></i>
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Save a place</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 2px">Trailheads, coffee stops, meetup spots…</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)" aria-hidden="true"></i>
      </button>
    </div>

  </div>
</div>
