<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 32px">
    <div style="position: relative; padding: 18px 16px 0; background: radial-gradient(ellipse at top, rgba(91, 109, 248, 0.18), transparent 70%), linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0))">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; padding: 12px 0 18px">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80" alt="" style="width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.1)" loading="lazy" />
        <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); margin-top: 12px">Hiking Crew</div>
        <div style="color: rgba(255,255,255,0.55); font-size: 0.85rem; margin-top: 2px">12 members</div>
      </div>
    </div>

    <div style="padding: 18px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Upcoming</span>
        <span class="mr-section-action">View all ›</span>
      </div>

      <div class="mr-plan-rows" style="display: flex; flex-direction: column; gap: 10px">
        <div class="mr-plan-row" style="background: linear-gradient(135deg, rgba(91, 109, 248, 0.4), rgba(255, 99, 132, 0.35)); position: relative">
          <div class="mr-plan-row-media mr-plan-row-media--emoji" style="background: linear-gradient(135deg,#5b6df8,#ff5c8a)" aria-hidden="true">
            <span style="font-size: 36px">🍼</span>
          </div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sat, May 11 · 2 PM</div>
            <div class="mr-plan-row-title">Baby shower for Mia</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px">
              <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(91, 109, 248, 0.22); border: 1px solid rgba(91, 109, 248, 0.4); font-size: 0.7rem; font-weight: 700; color: #c0c8ff">
                <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="" style="width: 12px; height: 12px; border-radius: 3px; object-fit: cover" loading="lazy" />Hiking Crew
              </span>
              <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 99, 132, 0.22); border: 1px solid rgba(255, 99, 132, 0.4); font-size: 0.7rem; font-weight: 700; color: #ffb6c5">
                <span style="font-size: 10px">👨‍👩‍👧</span>Family
              </span>
              <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.7)">
                <i class="ph ph-user-plus" style="font-size: 10px"></i>+1 guest
              </span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=8" alt="" loading="lazy" />
              </div>
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.55)">19 invited across 2 groups</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Cross-group visibility</div>
      <div style="padding: 14px; border-radius: 14px; background: rgba(255, 99, 132, 0.06); border: 1px solid rgba(255, 99, 132, 0.22); display: flex; gap: 10px">
        <i class="ph-fill ph-warning-circle" style="font-size: 18px; color: #ff6384; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.84rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Both groups see each other</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.65); line-height: 1.5">The combined invitee list is visible on the activity card to anyone who can see this plan.</div>
        </div>
      </div>
    </div>
  </div>
</div>
