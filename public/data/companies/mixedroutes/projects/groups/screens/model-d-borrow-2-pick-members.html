<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Borrow members</span>
      <button type="button" style="background: transparent; border: 0; font-size: 0.82rem; font-weight: 700; color: rgba(255,255,255,0.6)">All</button>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(76, 217, 154, 0.08); border: 1px solid rgba(76, 217, 154, 0.22); margin-bottom: 12px">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6dd5ed, #2193b0); display: flex; align-items: center; justify-content: center; font-size: 18px">🎮</div>
        <div style="flex: 1">
          <div style="font-size: 0.9rem; font-weight: 800; color: var(--text)">Tuesday Night Valorant</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.6); display: inline-flex; align-items: center; gap: 5px">
            <i class="ph-fill ph-arrow-bend-up-right" style="font-size: 10px; color: #8af0c0"></i>Borrowing 4 of 8 · group won't see this
          </div>
        </div>
      </div>

      <div style="padding: 12px 14px; border-radius: 14px; background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px; margin-bottom: 16px">
        <i class="ph ph-magnifying-glass" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
        <input type="text" placeholder="Find members…" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.92rem; outline: none" />
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px">Group members · 8</div>

      <div style="display: flex; flex-direction: column">
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer">
          <img src="https://i.pravatar.cc/72?img=51" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Riley Stone</div>
            <div style="display: flex; gap: 4px; margin-top: 2px">
              <span style="display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; background: rgba(76, 217, 154, 0.14); font-size: 0.62rem; font-weight: 700; color: #8af0c0"><i class="ph-fill ph-game-controller" style="font-size: 8px"></i>Gamers</span>
            </div>
          </div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer">
          <img src="https://i.pravatar.cc/72?img=22" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Jordan Lee</div>
            <div style="display: flex; gap: 4px; margin-top: 2px">
              <span style="display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; background: rgba(76, 217, 154, 0.14); font-size: 0.62rem; font-weight: 700; color: #8af0c0"><i class="ph-fill ph-game-controller" style="font-size: 8px"></i>Gamers</span>
            </div>
          </div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer">
          <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Alex Park</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">@alexp</div>
          </div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer">
          <img src="https://i.pravatar.cc/72?img=44" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Mia Tanaka</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">@mtanaka</div>
          </div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer; opacity: 0.5">
          <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Casey Wright</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">@caseyw</div>
          </div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer; opacity: 0.5">
          <img src="https://i.pravatar.cc/72?img=27" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Devon Walker</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">@dev</div>
          </div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer; opacity: 0.5">
          <img src="https://i.pravatar.cc/72?img=8" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Mike Tanaka</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">@miket</div>
          </div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer; opacity: 0.5">
          <img src="https://i.pravatar.cc/72?img=68" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Jake Owen</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">Group owner · @jowen</div>
          </div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 28%)">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 999px">Add 4 to plan</button>
    </div>
  </div>
</div>
