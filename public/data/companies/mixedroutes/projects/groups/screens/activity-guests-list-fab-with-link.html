<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 110px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Guests</span>
      <span style="width: 32px"></span>
    </header>

    <div style="padding: 8px 16px 14px">
      <div style="font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Who's going?</div>
      <div style="font-size: 0.86rem; color: rgba(255,255,255,0.6); line-height: 1.4">3 going · 2 pending · 1 declined</div>
    </div>

    <div style="padding: 0 16px 16px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px dashed rgba(255, 255, 255, 0.14)">
        <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); flex: 0 0 auto">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.86rem; font-weight: 800; color: var(--text); line-height: 1.2">Share an invite link</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px">mr.app/p/sunset-hike-x9k</div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" style="flex: 0 0 auto">Copy</button>
      </div>
    </div>

    <div style="padding: 4px 16px 6px">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Going</span>
    </div>

    <div style="padding: 0 16px 8px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <span style="position: relative; flex: 0 0 auto">
          <img src="https://i.pravatar.cc/72?img=8" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block" loading="lazy" />
          <span style="position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #34d399; border: 2px solid var(--bg-0); display: inline-flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-check" style="font-size: 10px; color: #06080e" aria-hidden="true"></i>
          </span>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Brandon Unglaub</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Going · <span style="color: #f5c451; font-weight: 700">Host</span></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <span style="position: relative; flex: 0 0 auto">
          <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block" loading="lazy" />
          <span style="position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #34d399; border: 2px solid var(--bg-0); display: inline-flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-check" style="font-size: 10px; color: #06080e" aria-hidden="true"></i>
          </span>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Riley Stone</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Going</div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <span style="position: relative; flex: 0 0 auto">
          <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block" loading="lazy" />
          <span style="position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #34d399; border: 2px solid var(--bg-0); display: inline-flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-check" style="font-size: 10px; color: #06080e" aria-hidden="true"></i>
          </span>
        </span>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Rivera</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Going</div>
        </div>
      </div>
    </div>

    <div style="padding: 12px 16px 6px">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Pending</span>
    </div>

    <div style="padding: 0 16px 8px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Tom Unglaub</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Invited · awaiting reply</div>
        </div>
        <button type="button" aria-label="Edit" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,0.06); color: var(--text); cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=53" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Chen</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Invited · awaiting reply</div>
        </div>
        <button type="button" aria-label="Edit" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,0.06); color: var(--text); cursor: pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
      </div>
    </div>

    <div style="padding: 12px 16px 6px">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Can't make it</span>
    </div>

    <div style="padding: 0 16px 8px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px; opacity: 0.55">
        <img src="https://i.pravatar.cc/72?img=20" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Jordan Lee</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">Declined</div>
        </div>
      </div>
    </div>

    <div style="position: fixed; bottom: 88px; right: 16px; z-index: 2">
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 14px 20px; border-radius: 999px; background: linear-gradient(135deg,#6dd5ed,#5b8def 60%,#7c6dee); border: 0; color: #ffffff; font-size: 0.95rem; font-weight: 800; cursor: pointer; box-shadow: 0 12px 32px rgba(91,141,239,0.45), 0 4px 12px rgba(0,0,0,0.3)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add guests
      </button>
    </div>

    <div style="position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 32%); pointer-events: none">
      <div style="pointer-events: auto; display: flex; align-items: center; gap: 10px">
        <button type="button" style="flex: 1; padding: 16px 20px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 0; color: var(--text); font-size: 0.95rem; font-weight: 800; cursor: pointer">
          Done
        </button>
      </div>
    </div>
  </div>
</div>
