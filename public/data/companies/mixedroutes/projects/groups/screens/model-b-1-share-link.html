<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Share plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="padding: 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.12); border: 1px solid rgba(91, 109, 248, 0.3); display: flex; align-items: center; gap: 12px; margin-bottom: 14px">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" style="width: 36px; height: 36px; border-radius: 10px; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase">Sharing with</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Hiking Crew + anyone with link</div>
        </div>
      </div>

      <div style="padding: 14px; border-radius: 14px; background: rgba(255, 191, 80, 0.08); border: 1px solid rgba(255, 191, 80, 0.25); display: flex; gap: 12px; margin-bottom: 18px">
        <i class="ph-fill ph-warning-circle" style="font-size: 20px; color: #ffbf50; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--text); margin-bottom: 4px">RSVP joins the group</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.7); line-height: 1.5">Anyone who RSVPs through this link will be added to Hiking Crew and see future plans &amp; chat.</div>
        </div>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Plan</div>
      <div class="mr-plan-rows" style="display: flex; flex-direction: column; margin-bottom: 22px">
        <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)">
          <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)" aria-hidden="true"></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
            <div class="mr-plan-row-title">Sunrise hike at Craggy</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i><span>Craggy Pinnacle</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Invite link</div>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px; margin-bottom: 14px">
        <i class="ph ph-link-simple" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
        <span style="flex: 1; color: var(--text); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">mr.app/p/9k2-craggy</span>
        <button type="button" style="font-size: 0.78rem; font-weight: 800; color: #6dd5ed; background: transparent; border: 0">Copy</button>
      </div>

      <div style="display: flex; gap: 10px">
        <button type="button" class="btn btn-secondary" style="flex: 1; padding: 13px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><i class="ph ph-whatsapp-logo" style="font-size: 16px"></i>Share</button>
        <button type="button" class="btn btn-primary" style="flex: 1; padding: 13px; border-radius: 999px">Done</button>
      </div>
    </div>
  </div>
</div>
