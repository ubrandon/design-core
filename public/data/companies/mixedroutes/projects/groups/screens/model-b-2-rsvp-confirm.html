<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="padding-bottom: 32px; filter: brightness(0.55); flex: 1">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">You're invited</span>
      <div style="width: 36px"></div>
    </header>
    <div style="padding: 6px 16px 0">
      <div class="mr-plan-rows" style="display: flex; flex-direction: column">
        <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)">
          <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)" aria-hidden="true"></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
            <div class="mr-plan-row-title">Sunrise hike at Craggy</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 20px 16px 24px; background: rgba(1, 11, 20, 0.96); backdrop-filter: blur(12px); border-top-left-radius: 22px; border-top-right-radius: 22px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: -22px; position: relative; z-index: 2">
    <div class="mr-scope" style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" style="width: 44px; height: 44px; border-radius: 12px; object-fit: cover" loading="lazy" />
        <div style="flex: 1">
          <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase">Hosted by</div>
          <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Hiking Crew · 12 members</div>
        </div>
      </div>

      <div style="padding: 14px; border-radius: 14px; background: rgba(255, 191, 80, 0.1); border: 1px solid rgba(255, 191, 80, 0.3); display: flex; gap: 12px">
        <i class="ph-fill ph-info" style="font-size: 20px; color: #ffbf50; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text); margin-bottom: 4px">RSVP'ing joins the group</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.7); line-height: 1.5">You'll be added to Hiking Crew. You'll see future plans, chat history, and the member list. You can leave anytime.</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px">
        <button type="button" class="btn btn-secondary" style="flex: 1; padding: 14px; border-radius: 999px">Maybe</button>
        <button type="button" class="btn btn-primary" style="flex: 2; padding: 14px; border-radius: 999px">Going · Join group</button>
      </div>
      <button type="button" style="background: transparent; border: 0; padding: 4px; color: rgba(255,255,255,0.5); font-size: 0.78rem">Can't go</button>
    </div>
  </div>
</div>
