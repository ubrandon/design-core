<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="display: flex; flex-direction: column; flex: 1">
    <header
      style="
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        background: var(--bg-0);
        position: sticky;
        top: 0;
        z-index: 5;
      "
    >
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; flex: 1; background: transparent; border: 0; padding: 0; min-width: 0; text-align: left">
        <img
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80"
          alt=""
          style="width: 36px; height: 36px; border-radius: 10px; object-fit: cover"
          loading="lazy"
        />
        <div style="min-width: 0; flex: 1">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Hiking Crew</div>
          <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">12 members</div>
        </div>
      </button>
      <button type="button" class="mr-nav-icon-btn" aria-label="Group info">
        <i class="ph ph-dots-three-vertical" aria-hidden="true"></i>
      </button>
    </header>

    <div style="flex: 1; padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 14px">
      <div style="text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.4); letter-spacing: 0.06em; text-transform: uppercase">Today</div>

      <div style="display: flex; gap: 10px; align-items: flex-end">
        <img src="https://i.pravatar.cc/56?img=32" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="max-width: 78%">
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-bottom: 4px; padding-left: 6px">Sarah</div>
          <div style="background: rgba(255,255,255,0.06); padding: 10px 14px; border-radius: 18px 18px 18px 4px; color: var(--text); font-size: 0.92rem">
            Anyone down for Craggy Saturday morning? Forecast looks 🔥
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-end">
        <img src="https://i.pravatar.cc/56?img=8" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="max-width: 78%">
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-bottom: 4px; padding-left: 6px">Mike</div>
          <div style="background: rgba(255,255,255,0.06); padding: 10px 14px; border-radius: 18px 18px 18px 4px; color: var(--text); font-size: 0.92rem">
            I'm in. Sunrise?
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-end">
        <img src="https://i.pravatar.cc/56?img=32" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="max-width: 86%">
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-bottom: 4px; padding-left: 6px">Sarah · pinned a plan</div>
          <div class="plan-card plan-card-mini plan-card-hiking" style="width: 100%; max-width: 280px">
            <div class="plan-card-mini-media" aria-hidden="true"></div>
            <div class="plan-card-mini-body">
              <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
              <div class="plan-card-mini-title">Sunrise hike at Craggy</div>
              <div class="plan-card-mini-location">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Craggy Pinnacle</span>
              </div>
              <div class="plan-card-mini-social">
                <span>3 going · open to group</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end">
        <div style="max-width: 78%">
          <div
            style="
              background: linear-gradient(135deg, #6dd5ed, #2193b0);
              color: #06080e;
              padding: 10px 14px;
              border-radius: 18px 18px 4px 18px;
              font-size: 0.92rem;
              font-weight: 600;
            "
          >
            yesss count me in 🥾
          </div>
          <div style="font-size: 0.66rem; color: rgba(255,255,255,0.4); margin-top: 4px; text-align: right">Read · 9:42 AM</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: flex-end">
        <img src="https://i.pravatar.cc/56?img=14" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="max-width: 78%">
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-bottom: 4px; padding-left: 6px">Jenna</div>
          <div style="background: rgba(255,255,255,0.06); padding: 10px 14px; border-radius: 18px 18px 18px 4px; color: var(--text); font-size: 0.92rem">
            I'll bring coffee + bagels for the group ☕️
          </div>
        </div>
      </div>

      <div style="text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.4)">Mike is typing…</div>
    </div>

    <div style="position: sticky; bottom: 0; padding: 8px 10px 16px; background: linear-gradient(180deg, transparent, var(--bg-0) 30%); border-top: 1px solid rgba(255,255,255,0.04)">
      <div
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px 8px 8px 14px;
          border-radius: 999px;
          background: var(--mr-input-surface);
        "
      >
        <button type="button" style="background: transparent; border: 0; padding: 6px; color: rgba(255,255,255,0.7)" aria-label="Add">
          <i class="ph-fill ph-plus-circle" style="font-size: 22px"></i>
        </button>
        <input
          type="text"
          placeholder="Message Hiking Crew…"
          style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none"
        />
        <button type="button" style="background: transparent; border: 0; padding: 6px; color: rgba(255,255,255,0.7)" aria-label="Camera">
          <i class="ph ph-camera" style="font-size: 22px"></i>
        </button>
        <button
          type="button"
          aria-label="Send"
          style="
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            border: 0;
            color: #06080e;
            display: flex;
            align-items: center;
            justify-content: center;
          "
        >
          <i class="ph-fill ph-paper-plane-tilt" style="font-size: 16px"></i>
        </button>
      </div>
    </div>
  </div>
</div>
