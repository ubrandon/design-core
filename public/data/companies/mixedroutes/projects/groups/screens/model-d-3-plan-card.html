<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 8px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px">
      <span style="font-size: 1.6rem; font-weight: 800; color: var(--text)">Plans</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Notifications"><i class="ph ph-bell" aria-hidden="true"></i></button>
        <img class="mr-top-nav-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
      </div>
    </header>

    <div style="padding: 0 16px 8px">
      <div class="mr-chip-row" style="padding: 2px 0">
        <button type="button" class="mr-chip mr-chip-active">Upcoming</button>
        <button type="button" class="mr-chip">Past</button>
      </div>
    </div>

    <div style="padding: 14px 16px 0">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 12px">This week</div>

      <div class="mr-plan-rows" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px">
        <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)">
          <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)" aria-hidden="true"></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
            <div class="mr-plan-row-title">Sunrise hike at Craggy</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo"><i class="ph-fill ph-map-pin" aria-hidden="true"></i><span>Craggy Pinnacle</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=32" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=47" alt="" loading="lazy" />
              </div>
              <span style="font-size: 0.75rem; color: #6dd5ed; font-weight: 800">You're going</span>
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.4)">·</span>
              <span style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">13 invited</span>
            </div>
          </div>
        </div>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 12px">Audience</div>

      <div style="padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 10px">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px">
          <i class="ph-fill ph-users-three" style="font-size: 16px; color: rgba(255,255,255,0.6)"></i>
          <span style="font-size: 0.78rem; font-weight: 800; color: var(--text)">Invited</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: rgba(91, 109, 248, 0.16); border: 1px solid rgba(91, 109, 248, 0.3); font-size: 0.74rem; font-weight: 700; color: #c0c8ff">
            <i class="ph-fill ph-circles-three" style="font-size: 11px"></i>Hiking Crew · 12
          </span>
          <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); font-size: 0.74rem; font-weight: 700; color: var(--text)">
            <img src="https://i.pravatar.cc/40?img=47" alt="" style="width: 14px; height: 14px; border-radius: 50%" loading="lazy" />Sam Rivera
          </span>
        </div>
      </div>

      <div style="padding: 14px; border-radius: 14px; background: rgba(76, 217, 154, 0.06); border: 1px solid rgba(76, 217, 154, 0.18); display: flex; gap: 10px">
        <i class="ph-fill ph-shield-check" style="font-size: 18px; color: #8af0c0; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.84rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Regular plan · group untouched</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.65); line-height: 1.5">Sam doesn't see Hiking Crew chat or members. The group's home isn't affected.</div>
        </div>
      </div>
    </div>
  </div>
</div>
