<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 8px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <span style="font-size: 1.6rem; font-weight: 800; color: var(--text)">People</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Notifications">
          <i class="ph-fill ph-bell" aria-hidden="true"></i>
        </button>
        <img class="mr-top-nav-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
      </div>
    </header>

    <div style="padding: 6px 16px 12px">
      <div class="mr-search-bar">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search all users…" autocomplete="off" />
      </div>
    </div>

    <div style="padding: 0 16px 6px">
      <div class="mr-chip-row" style="padding: 2px 0">
        <button type="button" class="mr-chip mr-chip-active">Friends</button>
        <button type="button" class="mr-chip">
          Interests <i class="ph ph-caret-down" aria-hidden="true" style="font-size: 12px"></i>
        </button>
      </div>
    </div>

    <div style="padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Groups</span>
    </div>

    <div style="padding: 0 16px 4px">
      <button
        type="button"
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          width: 100%;
          padding: 14px 14px;
          border-radius: 16px;
          background: rgba(255,255,255,0.04);
          border: 1px dashed rgba(255,255,255,0.14);
          color: var(--text);
          text-align: left;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #5b6df8, #9c4dff);
            display: flex;
            align-items: center;
            justify-content: center;
          "
          aria-hidden="true"
        >
          <i class="ph-fill ph-users-three" style="font-size: 20px; color: rgba(255,255,255,0.92)"></i>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800">Create your first group</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">A space for plans, chat, and lists with the same crew.</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
      </button>
    </div>

    <div style="padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Friends</span>
      <span class="mr-section-action">
        Invite
      </span>
    </div>

    <div style="padding: 0 16px 4px">
      <div
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 14px 14px;
          border-radius: 16px;
          background: rgba(255, 255, 255, 0.03);
          border: 1px dashed rgba(255,255,255,0.10);
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
          "
          aria-hidden="true"
        >
          🤝
        </div>
        <div style="flex: 1">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">No friends yet</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">Invite people you know or add them from All users.</div>
        </div>
        <i class="ph ph-caret-right" aria-hidden="true" style="color: rgba(255, 255, 255, 0.4)"></i>
      </div>
    </div>

    <div style="padding: 14px 16px 6px">
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">All users</span>
    </div>

    <div style="padding: 0 16px 12px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img
          src="https://i.pravatar.cc/72?img=21"
          alt=""
          width="48"
          height="48"
          style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover"
          loading="lazy"
        />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Maya Patel</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">Asheville · Yoga, Pottery</div>
        </div>
        <button
          type="button"
          class="mr-chip"
          style="font-size: 0.74rem; font-weight: 800; padding: 6px 12px"
        >
          Add
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
        <img
          src="https://i.pravatar.cc/72?img=58"
          alt=""
          width="48"
          height="48"
          style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover"
          loading="lazy"
        />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Daniel Ortiz</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">Asheville · Hiking, Photography</div>
        </div>
        <button
          type="button"
          class="mr-chip"
          style="font-size: 0.74rem; font-weight: 800; padding: 6px 12px"
        >
          Add
        </button>
      </div>
    </div>

    <div
      style="
        position: sticky;
        bottom: 0;
        z-index: 5;
        margin-top: 16px;
        padding-top: 8px;
        background: linear-gradient(180deg, transparent, var(--bg-0) 28%);
      "
    >
      <div class="mr-tab-bar" style="margin: 0 8px 0">
        <button type="button" class="mr-tab-item" aria-label="Plans">
          <i class="ph ph-calendar-blank" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Discover">
          <i class="ph ph-compass" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create">
          <i class="ph ph-plus-circle" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="People">
          <i class="ph-fill ph-user" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Chats">
          <i class="ph ph-chat-teardrop-text" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
