<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Add to plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px; margin-bottom: 16px">
        <i class="ph ph-magnifying-glass" style="font-size: 18px; color: rgba(255,255,255,0.55)"></i>
        <input type="text" value="Sam Rivera" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none" />
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">From Hiking Crew</div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; margin-bottom: 6px">
        <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Sam Chen</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Member</div></div>
        <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #6dd5ed"></i>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding: 14px 0 10px">From Family</div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; margin-bottom: 6px">
        <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Casey Mom</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Member</div></div>
        <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 14px 0"></div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Other friends</div>
      <div style="padding: 12px 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.08); border: 1px solid rgba(91, 109, 248, 0.25); display: flex; align-items: center; gap: 12px">
        <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Sam Rivera</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Friend · won't join either group</div>
        </div>
        <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #6dd5ed"></i>
      </div>

      <div style="margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: rgba(255, 191, 80, 0.08); border: 1px solid rgba(255, 191, 80, 0.22); display: flex; gap: 10px">
        <i class="ph ph-question" style="font-size: 18px; color: #ffbf50; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.82rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Chat access?</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.65); line-height: 1.5">Sam isn't in any attached group. Should they see the activity chat? <span style="color: #6dd5ed; font-weight: 700">Q11 unresolved</span></div>
        </div>
      </div>

      <div style="margin-top: 14px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
        <div style="font-size: 0.78rem; font-weight: 800; color: var(--text); margin-bottom: 8px">Invited · 18 + 1 guest</div>
        <div class="plan-card-mini-avatar-stack" aria-hidden="true">
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=47" alt="" loading="lazy" style="border: 2px solid #6dd5ed" />
        </div>
      </div>
    </div>
  </div>
</div>
