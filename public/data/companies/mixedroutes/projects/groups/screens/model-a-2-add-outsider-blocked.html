<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Add to plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px; margin-bottom: 16px">
        <i class="ph ph-magnifying-glass" style="font-size: 18px; color: rgba(255,255,255,0.55)"></i>
        <input type="text" value="Sam" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none" />
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Hiking Crew · 12 members</div>

      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
          <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Sam Chen</div><div style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">In this group</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #6dd5ed"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
          <img src="https://i.pravatar.cc/72?img=32" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Sam Patel</div><div style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">In this group</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #6dd5ed"></i>
        </div>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 14px 0 14px"></div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Friends not in this group</div>

      <div style="padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px; opacity: 0.65">
        <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 40px; height: 40px; border-radius: 50%; filter: grayscale(0.4)" loading="lazy" />
        <div style="flex: 1">
          <div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Sam Rivera</div>
          <div style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">Your partner · not in Hiking Crew</div>
        </div>
        <i class="ph ph-lock-simple" style="font-size: 18px; color: rgba(255,255,255,0.45)"></i>
      </div>

      <div style="margin-top: 14px; padding: 14px; border-radius: 14px; background: rgba(255, 191, 80, 0.08); border: 1px solid rgba(255, 191, 80, 0.25); display: flex; gap: 12px">
        <i class="ph-fill ph-warning-circle" style="font-size: 20px; color: #ffbf50; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.85rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Group plans are members-only</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 10px">To invite Sam Rivera, either add them to Hiking Crew, or switch this to a regular plan.</div>
          <div style="display: flex; gap: 8px">
            <button type="button" class="btn btn-secondary" style="padding: 9px 14px; border-radius: 999px; font-size: 0.78rem">Add to group</button>
            <button type="button" class="btn btn-secondary" style="padding: 9px 14px; border-radius: 999px; font-size: 0.78rem">Switch to regular plan</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
