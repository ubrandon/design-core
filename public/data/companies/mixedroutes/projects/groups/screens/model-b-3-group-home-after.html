<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 32px">
    <div style="position: relative; padding: 18px 16px 0; background: radial-gradient(ellipse at top, rgba(91, 109, 248, 0.18), transparent 70%), linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0))">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; padding: 12px 0 18px">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80" alt="" style="width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.1)" loading="lazy" />
        <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); margin-top: 12px">Hiking Crew</div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px">
          <span style="color: rgba(255,255,255,0.55); font-size: 0.85rem">15 members</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: rgba(91, 109, 248, 0.16); border: 1px solid rgba(91, 109, 248, 0.3); font-size: 0.7rem; font-weight: 700; color: #a8b3ff">+3 new</span>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.04)">
      <div style="display: flex; gap: 10px">
        <button type="button" class="btn btn-primary" style="flex: 1; padding: 13px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><i class="ph-fill ph-calendar-plus" style="font-size: 16px"></i>Plan something</button>
        <button type="button" class="btn btn-secondary" style="padding: 13px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px"><i class="ph-fill ph-chat-circle-text" style="font-size: 16px"></i>Chat</button>
      </div>
    </div>

    <div style="padding: 18px 16px 0">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Just joined</div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px">
        <div style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px">
          <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.88rem; font-weight: 700; color: var(--text)">Sam Rivera</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Joined via Sunrise hike RSVP</div></div>
        </div>
        <div style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px">
          <img src="https://i.pravatar.cc/72?img=51" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.88rem; font-weight: 700; color: var(--text)">Riley Stone</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Joined via Sunrise hike RSVP</div></div>
        </div>
        <div style="padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px">
          <img src="https://i.pravatar.cc/72?img=22" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.88rem; font-weight: 700; color: var(--text)">Jordan Lee</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Joined via Sunrise hike RSVP</div></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Upcoming</span>
      </div>

      <div class="mr-plan-rows" style="display: flex; flex-direction: column; gap: 10px">
        <div class="mr-plan-row mr-plan-row--photo-blur" style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)">
          <div class="mr-plan-row-media" style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)" aria-hidden="true"></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
            <div class="mr-plan-row-title">Sunrise hike at Craggy</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo"><i class="ph-fill ph-map-pin" aria-hidden="true"></i><span>Craggy Pinnacle</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=47" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=51" alt="" loading="lazy" />
              </div>
              <span style="font-size: 0.75rem; color: rgba(255,255,255,0.5)">11 going · 3 joined via link</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
