<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: rgba(0, 0, 0, 0.7); overflow-x: clip; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px">
  <div
    style="
      width: 100%;
      max-width: 340px;
      background: var(--bg-0);
      border-radius: 22px;
      padding: 24px 22px 18px;
      border: 1px solid rgba(255, 122, 133, 0.25);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    "
  >
    <div class="mr-scope">
      <div
        style="
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: rgba(255, 122, 133, 0.12);
          border: 1px solid rgba(255, 122, 133, 0.35);
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0 auto 14px;
        "
      >
        <i class="ph ph-warning" style="font-size: 26px; color: #ff7a85"></i>
      </div>
      <div style="font-size: 1.15rem; font-weight: 800; color: var(--text); text-align: center; margin-bottom: 8px">Delete Hiking Crew?</div>
      <div style="font-size: 0.86rem; color: rgba(255,255,255,0.6); line-height: 1.5; text-align: center; margin-bottom: 16px">
        This permanently removes the group, its chat history, and all shared plans for everyone. This can't be undone.
      </div>

      <div style="padding: 12px 14px; border-radius: 12px; background: rgba(255, 122, 133, 0.06); border: 1px solid rgba(255, 122, 133, 0.18); margin-bottom: 16px">
        <div style="font-size: 0.74rem; color: rgba(255, 122, 133, 0.85); font-weight: 700; margin-bottom: 4px">Will be lost</div>
        <ul style="margin: 0; padding-left: 18px; font-size: 0.82rem; color: rgba(255,255,255,0.7); line-height: 1.7">
          <li>238 chat messages</li>
          <li>4 upcoming plans</li>
          <li>2 shared lists (will be unattached)</li>
        </ul>
      </div>

      <div style="font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-bottom: 8px">
        Type <strong style="color: var(--text); font-family: ui-monospace, SFMono-Regular, monospace">Hiking Crew</strong> to confirm
      </div>
      <div
        style="
          padding: 12px 14px;
          border-radius: var(--mr-input-radius);
          background: var(--mr-input-surface);
          border: 1.5px solid rgba(255, 122, 133, 0.4);
          margin-bottom: 18px;
        "
      >
        <input
          type="text"
          placeholder="Hiking Crew"
          style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none; font-family: ui-monospace, SFMono-Regular, monospace"
        />
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button
          type="button"
          disabled
          style="
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            background: rgba(255, 122, 133, 0.18);
            border: 1px solid rgba(255, 122, 133, 0.3);
            color: rgba(255, 122, 133, 0.55);
            font-size: 0.95rem;
            font-weight: 800;
            cursor: not-allowed;
          "
        >
          Delete group
        </button>
        <button
          type="button"
          style="
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            background: transparent;
            border: 0;
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            font-weight: 700;
          "
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
