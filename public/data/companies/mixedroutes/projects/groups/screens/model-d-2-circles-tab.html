<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px">
      <span style="font-size: 1.6rem; font-weight: 800; color: var(--text)">Friends</span>
      <button type="button" class="mr-nav-icon-btn" aria-label="Add"><i class="ph ph-plus" aria-hidden="true"></i></button>
    </header>

    <div style="padding: 0 16px 8px">
      <div class="mr-chip-row" style="padding: 2px 0">
        <button type="button" class="mr-chip">All</button>
        <button type="button" class="mr-chip">Groups · 3</button>
        <button type="button" class="mr-chip mr-chip-active">Circles · 4</button>
      </div>
    </div>

    <div style="padding: 14px 16px 0">
      <div style="padding: 12px 14px; border-radius: 12px; background: rgba(76, 217, 154, 0.08); border: 1px solid rgba(76, 217, 154, 0.22); display: flex; gap: 10px; margin-bottom: 16px">
        <i class="ph-fill ph-lock-key" style="font-size: 18px; color: #8af0c0; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.84rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Only you can see your circles</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.65); line-height: 1.5">Tag friends into circles to plan with them faster. They never know they're in one.</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="padding: 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.08); border: 1px solid rgba(91, 109, 248, 0.22)">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px">
            <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(91, 109, 248, 0.25); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-circles-three" style="font-size: 18px; color: #c0c8ff"></i></div>
            <div style="flex: 1"><div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Hiking Crew</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">12 friends · also a group</div></div>
            <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
          </div>
          <div class="plan-card-mini-avatar-stack" aria-hidden="true">
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=32" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=8" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
          </div>
        </div>

        <div style="padding: 14px; border-radius: 14px; background: rgba(255, 99, 132, 0.08); border: 1px solid rgba(255, 99, 132, 0.22)">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px">
            <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 99, 132, 0.25); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-heart" style="font-size: 18px; color: #ffb6c5"></i></div>
            <div style="flex: 1"><div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Close friends</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">8 friends</div></div>
            <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
          </div>
          <div class="plan-card-mini-avatar-stack" aria-hidden="true">
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=27" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=47" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=19" alt="" loading="lazy" />
          </div>
        </div>

        <div style="padding: 14px; border-radius: 14px; background: rgba(255, 191, 80, 0.08); border: 1px solid rgba(255, 191, 80, 0.22)">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px">
            <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 191, 80, 0.25); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-briefcase" style="font-size: 18px; color: #ffd99c"></i></div>
            <div style="flex: 1"><div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Coworkers</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">6 friends</div></div>
            <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
          </div>
          <div class="plan-card-mini-avatar-stack" aria-hidden="true">
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=51" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=33" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=22" alt="" loading="lazy" />
          </div>
        </div>

        <div style="padding: 14px; border-radius: 14px; background: rgba(76, 217, 154, 0.08); border: 1px solid rgba(76, 217, 154, 0.22)">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px">
            <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(76, 217, 154, 0.25); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-graduation-cap" style="font-size: 18px; color: #8af0c0"></i></div>
            <div style="flex: 1"><div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">College</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">9 friends</div></div>
            <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
          </div>
        </div>

        <button type="button" style="padding: 14px; border-radius: 14px; background: transparent; border: 1px dashed rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; gap: 10px; color: rgba(255,255,255,0.6); font-size: 0.88rem; font-weight: 700">
          <i class="ph ph-plus-circle" style="font-size: 18px"></i>New circle
        </button>
      </div>
    </div>
  </div>
</div>
