<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="padding-bottom: 20px; filter: brightness(0.45); flex: 1">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <span style="font-size: 1.6rem; font-weight: 800; color: var(--text)">Friends</span>
    </header>
    <div style="padding: 16px 16px 0; display: flex; align-items: center; gap: 12px">
      <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 40px; height: 40px; border-radius: 50%" loading="lazy" />
      <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 700; color: var(--text)">Alex Park</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">@alexp</div></div>
    </div>
  </div>

  <div style="padding: 18px 16px 24px; background: rgba(1, 11, 20, 0.97); backdrop-filter: blur(14px); border-top-left-radius: 22px; border-top-right-radius: 22px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: -22px; position: relative; z-index: 2">
    <div class="mr-scope" style="display: flex; flex-direction: column; gap: 12px">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 0 auto 4px"></div>

      <div style="display: flex; align-items: center; gap: 12px">
        <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
        <div style="flex: 1"><div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Tag Alex Park as…</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">Alex won't see this</div></div>
      </div>

      <div style="padding: 12px 14px; border-radius: 12px; background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
        <i class="ph ph-tag" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
        <input type="text" value="Cycl" placeholder="Type a tag name…" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.92rem; outline: none" />
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(91, 109, 248, 0.1); border: 1px solid rgba(91, 109, 248, 0.28); cursor: pointer; text-align: left">
          <i class="ph-fill ph-plus-circle" style="font-size: 20px; color: #c0c8ff"></i>
          <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Create "Cycl..."</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">New tag · only you'll see it</div></div>
          <i class="ph ph-corner-down-left" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
        </button>

        <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px; background: transparent; border: 0; cursor: pointer; text-align: left">
          <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; background: rgba(255, 191, 80, 0.16); border: 1px solid rgba(255, 191, 80, 0.32); font-size: 0.78rem; font-weight: 700; color: #ffd99c">
            <i class="ph-fill ph-bicycle" style="font-size: 11px"></i>Cycling
          </span>
          <span style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">4 friends</span>
          <span style="flex: 1"></span>
          <i class="ph ph-square" style="font-size: 18px; color: rgba(255,255,255,0.3)"></i>
        </button>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 4px 0"></div>

      <div style="font-size: 0.66rem; font-weight: 800; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 4px">Already tagged</div>

      <div style="display: flex; flex-direction: column; gap: 2px">
        <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: transparent; border: 0; cursor: pointer; text-align: left">
          <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; background: rgba(76, 217, 154, 0.18); border: 1px solid rgba(76, 217, 154, 0.32); font-size: 0.78rem; font-weight: 700; color: #8af0c0">
            <i class="ph-fill ph-game-controller" style="font-size: 11px"></i>Gamers
          </span>
          <span style="flex: 1"></span>
          <i class="ph-fill ph-check-square" style="font-size: 18px; color: #8af0c0"></i>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: transparent; border: 0; cursor: pointer; text-align: left">
          <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 999px; background: rgba(255, 191, 80, 0.16); border: 1px solid rgba(255, 191, 80, 0.32); font-size: 0.78rem; font-weight: 700; color: #ffd99c">
            <i class="ph-fill ph-briefcase" style="font-size: 11px"></i>Coworkers
          </span>
          <span style="flex: 1"></span>
          <i class="ph-fill ph-check-square" style="font-size: 18px; color: #ffd99c"></i>
        </button>
      </div>

      <div style="padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; gap: 8px; margin-top: 4px">
        <i class="ph ph-info" style="font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 2px"></i>
        <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); line-height: 1.4">Tags are private. Alex isn't notified. You can untag any time.</div>
      </div>
    </div>
  </div>
</div>
