<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 8px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px">
      <span style="font-size: 1.6rem; font-weight: 800; color: var(--text)">Plans</span>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Notifications">
          <i class="ph ph-bell" aria-hidden="true"></i>
        </button>
        <img class="mr-top-nav-avatar" src="https://i.pravatar.cc/72?img=11" alt="" width="36" height="36" loading="lazy" />
      </div>
    </header>

    <div style="padding: 0 16px 8px">
      <div class="mr-chip-row" style="padding: 2px 0">
        <button type="button" class="mr-chip mr-chip-active">Upcoming</button>
        <button type="button" class="mr-chip">Past</button>
        <button type="button" class="mr-chip">Invites · 2</button>
      </div>
    </div>

    <div style="padding: 14px 16px 0">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 12px">This week</div>

      <div class="mr-plan-rows">

        <div
          class="mr-plan-row mr-plan-row--photo-blur"
          style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
        >
          <div
            class="mr-plan-row-media"
            style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=280&amp;h=280&amp;q=80)"
            aria-hidden="true"
          ></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">SAT, APR 27 · 7 AM</div>
            <div class="mr-plan-row-title">Sunrise hike at Craggy</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Craggy Pinnacle</span>
              </div>
              <div class="mr-plan-row-avatar-stack" aria-hidden="true">
                <div style="display: flex; align-items: center">
                  <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="" style="width: 26px; height: 26px; border-radius: 7px; object-fit: cover; flex-shrink: 0; position: relative; z-index: 4" loading="lazy" />
                  <img src="https://i.pravatar.cc/48?img=12" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-left: -7px; position: relative; z-index: 2; box-shadow: 0 0 0 2px rgba(0,0,0,0.15)" loading="lazy" />
                  <img src="https://i.pravatar.cc/48?img=32" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-left: -7px; position: relative; z-index: 1; box-shadow: 0 0 0 2px rgba(0,0,0,0.15)" loading="lazy" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div
          class="mr-plan-row mr-plan-row--photo-blur"
          style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
        >
          <div
            class="mr-plan-row-media"
            style="background-image: url(https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&amp;fit=crop&amp;w=280&amp;h=280&amp;q=80)"
            aria-hidden="true"
          ></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">TODAY · 2 PM</div>
            <div class="mr-plan-row-title">Cafe meetup</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Asheville NC</span>
              </div>
              <div class="mr-plan-row-avatar-stack" aria-hidden="true">
                <div class="plan-card-mini-avatar-stack">
                  <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=14" alt="" loading="lazy" />
                  <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=27" alt="" loading="lazy" />
                  <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=8" alt="" loading="lazy" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 12px">Next week</div>

      <div class="mr-plan-rows">
        <div class="mr-plan-row" style="background: linear-gradient(135deg, rgba(58, 69, 102, 0.55), rgba(31, 39, 65, 0.7))">
          <div class="mr-plan-row-media mr-plan-row-media--emoji" style="background: linear-gradient(135deg,#3a4566,#1f2741)" aria-hidden="true">
            <span style="font-size: 36px">🥾</span>
          </div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">SUN, MAY 5 · 8 AM</div>
            <div class="mr-plan-row-title">Mt. Mitchell day trip</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Black Mountain</span>
              </div>
              <div class="mr-plan-row-avatar-stack" aria-hidden="true">
                <div class="plan-card-mini-avatar-stack">
                  <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=22" alt="" loading="lazy" />
                  <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=44" alt="" loading="lazy" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div
          class="mr-plan-row mr-plan-row--photo-blur"
          style="--mr-plan-row-bg: url(https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=320&amp;h=320&amp;q=80)"
        >
          <div
            class="mr-plan-row-media"
            style="background-image: url(https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=280&amp;h=280&amp;q=80)"
            aria-hidden="true"
          ></div>
          <div class="mr-plan-row-content">
            <div class="plan-card-mini-time">FRI, MAY 9 · 8 PM</div>
            <div class="mr-plan-row-title">RENT in concert 🎭</div>
            <div class="mr-plan-row-meta">
              <div class="mr-plan-row-when-where-item mr-plan-row-when-where-item--solo">
                <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
                <span>Times Square</span>
              </div>
              <div class="mr-plan-row-avatar-stack" aria-hidden="true">
                <div style="display: flex; align-items: center">
                  <img src="https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="" style="width: 26px; height: 26px; border-radius: 7px; object-fit: cover; flex-shrink: 0; position: relative; z-index: 5" loading="lazy" />
                  <img src="https://i.pravatar.cc/48?img=47" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-left: -7px; position: relative; z-index: 3; box-shadow: 0 0 0 2px rgba(0,0,0,0.15)" loading="lazy" />
                  <img src="https://i.pravatar.cc/48?img=33" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-left: -7px; position: relative; z-index: 2; box-shadow: 0 0 0 2px rgba(0,0,0,0.15)" loading="lazy" />
                  <img src="https://i.pravatar.cc/48?img=51" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-left: -7px; position: relative; z-index: 1; box-shadow: 0 0 0 2px rgba(0,0,0,0.15)" loading="lazy" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      style="
        position: sticky;
        bottom: 0;
        z-index: 5;
        margin-top: 24px;
        padding-top: 8px;
        background: linear-gradient(180deg, transparent, var(--bg-0) 28%);
      "
    >
      <div class="mr-tab-bar" style="margin: 0 8px 0">
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="Plans">
          <i class="ph-fill ph-calendar-blank" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Discover">
          <i class="ph ph-compass" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create">
          <i class="ph ph-plus-circle" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Friends">
          <i class="ph ph-user" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-tab-item" aria-label="Chats">
          <i class="ph ph-chat-teardrop-text" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
