<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: flex-start; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </header>

    <div
      style="
        margin: 24px 16px 0;
        padding: 28px 22px 22px;
        border-radius: 24px;
        background:
          radial-gradient(ellipse at top, rgba(91, 109, 248, 0.22), transparent 70%),
          rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        text-align: center;
      "
    >
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.08em; text-transform: uppercase">You're invited</div>

      <img
        src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80"
        alt=""
        style="width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin: 16px auto 14px; border: 3px solid rgba(255,255,255,0.12)"
        loading="lazy"
      />
      <div style="font-size: 1.55rem; font-weight: 800; color: var(--text)">Hiking Crew</div>
      <div style="font-size: 0.85rem; color: rgba(255,255,255,0.55); margin-top: 6px; line-height: 1.45; max-width: 260px; margin-left: auto; margin-right: auto">
        Asheville hikers, year-round. Sarah, Mike, and 10 others are already in.
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 18px">
        <img src="https://i.pravatar.cc/56?img=12" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0)" loading="lazy" />
        <img src="https://i.pravatar.cc/56?img=32" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <img src="https://i.pravatar.cc/56?img=8" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <img src="https://i.pravatar.cc/56?img=14" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        <span style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-left: 8px">+ 8 more</span>
      </div>

      <div
        style="
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 12px;
          border-radius: 12px;
          background: rgba(0, 0, 0, 0.2);
          border: 1px solid rgba(255,255,255,0.05);
          margin-top: 22px;
          text-align: left;
        "
      >
        <img src="https://i.pravatar.cc/64?img=11" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; font-size: 0.78rem; color: rgba(255,255,255,0.7)">Invited by <strong style="color: var(--text)">Brandon</strong></div>
      </div>
    </div>

    <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 10px">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">
        Join group
      </button>
      <button type="button" style="width: 100%; padding: 14px; border-radius: 999px; background: transparent; border: 0; color: rgba(255,255,255,0.7); font-weight: 700">
        Maybe later
      </button>
    </div>

    <div style="padding: 18px 28px 0; text-align: center; font-size: 0.74rem; color: rgba(255,255,255,0.4); line-height: 1.5">
      Joining means you can see the group's chat, plans, and shared lists. You can leave anytime.
    </div>
  </div>
</div>
