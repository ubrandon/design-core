<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip">
  <div class="mr-scope" style="padding-bottom: 8px">
    <div style="position: relative; overflow: hidden">
      <div
        aria-hidden="true"
        style="
          position: absolute;
          inset: -32px -32px 0;
          background-image: url(https://i.pravatar.cc/600?img=11);
          background-size: cover;
          background-position: center;
          filter: blur(36px) saturate(1.1);
          transform: scale(1.18);
          opacity: 0.85;
        "
      ></div>
      <div
        aria-hidden="true"
        style="
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0.18) 36%, rgba(0,0,0,0.55) 78%, var(--bg-0) 100%);
        "
      ></div>

      <div style="position: relative; padding: 18px 16px 24px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <button type="button" aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0; color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer">
            <i class="ph ph-arrow-left" style="font-size: 18px" aria-hidden="true"></i>
          </button>
          <div style="display: flex; gap: 10px">
            <button type="button" aria-label="Edit profile" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0; color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer">
              <i class="ph ph-pencil-simple" style="font-size: 18px" aria-hidden="true"></i>
            </button>
            <button type="button" aria-label="Settings" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0; color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer">
              <i class="ph ph-gear" style="font-size: 18px" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; padding-top: 14px">
          <img
            src="https://i.pravatar.cc/200?img=11"
            alt=""
            width="120"
            height="120"
            style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.16); box-shadow: 0 22px 44px rgba(0,0,0,0.5)"
            loading="lazy"
          />
          <div style="font-size: 1.7rem; font-weight: 800; color: #fff; margin-top: 14px; letter-spacing: -0.01em">Brandon Unglaub</div>
          <div style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.7); margin-top: 2px">@brandon · Joined Feb 2026</div>
        </div>
      </div>
    </div>

    <div style="padding: 12px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.1rem; font-weight: 800; color: var(--text)">Interests</span>
        <span class="mr-section-action">Edit</span>
      </div>
      <div class="mr-chip-row" style="padding-bottom: 18px">
        <button type="button" class="mr-chip">🏋️ Weightlifting</button>
        <button type="button" class="mr-chip">🛍️ Flea Markets</button>
        <button type="button" class="mr-chip">🧁 Baking</button>
      </div>
    </div>

    <div style="padding: 6px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.1rem; font-weight: 800; color: var(--text)">Groups</span>
        <span class="mr-section-action">Create group</span>
      </div>

      <div class="ds-scroll-x" style="display: flex; gap: 12px; padding: 0 0 18px; -webkit-overflow-scrolling: touch">
        <div
          style="
            position: relative;
            isolation: isolate;
            overflow: hidden;
            flex: 0 0 auto;
            width: 150px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
          "
        >
          <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -2; background-image: url('https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80'); background-size: cover; background-position: center; filter: blur(28px) saturate(1.2); transform: scale(1.4); opacity: 0.55"></div>
          <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8,10,18,0.35), rgba(8,10,18,0.7))"></div>
          <img
            src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80"
            alt=""
            width="68"
            height="68"
            style="width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15)"
            loading="lazy"
          />
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Hiking Crew</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55); margin-top: 2px">12 members</div>
        </div>

        <div
          style="
            position: relative;
            isolation: isolate;
            overflow: hidden;
            flex: 0 0 auto;
            width: 150px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
          "
        >
          <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -2; background-image: url('https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80'); background-size: cover; background-position: center; filter: blur(28px) saturate(1.2); transform: scale(1.4); opacity: 0.55"></div>
          <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8,10,18,0.35), rgba(8,10,18,0.7))"></div>
          <img
            src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=160&amp;h=160&amp;q=80"
            alt=""
            width="68"
            height="68"
            style="width: 68px; height: 68px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.15)"
            loading="lazy"
          />
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Concert Buds</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55); margin-top: 2px">6 members</div>
        </div>

        <div
          style="
            flex: 0 0 auto;
            width: 150px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
          "
        >
          <div
            style="
              width: 68px;
              height: 68px;
              border-radius: 50%;
              background: linear-gradient(135deg, #5b6df8, #9c4dff);
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 30px;
              border: 2px solid rgba(255,255,255,0.15);
            "
            aria-hidden="true"
          >
            🎲
          </div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Game Night</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55); margin-top: 2px">8 members</div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.1rem; font-weight: 800; color: var(--text)">My Lists</span>
        <span class="mr-section-action">Create list</span>
      </div>
      <div style="display: flex; gap: 12px; padding-bottom: 18px">
        <div style="flex: 1; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="font-size: 22px">❤️</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Saved</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">5 places</div>
          <div style="font-size: 0.72rem; color: rgba(255, 255, 255, 0.4); margin-top: 4px">Private</div>
        </div>
        <div style="flex: 1; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255,255,255,0.06)">
          <div style="font-size: 22px">📋</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-top: 10px">Asheville</div>
          <div style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.55)">3 places</div>
          <div style="font-size: 0.72rem; color: rgba(255, 255, 255, 0.4); margin-top: 4px">Shared</div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 16px">
      <div style="font-size: 1.1rem; font-weight: 800; color: var(--text); padding-bottom: 10px">Plans</div>
      <div class="ds-scroll-x" style="display: flex; gap: 12px; -webkit-overflow-scrolling: touch">
        <div class="plan-card plan-card-mini plan-card-cafe" style="flex: 0 0 auto; width: 220px">
          <div class="plan-card-mini-media" aria-hidden="true"></div>
          <div class="plan-card-mini-body">
            <div class="plan-card-mini-time">Fri, Apr 24th to Wed 29th · 2 PM</div>
            <div class="plan-card-mini-title">Wes Parker</div>
            <div class="plan-card-mini-location">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Static Age Reco…</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
