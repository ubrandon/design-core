<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="padding: 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.12); border: 1px solid rgba(91, 109, 248, 0.3); display: flex; align-items: center; gap: 12px; margin-bottom: 14px">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" style="width: 36px; height: 36px; border-radius: 10px; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase">Sharing with</div>
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Hiking Crew · all 12 members</div>
        </div>
        <i class="ph ph-lock-simple" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
      </div>

      <div style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 18px">
        <i class="ph ph-info" style="font-size: 16px; color: rgba(255,255,255,0.55); margin-top: 2px"></i>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.65); line-height: 1.5">Group plans go to the whole crew. To invite someone outside, add them to Hiking Crew first.</div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">What</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 14px">
        <input type="text" value="Sunrise hike at Craggy" style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none" />
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">When</label>
      <div style="display: flex; gap: 10px; margin-bottom: 14px">
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-calendar" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
          <span style="color: var(--text); font-size: 0.95rem">Sat, Apr 27</span>
        </div>
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-clock" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
          <span style="color: var(--text); font-size: 0.95rem">7:00 AM</span>
        </div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Where</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
        <i class="ph-fill ph-map-pin" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
        <span style="color: var(--text); font-size: 0.95rem">Craggy Pinnacle</span>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 28%)">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">Create group plan</button>
    </div>
  </div>
</div>
