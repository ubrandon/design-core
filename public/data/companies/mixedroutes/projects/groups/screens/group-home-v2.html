<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">

    <div style="position: relative; min-height: 360px; overflow: hidden">
      <div
        aria-hidden="true"
        style="
          position: absolute;
          inset: -32px -32px 0;
          background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=1200&amp;q=80);
          background-size: cover;
          background-position: center;
          filter: blur(36px) saturate(1.1);
          transform: scale(1.18);
          opacity: 0.85;
        "
      ></div>
      <div
        aria-hidden="true"
        style="
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0.18) 36%, rgba(0,0,0,0.55) 78%, var(--bg-0) 100%);
        "
      ></div>

      <div style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 18px 16px 0">
        <button type="button" aria-label="Back" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0; color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer">
          <i class="ph ph-arrow-left" style="font-size: 18px" aria-hidden="true"></i>
        </button>
        <button type="button" aria-label="Settings" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.45); border: 0; color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); cursor: pointer">
          <i class="ph ph-gear" style="font-size: 18px" aria-hidden="true"></i>
        </button>
      </div>

      <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 18px 16px 22px">
        <img
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=400&amp;h=400&amp;q=80"
          alt=""
          width="168"
          height="168"
          style="width: 168px; height: 168px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(255,255,255,0.16); box-shadow: 0 22px 44px rgba(0,0,0,0.5)"
          loading="lazy"
        />
        <div style="font-size: 1.75rem; font-weight: 800; color: #fff; margin-top: 14px; letter-spacing: -0.01em">Hiking Crew</div>
        <button type="button" style="background: transparent; border: 0; padding: 0; margin-top: 4px; color: rgba(255,255,255,0.7); font-size: 0.86rem; cursor: pointer">
          12 members <i class="ph ph-caret-right" style="font-size: 10px"></i>
        </button>
      </div>
    </div>

    <div style="padding: 14px 16px 0; display: flex; gap: 10px">
      <button type="button" class="btn btn-primary" style="flex: 1; padding: 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
        <i class="ph-fill ph-calendar-plus" style="font-size: 18px"></i>
        Plan something
      </button>
      <button type="button" class="btn btn-secondary" style="padding: 14px 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px">
        <i class="ph-fill ph-chat-circle-text" style="font-size: 18px"></i>
        Chat
      </button>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 14px; width: calc(100% - 32px); margin: 18px 16px 0; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: var(--text); text-align: left; cursor: pointer">
      <div style="display: inline-flex; align-items: center; flex: 0 0 auto">
        <img src="https://i.pravatar.cc/72?img=8" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0)" loading="lazy" />
        <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0); margin-left: -12px" loading="lazy" />
        <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0); margin-left: -12px" loading="lazy" />
        <img src="https://i.pravatar.cc/72?img=32" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0); margin-left: -12px" loading="lazy" />
        <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover; display: block; border: 2px solid var(--bg-0); margin-left: -12px" loading="lazy" />
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); line-height: 1.2">12 members</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-top: 2px">Tap to see everyone</div>
      </div>
      <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)" aria-hidden="true"></i>
    </button>

    <div style="padding: 22px 0 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Upcoming</span>
        <span class="mr-section-action">View all ›</span>
      </div>

      <div class="mr-plan-carousel ds-scroll-x" style="padding: 0 16px 14px; scroll-padding-left: 16px">
        <div class="plan-card plan-card-mini plan-card-hiking">
          <div class="plan-card-mini-media" style="background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=900&amp;q=80)" aria-hidden="true"></div>
          <div class="plan-card-mini-body">
            <div class="plan-card-mini-time">Sat, Apr 27 · 7 AM</div>
            <div class="plan-card-mini-title">Sunrise hike at Craggy</div>
            <div class="plan-card-mini-location">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Craggy Pinnacle</span>
            </div>
            <div class="plan-card-mini-social plan-card-mini-social--avatars">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=12" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=32" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=8" alt="" loading="lazy" />
              </div>
              <span>8 going</span>
            </div>
          </div>
        </div>

        <div class="plan-card plan-card-mini plan-card-trivia">
          <div class="plan-card-mini-media plan-card-mini-media--emoji" aria-hidden="true">🥾</div>
          <div class="plan-card-mini-body">
            <div class="plan-card-mini-time">Sun, May 5 · 8 AM</div>
            <div class="plan-card-mini-title">Mt. Mitchell day trip</div>
            <div class="plan-card-mini-location">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Black Mountain</span>
            </div>
            <div class="plan-card-mini-social plan-card-mini-social--avatars">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=14" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=27" alt="" loading="lazy" />
              </div>
              <span>3 going · 4 maybe</span>
            </div>
          </div>
        </div>

        <div class="plan-card plan-card-mini plan-card-cafe">
          <div class="plan-card-mini-media" style="background-image: url(https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&amp;fit=crop&amp;w=900&amp;q=80)" aria-hidden="true"></div>
          <div class="plan-card-mini-body">
            <div class="plan-card-mini-time">Fri, May 16 · 6 PM</div>
            <div class="plan-card-mini-title">Trailhead potluck</div>
            <div class="plan-card-mini-location">
              <i class="ph-fill ph-map-pin" aria-hidden="true"></i>
              <span>Sarah's place</span>
            </div>
            <div class="plan-card-mini-social plan-card-mini-social--avatars">
              <div class="plan-card-mini-avatar-stack" aria-hidden="true">
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=47" alt="" loading="lazy" />
                <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/48?img=8" alt="" loading="lazy" />
              </div>
              <span>5 going</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 22px 16px 0">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px">
        <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Saved places</span>
        <span class="mr-section-action">New list</span>
      </div>
      <div class="mr-places-list-grid">
        <button type="button" class="mr-places-list-card">
          <div class="mr-places-list-card-icon">🏔️</div>
          <div class="mr-places-list-card-body">
            <div class="mr-places-list-card-title">Trail wishlist</div>
            <div class="mr-places-list-card-count">9 places</div>
            <div class="mr-places-list-card-meta">By Sarah</div>
          </div>
        </button>
        <button type="button" class="mr-places-list-card">
          <div class="mr-places-list-card-icon">☕️</div>
          <div class="mr-places-list-card-body">
            <div class="mr-places-list-card-title">Trailhead coffee</div>
            <div class="mr-places-list-card-count">4 places</div>
            <div class="mr-places-list-card-meta">By you</div>
          </div>
        </button>
      </div>
    </div>

  </div>
</div>
