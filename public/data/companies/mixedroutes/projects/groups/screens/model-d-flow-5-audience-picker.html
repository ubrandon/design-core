<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Invite</span>
      <span style="font-size: 0.85rem; font-weight: 800; color: #6dd5ed">Done</span>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="padding: 12px 14px; border-radius: 14px; background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px">
        <i class="ph ph-magnifying-glass" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
        <span style="display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: rgba(76, 217, 154, 0.2); border: 1px solid rgba(76, 217, 154, 0.36); font-size: 0.78rem; font-weight: 700; color: #8af0c0">
          <i class="ph-fill ph-game-controller" style="font-size: 11px"></i>Gamer Friends
          <i class="ph ph-x" style="font-size: 11px; opacity: 0.6"></i>
        </span>
        <input type="text" placeholder="Search…" style="flex: 1; min-width: 80px; background: transparent; border: 0; color: var(--text); font-size: 0.9rem; outline: none" />
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px; display: flex; align-items: center; gap: 6px">
        <i class="ph-fill ph-circles-three" style="font-size: 12px; color: #8af0c0"></i>Your circles
        <span style="color: rgba(255,255,255,0.4); font-weight: 600; text-transform: none; letter-spacing: 0">· private to you</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(76, 217, 154, 0.1); border: 1px solid rgba(76, 217, 154, 0.32); cursor: pointer">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(76, 217, 154, 0.22); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-game-controller" style="font-size: 18px; color: #8af0c0"></i></div>
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Gamer Friends</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">11 friends · pre-fills invite list</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #8af0c0"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 99, 132, 0.22); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-heart" style="font-size: 18px; color: #ffb6c5"></i></div>
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Close friends</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">8 friends</div></div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px; display: flex; align-items: center; gap: 6px">
        <i class="ph-fill ph-users-three" style="font-size: 12px; color: #c0c8ff"></i>Or post to a group
        <span style="color: rgba(255,255,255,0.4); font-weight: 600; text-transform: none; letter-spacing: 0">· members see it on Group Home</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6dd5ed, #2193b0); display: flex; align-items: center; justify-content: center; font-size: 18px">🎮</div>
          <div style="flex: 1">
            <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Tuesday Night Valorant</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55); display: inline-flex; align-items: center; gap: 4px">
              <i class="ph-fill ph-users-three" style="font-size: 10px"></i>Group · 8 members · all see this plan
            </div>
          </div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer">
          <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #ff9b6a, #ff5c8a); display: flex; align-items: center; justify-content: center; font-size: 18px">🕹️</div>
          <div style="flex: 1">
            <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Smash Sundays</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55); display: inline-flex; align-items: center; gap: 4px">
              <i class="ph-fill ph-users-three" style="font-size: 10px"></i>Group · 5 members · all see this plan
            </div>
          </div>
          <i class="ph ph-circle" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Or pick people</div>

      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=51" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Riley Stone</div><div style="font-size: 0.72rem; color: #8af0c0">In Gamer Friends ✓</div></div>
          <i class="ph-fill ph-check-circle" style="font-size: 20px; color: #8af0c0"></i>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Sam Rivera</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">Not in any circle</div></div>
          <i class="ph ph-circle" style="font-size: 20px; color: rgba(255,255,255,0.3)"></i>
        </div>
      </div>
    </div>
  </div>
</div>
