<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Sharing with</label>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px">
        <div style="padding: 12px 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.12); border: 1px solid rgba(91, 109, 248, 0.3); display: flex; align-items: center; gap: 12px">
          <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=120&amp;h=120&amp;q=80" alt="" style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover" loading="lazy" />
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Hiking Crew</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">12 members</div></div>
          <button type="button" style="background: transparent; border: 0; color: rgba(255,255,255,0.5); font-size: 1.1rem">×</button>
        </div>
        <div style="padding: 12px 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.12); border: 1px solid rgba(91, 109, 248, 0.3); display: flex; align-items: center; gap: 12px">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #ff9b6a, #ff5c8a); display: flex; align-items: center; justify-content: center; font-size: 14px">👨‍👩‍👧</div>
          <div style="flex: 1"><div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Family</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">8 members</div></div>
          <button type="button" style="background: transparent; border: 0; color: rgba(255,255,255,0.5); font-size: 1.1rem">×</button>
        </div>
        <button type="button" style="padding: 12px 14px; border-radius: 14px; background: transparent; border: 1px dashed rgba(255,255,255,0.18); display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.6); font-size: 0.88rem; font-weight: 700">
          <i class="ph ph-plus-circle" style="font-size: 18px"></i>Add another group
        </button>
      </div>

      <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); margin-bottom: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
          <div style="font-size: 0.78rem; font-weight: 800; color: var(--text)">Combined invite list</div>
          <span style="font-size: 0.74rem; color: #6dd5ed; font-weight: 700">18 unique · 2 in both</span>
        </div>
        <div class="plan-card-mini-avatar-stack" aria-hidden="true">
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=32" alt="" loading="lazy" />
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=8" alt="" loading="lazy" />
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
          <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=27" alt="" loading="lazy" />
        </div>
      </div>

      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255, 191, 80, 0.08); border: 1px solid rgba(255, 191, 80, 0.22); display: flex; gap: 10px; margin-bottom: 18px">
        <i class="ph ph-info" style="font-size: 16px; color: #ffbf50; flex-shrink: 0; margin-top: 2px"></i>
        <div style="font-size: 0.76rem; color: rgba(255,255,255,0.7); line-height: 1.5">Plan appears on both Group Homes. Both groups will see each other on the activity card.</div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">What</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 14px">
        <input type="text" value="Baby shower for Mia" style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none" />
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">When</label>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-calendar" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i><span style="color: var(--text); font-size: 0.95rem">Sat, May 11</span>
        </div>
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-clock" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i><span style="color: var(--text); font-size: 0.95rem">2:00 PM</span>
        </div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 28%)">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">Create plan</button>
    </div>
  </div>
</div>
