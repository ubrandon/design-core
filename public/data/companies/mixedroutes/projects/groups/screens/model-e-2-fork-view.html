<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Network event</span>
      <button type="button" class="mr-nav-icon-btn" aria-label="More"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="position: relative; border-radius: 18px; overflow: hidden; margin-bottom: 16px">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=720&amp;h=300&amp;q=80" alt="" style="width: 100%; height: 140px; object-fit: cover; display: block" loading="lazy" />
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(1,11,20,0.92) 100%)"></div>
        <div style="position: absolute; left: 14px; right: 14px; bottom: 12px">
          <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(173, 130, 255, 0.25); border: 1px solid rgba(173, 130, 255, 0.45); font-size: 0.7rem; font-weight: 800; color: #c8b3ff; margin-bottom: 8px">
            <i class="ph-fill ph-broadcast" style="font-size: 11px"></i>NETWORK EVENT
          </div>
          <div style="font-size: 1.2rem; font-weight: 800; color: white">Baby shower for Mia</div>
          <div style="font-size: 0.82rem; color: rgba(255,255,255,0.85); margin-top: 2px">Sat, May 11 · 2 PM · Asheville</div>
        </div>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">Posted in 2 groups</div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px">
        <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px">
            <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="" style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover" loading="lazy" />
            <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 800; color: var(--text)">Hiking Crew</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.55)">12 members</div></div>
            <span style="font-size: 0.74rem; font-weight: 800; color: #6dd5ed">7 going</span>
          </div>
          <div class="plan-card-mini-avatar-stack" aria-hidden="true">
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=12" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=32" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=8" alt="" loading="lazy" />
          </div>
        </div>
        <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px">
            <div style="width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #ff9b6a, #ff5c8a); display: flex; align-items: center; justify-content: center; font-size: 14px">👨‍👩‍👧</div>
            <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 800; color: var(--text)">Family</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.55)">8 members</div></div>
            <span style="font-size: 0.74rem; font-weight: 800; color: #6dd5ed">5 going</span>
          </div>
          <div class="plan-card-mini-avatar-stack" aria-hidden="true">
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=14" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=27" alt="" loading="lazy" />
          </div>
        </div>
      </div>

      <div style="padding: 12px; border-radius: 12px; background: rgba(173, 130, 255, 0.06); border: 1px solid rgba(173, 130, 255, 0.18); display: flex; gap: 10px">
        <i class="ph-fill ph-link-simple" style="font-size: 18px; color: #c8b3ff; flex-shrink: 0; margin-top: 2px"></i>
        <div style="flex: 1">
          <div style="font-size: 0.84rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Edit-linked</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.65); line-height: 1.5">Change the date here and both copies update. Each group sees only its own RSVPs.</div>
        </div>
      </div>
    </div>
  </div>
</div>
