<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<style>.tag-scroll{scrollbar-width:none;-ms-overflow-style:none}.tag-scroll::-webkit-scrollbar{display:none;width:0;height:0}</style>

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Invite</span>
      <span style="font-size: 0.85rem; font-weight: 800; color: #6dd5ed">Done</span>
    </header>

    <div style="padding: 6px 16px 0">
      <div style="padding: 12px 14px; border-radius: 14px; background: var(--mr-input-surface); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px">
        <i class="ph ph-magnifying-glass" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
        <input type="text" placeholder="Search…" style="flex: 1; min-width: 60px; background: transparent; border: 0; color: var(--text); font-size: 0.88rem; outline: none" />
      </div>

      <div style="font-size: 0.66rem; font-weight: 800; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px; display: flex; align-items: center; gap: 5px">
        <i class="ph ph-tag" style="font-size: 11px"></i>Your tags
      </div>

      <div class="tag-scroll" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 14px; -webkit-overflow-scrolling: touch">
        <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: rgba(76, 217, 154, 0.1); border: 1px solid rgba(76, 217, 154, 0.24); font-size: 0.78rem; font-weight: 700; color: #8af0c0">
          <i class="ph-fill ph-game-controller" style="font-size: 11px"></i>Gamers <span style="opacity: 0.7; font-weight: 600">11</span>
        </button>
        <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: rgba(255, 99, 132, 0.1); border: 1px solid rgba(255, 99, 132, 0.24); font-size: 0.78rem; font-weight: 700; color: #ffb6c5">
          <i class="ph-fill ph-heart" style="font-size: 11px"></i>Close <span style="opacity: 0.7; font-weight: 600">8</span>
        </button>
        <button type="button" style="flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: rgba(255, 191, 80, 0.1); border: 1px solid rgba(255, 191, 80, 0.24); font-size: 0.78rem; font-weight: 700; color: #ffd99c">
          <i class="ph-fill ph-briefcase" style="font-size: 11px"></i>Coworkers <span style="opacity: 0.7; font-weight: 600">6</span>
        </button>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px; display: flex; align-items: center; gap: 6px">
        <i class="ph-fill ph-users-three" style="font-size: 12px; color: #c0c8ff"></i>From your groups
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px">
        <div style="padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px">
            <div style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6dd5ed, #2193b0); display: flex; align-items: center; justify-content: center; font-size: 18px">🎮</div>
            <div style="flex: 1">
              <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Tuesday Night Valorant</div>
              <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">8 members · owned by Jake</div>
            </div>
          </div>
          <div style="display: flex; gap: 6px">
            <button type="button" style="flex: 1; padding: 8px 10px; border-radius: 10px; background: rgba(91, 109, 248, 0.12); border: 1px solid rgba(91, 109, 248, 0.28); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.76rem; font-weight: 700; color: #c0c8ff">
              <i class="ph-fill ph-megaphone" style="font-size: 12px"></i>Post to group
            </button>
            <button type="button" style="flex: 1; padding: 8px 10px; border-radius: 10px; background: rgba(76, 217, 154, 0.12); border: 1px solid rgba(76, 217, 154, 0.32); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.76rem; font-weight: 800; color: #8af0c0">
              <i class="ph-fill ph-arrow-bend-up-right" style="font-size: 12px"></i>Borrow members
            </button>
          </div>
        </div>

        <div style="padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px">
            <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=80&amp;h=80&amp;q=80" alt="" style="width: 36px; height: 36px; border-radius: 10px; object-fit: cover" loading="lazy" />
            <div style="flex: 1">
              <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Hiking Crew</div>
              <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">12 members · you're admin</div>
            </div>
          </div>
          <div style="display: flex; gap: 6px">
            <button type="button" style="flex: 1; padding: 8px 10px; border-radius: 10px; background: rgba(91, 109, 248, 0.12); border: 1px solid rgba(91, 109, 248, 0.28); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.76rem; font-weight: 700; color: #c0c8ff">
              <i class="ph-fill ph-megaphone" style="font-size: 12px"></i>Post to group
            </button>
            <button type="button" style="flex: 1; padding: 8px 10px; border-radius: 10px; background: rgba(76, 217, 154, 0.06); border: 1px solid rgba(76, 217, 154, 0.2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.76rem; font-weight: 700; color: #8af0c0">
              <i class="ph-fill ph-arrow-bend-up-right" style="font-size: 12px"></i>Borrow members
            </button>
          </div>
        </div>
      </div>

      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; gap: 10px; margin-bottom: 18px">
        <i class="ph ph-info" style="font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 2px"></i>
        <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55); line-height: 1.5">
          <b style="color: var(--text)">Post to group</b> — plan goes on Group Home, all members see it.<br />
          <b style="color: var(--text)">Borrow</b> — pick a few members for a private plan. Group never sees it.
        </div>
      </div>

      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 10px">People</div>

      <div style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px">
          <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 36px; height: 36px; border-radius: 50%" loading="lazy" />
          <div style="flex: 1; min-width: 0"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Sam Rivera</div><div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 2px">Solo friend</div></div>
          <i class="ph ph-circle" style="font-size: 20px; color: rgba(255,255,255,0.3)"></i>
        </div>
      </div>
    </div>
  </div>
</div>
