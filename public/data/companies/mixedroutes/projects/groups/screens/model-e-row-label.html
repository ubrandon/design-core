<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); min-height: 100vh; padding: 36px 28px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box">
  <div class="mr-scope" style="display: flex; flex-direction: column; gap: 18px">
    <div style="display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: rgba(173, 130, 255, 0.18); border: 1px solid rgba(173, 130, 255, 0.32); font-size: 0.72rem; font-weight: 800; color: #c8b3ff; letter-spacing: 0.08em; text-transform: uppercase">Model E</div>

    <div style="font-size: 1.9rem; font-weight: 800; color: var(--text); line-height: 1.15">Broadcast<br />and-fork</div>

    <div style="font-size: 0.95rem; color: rgba(255,255,255,0.7); line-height: 1.55">One parent plan, N edit-linked child copies — one per group, separate RSVP lists.</div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Use case · partner +1</div>
      <div style="font-size: 0.85rem; color: rgba(255,255,255,0.78); line-height: 1.5">Doesn't help — fork is per-group. Same problems as Model A here.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Score</div>
      <div style="display: flex; gap: 14px; align-items: baseline">
        <div><span style="font-size: 1.4rem; font-weight: 800; color: var(--text)">20</span><span style="font-size: 0.85rem; color: rgba(255,255,255,0.5)"> / 32</span></div>
        <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Use 8 · Privacy 12</div>
      </div>
    </div>
  </div>
</div>
