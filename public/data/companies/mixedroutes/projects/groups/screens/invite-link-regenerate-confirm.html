<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: rgba(0, 0, 0, 0.65); overflow-x: clip; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px">
  <div
    style="
      width: 100%;
      max-width: 340px;
      background: var(--bg-0);
      border-radius: 22px;
      padding: 24px 22px 18px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    "
  >
    <div class="mr-scope" style="text-align: center">
      <div
        style="
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: rgba(232, 201, 107, 0.1);
          border: 1px solid rgba(232, 201, 107, 0.3);
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0 auto 14px;
        "
      >
        <i class="ph ph-arrows-clockwise" style="font-size: 26px; color: #e8c96b"></i>
      </div>
      <div style="font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 8px">Regenerate invite link?</div>
      <div style="font-size: 0.88rem; color: rgba(255,255,255,0.6); line-height: 1.5; margin-bottom: 16px">
        The current link will stop working immediately. Anyone who hasn't joined yet will need a new one.
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.25); margin-bottom: 18px; text-align: left">
        <i class="ph ph-link-break" style="font-size: 14px; color: rgba(255,255,255,0.5)"></i>
        <span style="flex: 1; font-size: 0.78rem; color: rgba(255,255,255,0.5); font-family: ui-monospace, SFMono-Regular, monospace; text-decoration: line-through; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mr.app/g/hiking-crew-x9k</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button
          type="button"
          class="btn btn-primary"
          style="width: 100%; padding: 14px; border-radius: 999px; font-size: 0.95rem; font-weight: 800"
        >
          Regenerate link
        </button>
        <button
          type="button"
          style="
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            background: transparent;
            border: 0;
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            font-weight: 700;
          "
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
