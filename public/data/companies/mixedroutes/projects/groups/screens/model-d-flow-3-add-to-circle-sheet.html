<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="padding-bottom: 32px; filter: brightness(0.45); flex: 1">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <button type="button" class="mr-nav-icon-btn"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
    </header>
    <div style="display: flex; flex-direction: column; align-items: center; padding: 4px 16px 16px">
      <img src="https://i.pravatar.cc/240?img=51" alt="" style="width: 96px; height: 96px; border-radius: 50%" loading="lazy" />
      <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); margin-top: 12px">Riley Stone</div>
      <div style="color: rgba(255,255,255,0.55); font-size: 0.85rem">@rileyplays</div>
    </div>
  </div>

  <div style="padding: 18px 16px 24px; background: rgba(1, 11, 20, 0.96); backdrop-filter: blur(12px); border-top-left-radius: 22px; border-top-right-radius: 22px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: -22px; position: relative; z-index: 2">
    <div class="mr-scope" style="display: flex; flex-direction: column; gap: 14px">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 0 auto 4px"></div>

      <div style="display: flex; align-items: center; gap: 10px">
        <i class="ph-fill ph-circles-three" style="font-size: 20px; color: #8af0c0"></i>
        <div style="flex: 1"><div style="font-size: 1rem; font-weight: 800; color: var(--text)">Add Riley to a circle</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">Riley won't be notified or see which circle</div></div>
      </div>

      <div style="padding: 12px 14px; border-radius: 14px; background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
        <i class="ph ph-magnifying-glass" style="font-size: 16px; color: rgba(255,255,255,0.5)"></i>
        <input type="text" placeholder="Find or create a circle…" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.92rem; outline: none" />
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Your circles</div>

        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(76, 217, 154, 0.08); border: 1px solid rgba(76, 217, 154, 0.28); cursor: pointer">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(76, 217, 154, 0.22); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-game-controller" style="font-size: 16px; color: #8af0c0"></i></div>
          <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Gamer Friends</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.55)">11 friends · already in</div></div>
          <i class="ph-fill ph-check-square" style="font-size: 22px; color: #8af0c0"></i>
        </label>

        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 99, 132, 0.08); border: 1px solid rgba(255, 99, 132, 0.28); cursor: pointer">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 99, 132, 0.22); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-heart" style="font-size: 16px; color: #ffb6c5"></i></div>
          <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Close friends</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.55)">8 friends · already in</div></div>
          <i class="ph-fill ph-check-square" style="font-size: 22px; color: #ffb6c5"></i>
        </label>

        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 191, 80, 0.22); display: flex; align-items: center; justify-content: center"><i class="ph-fill ph-briefcase" style="font-size: 16px; color: #ffd99c"></i></div>
          <div style="flex: 1"><div style="font-size: 0.9rem; font-weight: 700; color: var(--text)">Coworkers</div><div style="font-size: 0.72rem; color: rgba(255,255,255,0.55)">6 friends</div></div>
          <i class="ph ph-square" style="font-size: 22px; color: rgba(255,255,255,0.3)"></i>
        </label>

        <button type="button" style="padding: 11px 12px; border-radius: 14px; background: rgba(91, 109, 248, 0.1); border: 1px dashed rgba(91, 109, 248, 0.32); display: flex; align-items: center; gap: 10px; color: #c0c8ff; font-size: 0.9rem; font-weight: 700; text-align: left">
          <i class="ph-fill ph-plus-circle" style="font-size: 18px"></i>
          <span style="flex: 1">New circle…</span>
        </button>
      </div>

      <button type="button" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 999px">Done</button>
    </div>
  </div>
</div>
