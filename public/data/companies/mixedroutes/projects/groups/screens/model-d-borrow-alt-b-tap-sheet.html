<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="padding-bottom: 20px; filter: brightness(0.45); flex: 1">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Invite</span>
      <span style="font-size: 0.85rem; font-weight: 800; color: #6dd5ed">Done</span>
    </header>
    <div style="padding: 14px 16px 0">
      <span style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Your groups</span>
    </div>
    <div style="padding: 10px 16px 0">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #6dd5ed, #2193b0); display: flex; align-items: center; justify-content: center; font-size: 20px">🎮</div>
        <div style="flex: 1"><div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Tuesday Night Valorant</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">8 members</div></div>
      </div>
    </div>
  </div>

  <div style="padding: 22px 20px 26px; background: rgba(1, 11, 20, 0.97); backdrop-filter: blur(14px); border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: -22px; position: relative; z-index: 2">
    <div class="mr-scope" style="display: flex; flex-direction: column; gap: 14px">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 0 auto"></div>

      <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(91, 109, 248, 0.16); border: 1px solid rgba(91, 109, 248, 0.32); font-size: 0.66rem; font-weight: 800; color: #c0c8ff; letter-spacing: 0.06em; text-transform: uppercase; align-self: flex-start">
        <i class="ph-fill ph-squares-four" style="font-size: 10px"></i>Variant B
      </div>

      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #6dd5ed, #2193b0); display: flex; align-items: center; justify-content: center; font-size: 20px">🎮</div>
        <div style="flex: 1"><div style="font-size: 1rem; font-weight: 800; color: var(--text)">Tuesday Night Valorant</div><div style="font-size: 0.74rem; color: rgba(255,255,255,0.5)">How do you want to share?</div></div>
      </div>

      <button type="button" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.1); border: 1px solid rgba(91, 109, 248, 0.32); cursor: pointer; text-align: left">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(91, 109, 248, 0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><i class="ph-fill ph-megaphone" style="font-size: 18px; color: #c0c8ff"></i></div>
        <div style="flex: 1">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Post to group</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.6); line-height: 1.45">Plan goes on Group Home. All 8 members see it and can RSVP.</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 12px"></i>
      </button>

      <button type="button" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(76, 217, 154, 0.1); border: 1px solid rgba(76, 217, 154, 0.32); cursor: pointer; text-align: left">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: rgba(76, 217, 154, 0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><i class="ph-fill ph-arrow-bend-up-right" style="font-size: 18px; color: #8af0c0"></i></div>
        <div style="flex: 1">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Borrow members</div>
          <div style="font-size: 0.76rem; color: rgba(255,255,255,0.6); line-height: 1.45">Pick a few people for a private plan. The group never sees it.</div>
        </div>
        <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 12px"></i>
      </button>

      <button type="button" style="background: transparent; border: 0; color: rgba(255,255,255,0.5); font-size: 0.85rem; font-weight: 700; padding: 6px">Cancel</button>
    </div>
  </div>
</div>
