<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 120px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New plan</span>
      <div style="width: 36px"></div>
    </header>

    <div style="padding: 6px 16px 0">
      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Inviting</label>

      <div style="padding: 12px; border-radius: 14px; background: rgba(76, 217, 154, 0.08); border: 1px solid rgba(76, 217, 154, 0.28); margin-bottom: 10px">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(76, 217, 154, 0.22); border: 1px solid rgba(76, 217, 154, 0.4); font-size: 0.78rem; font-weight: 700; color: #8af0c0">
            <i class="ph-fill ph-game-controller" style="font-size: 12px"></i>Gamer Friends · 11
            <i class="ph ph-x" style="font-size: 11px; opacity: 0.6"></i>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); font-size: 0.78rem; font-weight: 700; color: var(--text)">
            <img src="https://i.pravatar.cc/40?img=47" alt="" style="width: 14px; height: 14px; border-radius: 50%" loading="lazy" />Sam Rivera
            <i class="ph ph-x" style="font-size: 11px; opacity: 0.6"></i>
          </span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; background: transparent; border: 1px dashed rgba(255,255,255,0.2); font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.6)">
            <i class="ph ph-plus" style="font-size: 11px"></i>Add more
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06)">
          <div class="plan-card-mini-avatar-stack" aria-hidden="true">
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=51" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=22" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=33" alt="" loading="lazy" />
            <img class="plan-card-mini-avatar" src="https://i.pravatar.cc/40?img=47" alt="" loading="lazy" />
          </div>
          <span style="font-size: 0.74rem; color: rgba(255,255,255,0.6)">12 people will be invited</span>
        </div>
      </div>

      <div style="padding: 10px 12px; border-radius: 12px; background: rgba(76, 217, 154, 0.04); border: 1px solid rgba(76, 217, 154, 0.18); display: flex; gap: 10px; margin-bottom: 18px">
        <i class="ph-fill ph-shield-check" style="font-size: 16px; color: #8af0c0; flex-shrink: 0; margin-top: 2px"></i>
        <div style="font-size: 0.76rem; color: rgba(255,255,255,0.7); line-height: 1.5"><b style="color: var(--text)">This is a regular plan.</b> No group is involved. Friends only see this one plan, not your circle.</div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">What</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); margin-bottom: 14px">
        <input type="text" value="Valorant night" style="width: 100%; background: transparent; border: 0; color: var(--text); font-size: 1rem; outline: none" />
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">When</label>
      <div style="display: flex; gap: 10px; margin-bottom: 14px">
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-calendar" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i><span style="color: var(--text); font-size: 0.95rem">Sat, May 4</span>
        </div>
        <div style="flex: 1; padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
          <i class="ph ph-clock" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i><span style="color: var(--text); font-size: 0.95rem">8:00 PM</span>
        </div>
      </div>

      <label style="display: block; font-size: 0.72rem; font-weight: 800; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px">Where</label>
      <div style="padding: 14px 16px; border-radius: var(--mr-input-radius); background: var(--mr-input-surface); display: flex; align-items: center; gap: 10px">
        <i class="ph-fill ph-monitor" style="font-size: 18px; color: rgba(255,255,255,0.6)"></i>
        <input type="text" value="Online · Discord" style="flex: 1; background: transparent; border: 0; color: var(--text); font-size: 0.95rem; outline: none" />
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 28%)">
      <button type="button" class="btn btn-primary" style="width: 100%; padding: 16px; border-radius: 999px">Create plan · 12 invited</button>
    </div>
  </div>
</div>
