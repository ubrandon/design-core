<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="padding-bottom: 20px; filter: brightness(0.45); flex: 1">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn"><i class="ph ph-x" aria-hidden="true"></i></button>
      <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">New plan</span>
      <div style="width: 36px"></div>
    </header>
    <div style="padding: 14px 16px 0">
      <span style="font-size: 1.1rem; font-weight: 800; color: var(--text)">Game night at my place</span>
    </div>
  </div>

  <div style="padding: 22px 20px 26px; background: rgba(1, 11, 20, 0.97); backdrop-filter: blur(14px); border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: -22px; position: relative; z-index: 2">
    <div class="mr-scope" style="display: flex; flex-direction: column; gap: 16px">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 0 auto"></div>

      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: rgba(76, 217, 154, 0.18); display: flex; align-items: center; justify-content: center">
          <i class="ph-fill ph-tag" style="font-size: 26px; color: #8af0c0"></i>
        </div>
        <div style="font-size: 1.1rem; font-weight: 800; color: var(--text)">Tag these 4 for next time?</div>
        <div style="font-size: 0.82rem; color: rgba(255,255,255,0.65); line-height: 1.5; max-width: 320px">Add them to a tag so you can invite this whole crew in one tap next time.</div>
      </div>

      <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 10px">
        <div style="display: flex">
          <img src="https://i.pravatar.cc/40?img=51" alt="" style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg-0)" loading="lazy" />
          <img src="https://i.pravatar.cc/40?img=22" alt="" style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
          <img src="https://i.pravatar.cc/40?img=33" alt="" style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
          <img src="https://i.pravatar.cc/40?img=27" alt="" style="width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--bg-0); margin-left: -10px" loading="lazy" />
        </div>
        <div style="flex: 1; font-size: 0.82rem; color: rgba(255,255,255,0.7)">Riley, Jordan, Alex, Devon</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 0.66rem; font-weight: 800; color: rgba(255,255,255,0.4); letter-spacing: 0.08em; text-transform: uppercase">Pick a tag</div>

        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(76, 217, 154, 0.1); border: 1px solid rgba(76, 217, 154, 0.32); cursor: pointer">
          <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: rgba(76, 217, 154, 0.22); border: 1px solid rgba(76, 217, 154, 0.4); font-size: 0.78rem; font-weight: 700; color: #8af0c0">
            <i class="ph-fill ph-game-controller" style="font-size: 11px"></i>Gamers
          </span>
          <span style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">11 friends</span>
          <span style="flex: 1"></span>
          <i class="ph-fill ph-check-circle" style="font-size: 20px; color: #8af0c0"></i>
        </label>

        <label style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer">
          <span style="display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: rgba(255, 99, 132, 0.16); border: 1px solid rgba(255, 99, 132, 0.32); font-size: 0.78rem; font-weight: 700; color: #ffb6c5">
            <i class="ph-fill ph-heart" style="font-size: 11px"></i>Close
          </span>
          <span style="font-size: 0.72rem; color: rgba(255,255,255,0.5)">8 friends</span>
          <span style="flex: 1"></span>
          <i class="ph ph-circle" style="font-size: 20px; color: rgba(255,255,255,0.3)"></i>
        </label>

        <button type="button" style="padding: 10px 12px; border-radius: 12px; background: rgba(91, 109, 248, 0.08); border: 1px dashed rgba(91, 109, 248, 0.3); display: flex; align-items: center; gap: 10px; color: #c0c8ff; font-size: 0.85rem; font-weight: 700; text-align: left">
          <i class="ph ph-plus-circle" style="font-size: 18px"></i>
          <span style="flex: 1">New tag…</span>
        </button>
      </div>

      <div style="padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display: flex; gap: 8px">
        <i class="ph ph-info" style="font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 2px"></i>
        <div style="font-size: 0.72rem; color: rgba(255,255,255,0.5); line-height: 1.4">Tags are private. They won't be notified.</div>
      </div>

      <div style="display: flex; gap: 10px">
        <button type="button" class="btn btn-secondary" style="flex: 1; padding: 13px; border-radius: 999px; font-size: 0.88rem">Skip</button>
        <button type="button" class="btn btn-primary" style="flex: 2; padding: 13px; border-radius: 999px; font-size: 0.88rem">Tag &amp; create plan</button>
      </div>
    </div>
  </div>
</div>
