<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; display: flex; flex-direction: column">
  <div class="mr-scope" style="display: flex; flex-direction: column; flex: 1">
    <header style="display: flex; align-items: center; justify-content: flex-start; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Close">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </header>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; text-align: center">
      <img
        src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&amp;fit=crop&amp;w=240&amp;h=240&amp;q=80"
        alt=""
        style="width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.12); margin-bottom: 18px"
        loading="lazy"
      />
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(109, 213, 237, 0.95); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px">You're already in</div>
      <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); margin-bottom: 8px">Hiking Crew</div>
      <div style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.55); line-height: 1.5; max-width: 300px">
        You joined this group on Mar 14. Open it to see what's new with the crew.
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 18px">
        <img src="https://i.pravatar.cc/56?img=12" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0)" loading="lazy" />
        <img src="https://i.pravatar.cc/56?img=32" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -8px" loading="lazy" />
        <img src="https://i.pravatar.cc/56?img=8" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -8px" loading="lazy" />
        <span style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-left: 8px">+ 9 members</span>
      </div>

      <div style="width: 100%; max-width: 320px; padding: 12px 14px; border-radius: 14px; background: rgba(91, 109, 248, 0.08); border: 1px solid rgba(91, 109, 248, 0.22); margin-top: 22px; display: flex; align-items: center; gap: 10px; text-align: left">
        <i class="ph-fill ph-share-network" style="font-size: 16px; color: #8b9cff; flex: 0 0 auto"></i>
        <div style="flex: 1; font-size: 0.78rem; color: rgba(255,255,255,0.7); line-height: 1.4">
          Want to invite someone? Share the group's invite link instead.
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px; width: 100%; max-width: 320px">
        <button type="button" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 999px">
          Open group
        </button>
        <button type="button" class="btn btn-secondary" style="width: 100%; padding: 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph-fill ph-share-network" style="font-size: 16px"></i>
          Share invite link
        </button>
        <button type="button" style="width: 100%; padding: 14px; border-radius: 999px; background: transparent; border: 0; color: rgba(255,255,255,0.7); font-weight: 700">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
