<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 110px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Invite</span>
      <span style="width: 32px"></span>
    </header>

    <div style="padding: 8px 16px 4px">
      <div style="font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Who's coming?</div>
      <div style="font-size: 0.86rem; color: rgba(255,255,255,0.6); margin-bottom: 16px; line-height: 1.4">Bring a whole group, or pick people one by one.</div>

      <div class="mr-search-bar" style="margin-bottom: 0">
        <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        <input type="search" placeholder="Search groups or people" autocomplete="off" />
      </div>
    </div>

    <div class="ds-scroll-x" style="display: flex; gap: 8px; padding: 10px 16px 12px">
      <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 999px; background: rgba(109,213,237,0.12); border: 1px solid rgba(109,213,237,0.35)">
        <img src="https://i.pravatar.cc/56?img=12" alt="" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <span style="font-size: 0.82rem; font-weight: 700; color: var(--text)">Riley</span>
        <button type="button" aria-label="Remove Riley" style="display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,0.18); color: var(--text); cursor: pointer">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>
      <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 999px; background: rgba(109,213,237,0.12); border: 1px solid rgba(109,213,237,0.35)">
        <img src="https://i.pravatar.cc/56?img=47" alt="" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <span style="font-size: 0.82rem; font-weight: 700; color: var(--text)">Sam Rivera</span>
        <button type="button" aria-label="Remove Sam Rivera" style="display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,0.18); color: var(--text); cursor: pointer">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>
      <span style="flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 999px; background: rgba(109,213,237,0.12); border: 1px solid rgba(109,213,237,0.35)">
        <img src="https://i.pravatar.cc/56?img=53" alt="" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <span style="font-size: 0.82rem; font-weight: 700; color: var(--text)">Sam Chen</span>
        <button type="button" aria-label="Remove Sam Chen" style="display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: rgba(255,255,255,0.18); color: var(--text); cursor: pointer">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </span>
    </div>

    <div style="padding: 4px 16px 6px; opacity: 0.4">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Add to group</span>
    </div>

    <div class="ds-scroll-x" style="display: flex; gap: 12px; padding: 4px 16px 18px; opacity: 0.4; pointer-events: none">
      <button type="button" disabled style="flex: 0 0 auto; width: 132px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <div style="width: 48px; height: 48px; border-radius: 14px; overflow: hidden">
          <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=200" alt="" style="width: 100%; height: 100%; object-fit: cover" loading="lazy" />
        </div>
        <div>
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Hiking Crew</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">12 members</div>
        </div>
      </button>
      <button type="button" disabled style="flex: 0 0 auto; width: 132px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: flex; align-items: center; justify-content: center; color: #06080e">
          <i class="ph-fill ph-game-controller" style="font-size: 22px"></i>
        </div>
        <div>
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Tuesday Valorant</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">8 members</div>
        </div>
      </button>
      <button type="button" disabled style="flex: 0 0 auto; width: 132px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#f6a86b,#e07c5a); display: flex; align-items: center; justify-content: center; color: #06080e">
          <i class="ph-fill ph-briefcase" style="font-size: 20px"></i>
        </div>
        <div>
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Coworkers</div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">6 members</div>
        </div>
      </button>
    </div>

    <div style="padding: 4px 16px 6px">
      <span style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 0.06em; text-transform: uppercase">Invite people</span>
    </div>

    <div style="padding: 0 16px 8px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=12" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Riley Stone</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@riley</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: inline-flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e" aria-hidden="true"></i></span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=20" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Jordan Lee</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@jordanl</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25); box-sizing: border-box"></span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Rivera</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@srivera</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: inline-flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e" aria-hidden="true"></i></span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=53" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Sam Chen</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@sammy_c</div>
        </div>
        <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg,#6dd5ed,#2193b0); display: inline-flex; align-items: center; justify-content: center"><i class="ph-fill ph-check" style="font-size: 12px; color: #06080e" aria-hidden="true"></i></span>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 4px">
        <img src="https://i.pravatar.cc/72?img=33" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" loading="lazy" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Alex Park</div>
          <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@alexp</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.25)"></div>
      </div>
    </div>

    <div style="position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, transparent, var(--bg-0) 32%); pointer-events: none">
      <div style="pointer-events: auto; display: flex; align-items: center; gap: 10px">
        <button type="button" style="flex: 1; padding: 16px 20px; border-radius: 999px; background: rgba(255,255,255,0.08); border: 0; color: var(--text); font-size: 0.95rem; font-weight: 800; cursor: pointer">
          Cancel
        </button>
        <button type="button" style="flex: 1; padding: 16px 20px; border-radius: 999px; background: linear-gradient(135deg,#6dd5ed,#5b8def 60%,#7c6dee); border: 0; color: #ffffff; font-size: 0.95rem; font-weight: 800; cursor: pointer">
          Invite
        </button>
      </div>
    </div>
  </div>
</div>
