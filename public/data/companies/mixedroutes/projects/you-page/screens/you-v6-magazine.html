<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 6px">
      <span style="font-size: 1.25rem; font-weight: 800; color: var(--text)">You</span>
      <div style="display: flex; gap: 8px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
      </div>
    </header>

    <div style="padding: 6px 16px 16px">
      <div style="position: relative; border-radius: 22px; overflow: hidden; padding: 18px; background: linear-gradient(135deg, rgba(91,165,255,0.22), rgba(156,77,255,0.18)); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 14px">
        <img src="https://i.pravatar.cc/120?img=11" alt="" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18); object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Brandon</div>
          <div style="display: flex; gap: 14px; font-size: 0.7rem; color: rgba(255,255,255,0.7); font-weight: 700">
            <span><strong style="color: var(--text); font-size: 0.84rem">42</strong> friends</span>
            <span><strong style="color: var(--text); font-size: 0.84rem">3</strong> groups</span>
            <span><strong style="color: var(--text); font-size: 0.84rem">10</strong> saves</span>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 0 16px 8px">
      <div class="ds-scroll-x" style="display: flex; gap: 6px; overflow-x: auto">
        <button type="button" style="flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: rgba(245,196,81,0.18); border: 1px solid rgba(245,196,81,0.3); color: #f5c451; font-weight: 800; font-size: 0.78rem; cursor: pointer">Overview</button>
        <button type="button" style="flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.65); font-weight: 700; font-size: 0.78rem; cursor: pointer">Saves</button>
        <button type="button" style="flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.65); font-weight: 700; font-size: 0.78rem; cursor: pointer">Groups</button>
        <button type="button" style="flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.65); font-weight: 700; font-size: 0.78rem; cursor: pointer">Plans</button>
        <button type="button" style="flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.65); font-weight: 700; font-size: 0.78rem; cursor: pointer">Friends</button>
      </div>
    </div>

    <div style="padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Up next</span>
      <span style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">This week</span>
    </div>
    <div style="padding: 0 16px 14px">
      <div style="position: relative; height: 152px; border-radius: 18px; overflow: hidden">
        <img src="https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=600&q=70" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" />
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.85))"></div>
        <div style="position: absolute; left: 14px; right: 14px; bottom: 14px">
          <div style="font-size: 0.62rem; color: rgba(255,255,255,0.7); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px">Fri Apr 24 · 2 PM</div>
          <div style="font-size: 1.05rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Wes Parker show</div>
          <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; color: rgba(255,255,255,0.8)">
            <i class="ph ph-map-pin" style="font-size: 11px"></i> Static Age Records
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 6px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Your spaces</span>
      <button type="button" style="font-size: 0.74rem; color: rgba(255,255,255,0.55); background: transparent; border: 0; font-weight: 700; cursor: pointer">Manage</button>
    </div>
    <div style="padding: 0 16px 14px">
      <div class="ds-scroll-x" style="display: flex; gap: 10px">
        <div style="flex: 0 0 auto; width: 200px; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column">
          <div style="height: 84px; position: relative; background-image: url(https://images.unsplash.com/photo-1551632811-561732d1e306?w=400&q=70); background-size: cover; background-position: center">
            <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.55))"></div>
            <div style="position: absolute; left: 10px; bottom: 8px; font-size: 0.66rem; color: rgba(255,255,255,0.85); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Group</div>
          </div>
          <div style="padding: 10px 12px 12px">
            <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Hiking Crew</div>
            <div style="font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 2px">12 members · 2 plans</div>
          </div>
        </div>
        <div style="flex: 0 0 auto; width: 200px; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column">
          <div style="height: 84px; position: relative; background: linear-gradient(135deg, rgba(255,107,139,0.4), rgba(245,196,81,0.25)); display: flex; align-items: center; justify-content: center">
            <i class="ph-fill ph-heart" style="color: #fff; font-size: 30px"></i>
            <div style="position: absolute; left: 10px; bottom: 8px; font-size: 0.66rem; color: rgba(255,255,255,0.95); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">List</div>
          </div>
          <div style="padding: 10px 12px 12px">
            <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Favorites</div>
            <div style="font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 2px">7 places · Private</div>
          </div>
        </div>
        <div style="flex: 0 0 auto; width: 200px; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column">
          <div style="height: 84px; position: relative; background-image: url(https://images.unsplash.com/photo-1506157786151-b8491531f063?w=400&q=70); background-size: cover; background-position: center">
            <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.55))"></div>
            <div style="position: absolute; left: 10px; bottom: 8px; font-size: 0.66rem; color: rgba(255,255,255,0.85); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Group</div>
          </div>
          <div style="padding: 10px 12px 12px">
            <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Concert Buds</div>
            <div style="font-size: 0.72rem; color: rgba(255,255,255,0.55); margin-top: 2px">6 members</div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 6px 16px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1rem; font-weight: 800; color: var(--text)">Things you’ve loved</span>
        <span style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">17</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px">
        <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=300&q=70" alt="" style="width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover" />
        <img src="https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=300&q=70" alt="" style="width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover" />
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&q=70" alt="" style="width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover" />
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?w=300&q=70" alt="" style="width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover" />
        <img src="https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=300&q=70" alt="" style="width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover" />
        <div style="width: 100%; aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); font-weight: 800; font-size: 0.85rem">+12</div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
