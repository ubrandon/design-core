<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px">
      <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 36px; height: 36px; border-radius: 12px; object-fit: cover" />
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 0.92rem; font-weight: 800; color: var(--text); line-height: 1.1">Brandon</div>
        <div style="font-size: 0.66rem; color: rgba(255,255,255,0.5); margin-top: 2px">Tap to view as friend →</div>
      </div>
      <button type="button" class="mr-nav-icon-btn" aria-label="Settings" style="width: 32px; height: 32px"><i class="ph ph-gear" aria-hidden="true" style="font-size: 16px"></i></button>
    </div>

    <div style="padding: 0 14px 14px">
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; grid-auto-rows: 80px; gap: 8px">
        <div style="grid-column: span 2; grid-row: span 2; border-radius: 18px; padding: 14px; background: linear-gradient(135deg, rgba(255,107,139,0.22), rgba(255,107,139,0.04)); border: 1px solid rgba(255,107,139,0.22); display: flex; flex-direction: column; justify-content: space-between">
          <div style="display: flex; align-items: center; gap: 8px">
            <i class="ph-fill ph-bookmark-simple" style="color: #ff6b8b; font-size: 18px"></i>
            <span style="font-size: 0.72rem; color: rgba(255,255,255,0.7); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Saves</span>
          </div>
          <div>
            <div style="font-size: 1.8rem; font-weight: 800; color: var(--text); line-height: 1">10</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.65); margin-top: 2px">across 2 lists · +4 this week</div>
          </div>
          <div style="display: flex; gap: -6px">
            <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=80&q=70" alt="" style="width: 26px; height: 26px; border-radius: 8px; object-fit: cover; border: 2px solid var(--bg-0)" />
            <img src="https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=80&q=70" alt="" style="width: 26px; height: 26px; border-radius: 8px; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -6px" />
            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=80&q=70" alt="" style="width: 26px; height: 26px; border-radius: 8px; object-fit: cover; border: 2px solid var(--bg-0); margin-left: -6px" />
            <span style="width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 2px solid var(--bg-0); margin-left: -6px; display: inline-flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.6); font-size: 0.62rem; font-weight: 800">+7</span>
          </div>
        </div>

        <div style="border-radius: 18px; padding: 12px; background: rgba(245,196,81,0.1); border: 1px solid rgba(245,196,81,0.22); display: flex; flex-direction: column; justify-content: space-between">
          <i class="ph-fill ph-pencil-line" style="color: #f5c451; font-size: 16px"></i>
          <div>
            <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); line-height: 1">1</div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.6); margin-top: 2px">Draft</div>
          </div>
        </div>

        <div style="border-radius: 18px; padding: 12px; background: rgba(91,165,255,0.1); border: 1px solid rgba(91,165,255,0.22); display: flex; flex-direction: column; justify-content: space-between">
          <i class="ph-fill ph-bell" style="color: #5ba5ff; font-size: 16px"></i>
          <div>
            <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); line-height: 1">3</div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.6); margin-top: 2px">RSVPs to do</div>
          </div>
        </div>

        <div style="grid-column: span 2; border-radius: 18px; padding: 12px 14px; background: rgba(32,224,207,0.08); border: 1px solid rgba(32,224,207,0.22); display: flex; align-items: center; gap: 12px">
          <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(32,224,207,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto">
            <span style="font-size: 0.56rem; color: #20e0cf; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1">Apr</span>
            <span style="font-size: 0.95rem; color: var(--text); font-weight: 800; line-height: 1; margin-top: 2px">24</span>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.68rem; color: #20e0cf; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px">Next plan</div>
            <div style="font-size: 0.85rem; font-weight: 800; color: var(--text)">Wes Parker</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">Static Age · 2 PM</div>
          </div>
        </div>

        <div style="border-radius: 18px; padding: 12px; background: rgba(156,77,255,0.1); border: 1px solid rgba(156,77,255,0.22); display: flex; flex-direction: column; justify-content: space-between">
          <i class="ph-fill ph-users-three" style="color: #9c4dff; font-size: 16px"></i>
          <div>
            <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); line-height: 1">3</div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.6); margin-top: 2px">Groups</div>
          </div>
        </div>

        <div style="grid-column: span 2; border-radius: 18px; padding: 12px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px">
          <i class="ph-fill ph-tag" style="color: #f5c451; font-size: 16px"></i>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55); font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Interests</div>
            <div style="font-size: 0.85rem; font-weight: 800; color: var(--text); margin-top: 2px">Weights · Markets · Baking</div>
          </div>
        </div>

        <div style="border-radius: 18px; padding: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; justify-content: space-between">
          <i class="ph-fill ph-user-circle" style="color: rgba(255,255,255,0.7); font-size: 16px"></i>
          <div>
            <div style="font-size: 1.4rem; font-weight: 800; color: var(--text); line-height: 1">42</div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.6); margin-top: 2px">Friends · 3 new</div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 4px 16px 14px">
      <div style="font-size: 0.7rem; color: rgba(255,255,255,0.45); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 8px">Lately</div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: rgba(255,255,255,0.85)">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #5ba5ff"></span>
          Saved <strong style="color: var(--text); font-weight: 800">All Day Darling</strong>
          <span style="margin-left: auto; color: rgba(255,255,255,0.4); font-size: 0.7rem">2h</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: rgba(255,255,255,0.85)">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #20e0cf"></span>
          Created <strong style="color: var(--text); font-weight: 800">Wes Parker</strong> plan
          <span style="margin-left: auto; color: rgba(255,255,255,0.4); font-size: 0.7rem">1d</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: rgba(255,255,255,0.85)">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #9c4dff"></span>
          Sarah added you back
          <span style="margin-left: auto; color: rgba(255,255,255,0.4); font-size: 0.7rem">2d</span>
        </div>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
