<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
      <span style="font-size: 1.25rem; font-weight: 800; color: var(--text)">You</span>
      <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
    </header>

    <div style="padding: 4px 16px 14px; display: flex; align-items: center; gap: 12px">
      <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.12); object-fit: cover" />
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 1rem; font-weight: 800; color: var(--text)">Brandon Unglaub</div>
        <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">@brandon</div>
      </div>
      <button type="button" style="padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.14); color: var(--text); font-weight: 800; font-size: 0.75rem; cursor: pointer">Edit</button>
    </div>

    <div style="padding: 0 16px 14px">
      <div style="border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); overflow: hidden">
        <div style="padding: 8px 14px; font-size: 0.7rem; color: rgba(255,255,255,0.45); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255,255,255,0.02)">Your stuff</div>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-bookmark-simple" style="color: #5ba5ff; font-size: 17px"></i> Saved places
          </span>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.45); font-size: 0.78rem">10 <i class="ph ph-caret-right" style="font-size: 11px"></i></span>
        </button>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-users-three" style="color: #9c4dff; font-size: 17px"></i> Groups
          </span>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.45); font-size: 0.78rem">3 <i class="ph ph-caret-right" style="font-size: 11px"></i></span>
        </button>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-calendar-check" style="color: #20e0cf; font-size: 17px"></i> Plans
          </span>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.45); font-size: 0.78rem">4 upcoming <i class="ph ph-caret-right" style="font-size: 11px"></i></span>
        </button>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-pencil-line" style="color: #f5c451; font-size: 17px"></i> Drafts
          </span>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.45); font-size: 0.78rem">1 <i class="ph ph-caret-right" style="font-size: 11px"></i></span>
        </button>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-clock-counter-clockwise" style="color: rgba(255,255,255,0.7); font-size: 17px"></i> History
          </span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 11px"></i>
        </button>
      </div>
    </div>

    <div style="padding: 0 16px 14px">
      <div style="border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); overflow: hidden">
        <div style="padding: 8px 14px; font-size: 0.7rem; color: rgba(255,255,255,0.45); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255,255,255,0.02)">Connections</div>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-user-circle" style="color: rgba(255,255,255,0.7); font-size: 17px"></i> Friends
          </span>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.45); font-size: 0.78rem">42 <i class="ph ph-caret-right" style="font-size: 11px"></i></span>
        </button>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-user-plus" style="color: #f5c451; font-size: 17px"></i> Requests
          </span>
          <span style="display: inline-flex; align-items: center; gap: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(245,196,81,0.18); color: #f5c451; font-size: 0.7rem; font-weight: 800">3</span>
        </button>
      </div>
    </div>

    <div style="padding: 0 16px 14px">
      <div style="border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); overflow: hidden">
        <div style="padding: 8px 14px; font-size: 0.7rem; color: rgba(255,255,255,0.45); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(255,255,255,0.02)">What others see</div>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph ph-eye" style="color: #5ba5ff; font-size: 17px"></i> Preview your profile
          </span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 11px"></i>
        </button>
        <button type="button" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 0; background: transparent; cursor: pointer; border-top: 1px solid rgba(255,255,255,0.05)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph ph-lock-key" style="color: rgba(255,255,255,0.7); font-size: 17px"></i> Privacy
          </span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 11px"></i>
        </button>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
