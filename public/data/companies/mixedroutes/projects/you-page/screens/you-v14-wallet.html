<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px">
      <div style="display: inline-flex; align-items: center; gap: 10px">
        <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover" />
        <div style="line-height: 1.1">
          <div style="font-size: 0.92rem; font-weight: 800; color: var(--text)">Brandon</div>
          <div style="font-size: 0.66rem; color: rgba(255,255,255,0.5); margin-top: 1px">Your wallet</div>
        </div>
      </div>
      <button type="button" class="mr-nav-icon-btn" aria-label="Settings" style="width: 32px; height: 32px"><i class="ph ph-gear" aria-hidden="true" style="font-size: 16px"></i></button>
    </div>

    <div style="padding: 12px 0 16px; position: relative; height: 320px">
      <div style="position: absolute; left: 28px; right: 28px; top: 0; height: 200px; border-radius: 22px; background: linear-gradient(135deg, #ff6b8b, #ff9d6b); padding: 18px; box-shadow: 0 18px 40px -22px rgba(255,107,139,0.6); transform: rotate(-3deg)">
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.85); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">Saves</div>
            <div style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-top: 4px">Favorites</div>
          </div>
          <i class="ph-fill ph-heart" style="color: rgba(255,255,255,0.9); font-size: 22px"></i>
        </div>
      </div>

      <div style="position: absolute; left: 22px; right: 22px; top: 38px; height: 200px; border-radius: 22px; background: linear-gradient(135deg, #5ba5ff, #20e0cf); padding: 18px; box-shadow: 0 18px 40px -22px rgba(91,165,255,0.6); transform: rotate(2deg)">
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.9); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">List · Shared</div>
            <div style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-top: 4px">Asheville</div>
          </div>
          <i class="ph-fill ph-clipboard-text" style="color: rgba(255,255,255,0.9); font-size: 22px"></i>
        </div>
      </div>

      <div style="position: absolute; left: 16px; right: 16px; top: 80px; height: 200px; border-radius: 22px; background: linear-gradient(135deg, #15263a, #1f3550); padding: 18px; box-shadow: 0 22px 50px -22px rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.08)">
        <div style="display: flex; justify-content: space-between; align-items: flex-start">
          <div>
            <div style="font-size: 0.66rem; color: rgba(255,255,255,0.65); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase">Group</div>
            <div style="font-size: 1.6rem; font-weight: 800; color: var(--text); margin-top: 4px">Hiking Crew</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.6); margin-top: 4px">12 members · 2 plans this month</div>
          </div>
          <i class="ph-fill ph-users-three" style="color: rgba(255,255,255,0.85); font-size: 22px"></i>
        </div>
        <div style="position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; justify-content: space-between; align-items: center">
          <div style="display: flex">
            <img src="https://i.pravatar.cc/40?img=14" alt="" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #15263a" />
            <img src="https://i.pravatar.cc/40?img=32" alt="" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #15263a; margin-left: -6px" />
            <img src="https://i.pravatar.cc/40?img=8" alt="" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #15263a; margin-left: -6px" />
            <span style="width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1.5px solid #15263a; margin-left: -6px; display: inline-flex; align-items: center; justify-content: center; color: var(--text); font-size: 0.6rem; font-weight: 800">+9</span>
          </div>
          <button type="button" style="padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 0; color: var(--text); font-weight: 800; font-size: 0.7rem; cursor: pointer">Open</button>
        </div>
      </div>
    </div>

    <div style="padding: 0 14px 14px">
      <div style="display: flex; gap: 6px; justify-content: center; padding: 8px 0">
        <span style="width: 18px; height: 4px; border-radius: 2px; background: var(--text)"></span>
        <span style="width: 4px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span>
        <span style="width: 4px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span>
        <span style="width: 4px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span>
      </div>
    </div>

    <div style="padding: 0 14px 14px">
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: var(--text); font-weight: 800; font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph ph-plus" style="font-size: 14px"></i> New
        </button>
        <button type="button" style="flex: 1; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: var(--text); font-weight: 800; font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph ph-squares-four" style="font-size: 14px"></i> All cards
        </button>
        <button type="button" style="flex: 1; padding: 12px; border-radius: 14px; background: rgba(91,165,255,0.16); border: 1px solid rgba(91,165,255,0.28); color: var(--text); font-weight: 800; font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px">
          <i class="ph ph-eye" style="font-size: 14px"></i> Preview
        </button>
      </div>
    </div>

    <div style="padding: 6px 16px 14px; font-size: 0.7rem; color: rgba(255,255,255,0.45); line-height: 1.5">
      Each card is something you own — a list, group, plan, or interest. Stack them, flip them, share the ones marked public.
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
