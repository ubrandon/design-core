<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope" style="padding-bottom: 88px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 6px">
      <div style="display: inline-flex; align-items: center; gap: 12px">
        <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.12); object-fit: cover" />
        <div>
          <div style="font-size: 0.7rem; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Yours</div>
          <div style="font-size: 1.05rem; font-weight: 800; color: var(--text); margin-top: -1px">Brandon</div>
        </div>
      </div>
      <button type="button" class="mr-nav-icon-btn" aria-label="Settings"><i class="ph ph-gear" aria-hidden="true"></i></button>
    </header>

    <div style="padding: 6px 16px 16px">
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
        <button type="button" style="padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <i class="ph-fill ph-bookmark-simple" style="font-size: 18px; color: #5ba5ff"></i>
          <span style="font-size: 0.7rem; color: var(--text); font-weight: 700">Save</span>
        </button>
        <button type="button" style="padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <i class="ph-fill ph-calendar-plus" style="font-size: 18px; color: #20e0cf"></i>
          <span style="font-size: 0.7rem; color: var(--text); font-weight: 700">Plan</span>
        </button>
        <button type="button" style="padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <i class="ph-fill ph-users-three" style="font-size: 18px; color: #9c4dff"></i>
          <span style="font-size: 0.7rem; color: var(--text); font-weight: 700">Group</span>
        </button>
        <button type="button" style="padding: 12px 6px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px">
          <i class="ph-fill ph-paper-plane-tilt" style="font-size: 18px; color: #f5c451"></i>
          <span style="font-size: 0.7rem; color: var(--text); font-weight: 700">Invite</span>
        </button>
      </div>
    </div>

    <div style="padding: 4px 16px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.02rem; font-weight: 800; color: var(--text)">Needs you</span>
        <span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; background: rgba(245,196,81,0.16); color: #f5c451; font-size: 0.7rem; font-weight: 800">3</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); align-items: center">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(245,196,81,0.16); display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
            <i class="ph-fill ph-pencil-line" style="color: #f5c451; font-size: 18px"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Finish your draft plan</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Saturday brunch · started 2d ago</div>
          </div>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 14px"></i>
        </div>
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); align-items: center">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(91,165,255,0.16); display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
            <i class="ph-fill ph-question" style="color: #5ba5ff; font-size: 18px"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">RSVP to Jazz Night</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Mike invited you · Thu 8 PM</div>
          </div>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 14px"></i>
        </div>
        <div style="display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); align-items: center">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(156,77,255,0.16); display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
            <i class="ph-fill ph-user-plus" style="color: #9c4dff; font-size: 18px"></i>
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">3 friend requests</div>
            <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Sarah, Mike, +1</div>
          </div>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 14px"></i>
        </div>
      </div>
    </div>

    <div style="padding: 4px 16px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px">
        <span style="font-size: 1.02rem; font-weight: 800; color: var(--text)">Recently saved</span>
        <button type="button" style="font-size: 0.74rem; color: rgba(255,255,255,0.6); background: transparent; border: 0; font-weight: 700; cursor: pointer">See all</button>
      </div>
      <div class="ds-scroll-x" style="display: flex; gap: 10px">
        <div style="flex: 0 0 auto; width: 144px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
          <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=300&q=70" alt="" style="width: 100%; height: 92px; object-fit: cover; display: block" />
          <div style="padding: 10px">
            <div style="font-size: 0.82rem; font-weight: 800; color: var(--text); margin-bottom: 2px">All Day Darling</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">Cafe · Asheville</div>
          </div>
        </div>
        <div style="flex: 0 0 auto; width: 144px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
          <img src="https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=300&q=70" alt="" style="width: 100%; height: 92px; object-fit: cover; display: block" />
          <div style="padding: 10px">
            <div style="font-size: 0.82rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Static Age Records</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">Music · Asheville</div>
          </div>
        </div>
        <div style="flex: 0 0 auto; width: 144px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06)">
          <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&q=70" alt="" style="width: 100%; height: 92px; object-fit: cover; display: block" />
          <div style="padding: 10px">
            <div style="font-size: 0.82rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Riverfront Stage</div>
            <div style="font-size: 0.7rem; color: rgba(255,255,255,0.55)">Venue · Asheville</div>
          </div>
        </div>
      </div>
    </div>

    <div style="padding: 4px 16px 14px">
      <div style="font-size: 1.02rem; font-weight: 800; color: var(--text); padding-bottom: 10px">Shortcuts</div>
      <div style="display: flex; flex-direction: column">
        <button type="button" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px; border-radius: 12px; background: transparent; border: 0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-bookmark-simple" style="color: #5ba5ff; font-size: 18px"></i> All saved places
          </span>
          <span style="color: rgba(255,255,255,0.45); font-size: 0.78rem">10</span>
        </button>
        <button type="button" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px; border-radius: 12px; background: transparent; border: 0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-users-three" style="color: #9c4dff; font-size: 18px"></i> Your groups
          </span>
          <span style="color: rgba(255,255,255,0.45); font-size: 0.78rem">3</span>
        </button>
        <button type="button" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px; border-radius: 12px; background: transparent; border: 0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06)">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-calendar-check" style="color: #20e0cf; font-size: 18px"></i> Past plans
          </span>
          <span style="color: rgba(255,255,255,0.45); font-size: 0.78rem">21</span>
        </button>
        <button type="button" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px; border-radius: 12px; background: transparent; border: 0; cursor: pointer">
          <span style="display: inline-flex; align-items: center; gap: 12px; color: var(--text); font-weight: 700; font-size: 0.9rem">
            <i class="ph-fill ph-id-badge" style="color: #f5c451; font-size: 18px"></i> Your public profile
          </span>
          <i class="ph ph-caret-right" style="color: rgba(255,255,255,0.4); font-size: 14px"></i>
        </button>
      </div>
    </div>

    <div style="position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 8px 14px; background: linear-gradient(180deg, transparent, var(--bg-0) 35%)">
      <div class="mr-tab-bar" style="margin: 0 8px">
        <button type="button" class="mr-tab-item" aria-label="Plans"><i class="ph ph-calendar-blank" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Explore"><i class="ph ph-compass" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-create" aria-label="Create"><i class="ph ph-plus-circle" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item mr-tab-active" aria-label="You"><i class="ph-fill ph-user" aria-hidden="true"></i></button>
        <button type="button" class="mr-tab-item" aria-label="Chat"><i class="ph ph-chat-teardrop-text" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>
