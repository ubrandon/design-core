<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Asheville</span>
      <div style="display: flex; gap: 6px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Share"><i class="ph ph-share-network" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="More"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
      </div>
    </header>

    <div style="padding: 4px 16px 14px; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="display: flex">
          <img src="https://i.pravatar.cc/40?img=14" alt="" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); object-fit: cover" />
          <img src="https://i.pravatar.cc/40?img=32" alt="" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); object-fit: cover; margin-left: -8px" />
          <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); margin-left: -8px; background: rgba(91,165,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; color: var(--text)">+3</div>
        </div>
        <span style="font-size: 0.82rem; color: rgba(255,255,255,0.6)">5 voting</span>
      </div>
      <div style="padding: 6px 12px; border-radius: 999px; background: rgba(32,224,207,0.14); color: #20e0cf; font-weight: 800; font-size: 0.74rem; display: inline-flex; align-items: center; gap: 5px">
        <i class="ph-fill ph-trophy" style="font-size: 12px"></i> Vote open
      </div>
    </div>

    <div style="padding: 0 16px 14px">
      <div style="padding: 12px 14px; background: linear-gradient(135deg, rgba(91,165,255,0.12), rgba(32,224,207,0.06)); border: 1px solid rgba(91,165,255,0.2); border-radius: 14px; display: flex; align-items: center; gap: 10px">
        <i class="ph-fill ph-info" style="color: #5ba5ff; font-size: 18px"></i>
        <div style="flex: 1; font-size: 0.82rem; color: rgba(255,255,255,0.85)">React to help your group decide where to go</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column">
      <div style="padding: 12px 16px">
        <div style="display: flex; gap: 12px; margin-bottom: 10px">
          <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=200&q=70" alt="" style="width: 56px; height: 56px; border-radius: 12px; object-fit: cover" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Henderson County Heritage Museum</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-bottom: 4px">Hendersonville, NC · Museum</div>
            <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: rgba(255,255,255,0.45)">
              <img src="https://i.pravatar.cc/20?img=14" alt="" style="width: 14px; height: 14px; border-radius: 50%" />
              Eric
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 6px">
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(32,224,207,0.16); border: 1px solid rgba(32,224,207,0.4); color: var(--text); font-weight: 800; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-thumbs-up" style="font-size: 14px; color: #20e0cf"></i> 4
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-heart" style="font-size: 14px; color: #ff6b8b"></i> 1
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-flame" style="font-size: 14px; color: #f5933b"></i> 0
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-thumbs-down" style="font-size: 14px; color: rgba(255,255,255,0.5)"></i> 0
          </button>
        </div>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 0 16px"></div>

      <div style="padding: 12px 16px; background: linear-gradient(180deg, rgba(245,196,81,0.06), transparent)">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px">
          <i class="ph-fill ph-trophy" style="color: #f5c451; font-size: 14px"></i>
          <span style="font-size: 0.7rem; font-weight: 800; color: #f5c451; letter-spacing: 0.06em; text-transform: uppercase">Top vote</span>
        </div>
        <div style="display: flex; gap: 12px; margin-bottom: 10px">
          <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=200&q=70" alt="" style="width: 56px; height: 56px; border-radius: 12px; object-fit: cover" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 2px">DELUXE</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-bottom: 4px">Hendersonville, NC · Restaurant</div>
            <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: rgba(255,255,255,0.45)">
              <img src="https://i.pravatar.cc/20?img=32" alt="" style="width: 14px; height: 14px; border-radius: 50%" />
              Sarah
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 6px">
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(32,224,207,0.22); border: 1px solid rgba(32,224,207,0.5); color: var(--text); font-weight: 800; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-thumbs-up" style="font-size: 14px; color: #20e0cf"></i> 5
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,107,139,0.16); border: 1px solid rgba(255,107,139,0.4); color: var(--text); font-weight: 800; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-heart" style="font-size: 14px; color: #ff6b8b"></i> 3
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-flame" style="font-size: 14px; color: #f5933b"></i> 0
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-thumbs-down" style="font-size: 14px; color: rgba(255,255,255,0.5)"></i> 0
          </button>
        </div>
      </div>

      <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 0 16px"></div>

      <div style="padding: 12px 16px">
        <div style="display: flex; gap: 12px; margin-bottom: 10px">
          <img src="https://images.unsplash.com/photo-1559925393-8be0ec4767c8?w=200&q=70" alt="" style="width: 56px; height: 56px; border-radius: 12px; object-fit: cover" />
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Shine</div>
            <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); margin-bottom: 4px">Hendersonville, NC · Bar</div>
            <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: rgba(255,255,255,0.45)">
              <img src="https://i.pravatar.cc/20?img=8" alt="" style="width: 14px; height: 14px; border-radius: 50%" />
              Brandon
            </div>
          </div>
        </div>

        <div style="display: flex; gap: 6px">
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(32,224,207,0.16); border: 1px solid rgba(32,224,207,0.4); color: var(--text); font-weight: 800; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-thumbs-up" style="font-size: 14px; color: #20e0cf"></i> 3
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-heart" style="font-size: 14px; color: #ff6b8b"></i> 2
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-flame" style="font-size: 14px; color: #f5933b"></i> 1
          </button>
          <button type="button" style="flex: 1; padding: 8px 6px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px">
            <i class="ph-fill ph-thumbs-down" style="font-size: 14px; color: rgba(255,255,255,0.5)"></i> 0
          </button>
        </div>
      </div>
    </div>

    <div style="padding: 18px 16px 24px">
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: rgba(91,165,255,0.08); border: 1px dashed rgba(91,165,255,0.3); border-radius: 14px; color: #5ba5ff; font-weight: 700; font-size: 0.88rem; cursor: pointer">
        <i class="ph-fill ph-plus-circle" style="font-size: 18px"></i>
        Save a place here
      </button>
    </div>
  </div>
</div>
