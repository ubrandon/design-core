<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Asheville</span>
      <div style="display: flex; gap: 6px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Share"><i class="ph ph-share-network" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="More"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
      </div>
    </header>

    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 16px 12px">
      <div style="display: flex">
        <img src="https://i.pravatar.cc/40?img=14" alt="" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); object-fit: cover" />
        <img src="https://i.pravatar.cc/40?img=32" alt="" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); object-fit: cover; margin-left: -8px" />
        <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); margin-left: -8px; background: rgba(91,165,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; color: var(--text)">+3</div>
      </div>
      <span style="font-size: 0.82rem; color: rgba(255,255,255,0.6)">5 members · Shared · 3 saved places</span>
    </div>

    <div style="padding: 0 16px 14px; display: flex; gap: 8px; overflow-x: auto" class="ds-scroll-x">
      <button type="button" style="flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); color: var(--text); font-weight: 800; font-size: 0.78rem; cursor: pointer">All · 3</button>
      <button type="button" style="flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.65); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px">
        <i class="ph-fill ph-bookmark-simple" style="font-size: 12px; color: #5ba5ff"></i> Want to go · 2
      </button>
      <button type="button" style="flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.65); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px">
        <i class="ph-fill ph-check-circle" style="font-size: 12px; color: #20e0cf"></i> Visited · 1
      </button>
      <button type="button" style="flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.65); font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px">
        <i class="ph-fill ph-star" style="font-size: 12px; color: #f5c451"></i> Loved
      </button>
    </div>

    <div style="padding: 0 16px 8px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 0.78rem; color: rgba(255,255,255,0.5); font-weight: 700">3 places</span>
      <button type="button" style="font-size: 0.78rem; color: rgba(255,255,255,0.7); background: transparent; border: 0; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">
        <i class="ph ph-arrows-down-up" style="font-size: 12px"></i> Recently added
      </button>
    </div>

    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
        <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=200&q=70" alt="" style="width: 56px; height: 56px; border-radius: 12px; object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Henderson County Heritage Museum</div>
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px">
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 0.66rem; font-weight: 800; color: #5ba5ff; padding: 2px 7px; border-radius: 999px; background: rgba(91,165,255,0.16); letter-spacing: 0.04em; text-transform: uppercase">
              <i class="ph-fill ph-bookmark-simple" style="font-size: 10px"></i> Want to go
            </span>
            <span style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Hendersonville, NC · 12 min</span>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: rgba(255,255,255,0.45)">
            <img src="https://i.pravatar.cc/20?img=14" alt="" style="width: 14px; height: 14px; border-radius: 50%" />
            Added by Eric
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
        <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=200&q=70" alt="" style="width: 56px; height: 56px; border-radius: 12px; object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 4px">DELUXE</div>
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px">
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 0.66rem; font-weight: 800; color: #5ba5ff; padding: 2px 7px; border-radius: 999px; background: rgba(91,165,255,0.16); letter-spacing: 0.04em; text-transform: uppercase">
              <i class="ph-fill ph-bookmark-simple" style="font-size: 10px"></i> Want to go
            </span>
            <span style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Hendersonville, NC · 15 min</span>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; color: rgba(255,255,255,0.45)">
            <img src="https://i.pravatar.cc/20?img=32" alt="" style="width: 14px; height: 14px; border-radius: 50%" />
            Added by Sarah
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
        <img src="https://images.unsplash.com/photo-1559925393-8be0ec4767c8?w=200&q=70" alt="" style="width: 56px; height: 56px; border-radius: 12px; object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.95rem; font-weight: 800; color: var(--text); margin-bottom: 4px">Shine</div>
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px">
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 0.66rem; font-weight: 800; color: #20e0cf; padding: 2px 7px; border-radius: 999px; background: rgba(32,224,207,0.16); letter-spacing: 0.04em; text-transform: uppercase">
              <i class="ph-fill ph-check-circle" style="font-size: 10px"></i> Visited
            </span>
            <span style="display: inline-flex; align-items: center; gap: 3px; font-size: 0.66rem; font-weight: 800; color: #f5c451; padding: 2px 7px; border-radius: 999px; background: rgba(245,196,81,0.16); letter-spacing: 0.04em; text-transform: uppercase">
              <i class="ph-fill ph-star" style="font-size: 10px"></i> Loved
            </span>
          </div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Hendersonville, NC · Apr 12</div>
        </div>
      </div>
    </div>

    <div style="padding: 18px 16px 24px">
      <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: rgba(91,165,255,0.08); border: 1px dashed rgba(91,165,255,0.3); border-radius: 14px; color: #5ba5ff; font-weight: 700; font-size: 0.88rem; cursor: pointer">
        <i class="ph-fill ph-plus-circle" style="font-size: 18px"></i>
        Save a place here
      </button>
    </div>
  </div>
</div>
