<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Asheville</span>
      <div style="display: flex; gap: 6px">
        <button type="button" class="mr-nav-icon-btn" aria-label="Share"><i class="ph ph-share-network" aria-hidden="true"></i></button>
        <button type="button" class="mr-nav-icon-btn" aria-label="More"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
      </div>
    </header>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="display: flex">
          <img src="https://i.pravatar.cc/40?img=14" alt="" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); object-fit: cover" />
          <img src="https://i.pravatar.cc/40?img=32" alt="" style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); object-fit: cover; margin-left: -8px" />
          <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg-0); margin-left: -8px; background: rgba(91,165,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; color: var(--text)">+3</div>
        </div>
        <span style="font-size: 0.82rem; color: rgba(255,255,255,0.6)">3 saved places</span>
      </div>

      <div style="display: inline-flex; padding: 3px; background: rgba(255,255,255,0.08); border-radius: 999px">
        <button type="button" style="display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; background: transparent; border: 0; color: rgba(255,255,255,0.6); font-weight: 700; font-size: 0.78rem; cursor: pointer">
          <i class="ph-fill ph-list-bullets" style="font-size: 13px"></i> List
        </button>
        <button type="button" style="display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px; background: var(--text); border: 0; color: #06080e; font-weight: 800; font-size: 0.78rem; cursor: pointer">
          <i class="ph-fill ph-map-trifold" style="font-size: 13px"></i> Map
        </button>
      </div>
    </div>

    <div style="padding: 0 16px 14px">
      <div style="position: relative; border-radius: 18px; overflow: hidden; height: 360px; border: 1px solid rgba(255,255,255,0.08)">
        <div style="position: absolute; inset: 0; background:
          radial-gradient(circle at 30% 40%, rgba(32,100,60,0.6), transparent 40%),
          radial-gradient(circle at 70% 60%, rgba(40,80,120,0.5), transparent 50%),
          linear-gradient(135deg, #0a2a3a, #0a3a3a, #0a2a4a)"></div>

        <svg style="position: absolute; inset: 0; width: 100%; height: 100%" viewBox="0 0 358 360" preserveAspectRatio="none">
          <path d="M 0 200 Q 80 180 160 220 T 358 240" stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none" />
          <path d="M 60 0 Q 100 100 80 200 T 120 360" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none" />
          <path d="M 200 0 Q 220 120 280 180 T 358 320" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none" />
        </svg>

        <div style="position: absolute; left: 32%; top: 38%; transform: translate(-50%, -100%)">
          <div style="position: relative; width: 36px; height: 46px">
            <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #ff6b8b, #ff3b6b); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 4px 14px rgba(255,107,139,0.5); display: flex; align-items: center; justify-content: center; padding-left: 8px">
              <span style="font-size: 0.78rem; font-weight: 900; color: white; transform: rotate(45deg)">1</span>
            </div>
          </div>
        </div>

        <div style="position: absolute; left: 56%; top: 52%; transform: translate(-50%, -100%)">
          <div style="position: relative; width: 36px; height: 46px">
            <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #5ba5ff, #2a7ad9); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 4px 14px rgba(91,165,255,0.5); display: flex; align-items: center; justify-content: center; padding-left: 8px">
              <span style="font-size: 0.78rem; font-weight: 900; color: white; transform: rotate(45deg)">2</span>
            </div>
          </div>
        </div>

        <div style="position: absolute; left: 70%; top: 70%; transform: translate(-50%, -100%)">
          <div style="position: relative; width: 36px; height: 46px">
            <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #20e0cf, #0fa698); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 4px 14px rgba(32,224,207,0.5); display: flex; align-items: center; justify-content: center; padding-left: 8px">
              <span style="font-size: 0.78rem; font-weight: 900; color: #06080e; transform: rotate(45deg)">3</span>
            </div>
          </div>
        </div>

        <button type="button" style="position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 12px; background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer">
          <i class="ph-fill ph-crosshair" style="font-size: 18px"></i>
        </button>

        <div style="position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(0,0,0,0.7); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px">
          <i class="ph-fill ph-route" style="font-size: 16px; color: #20e0cf"></i>
          <span style="flex: 1; font-size: 0.82rem; color: var(--text); font-weight: 700">Optimal route · 28 min total</span>
          <button type="button" style="padding: 6px 12px; border-radius: 999px; background: linear-gradient(135deg, #5ba5ff, #20e0cf); border: 0; color: #06080e; font-weight: 800; font-size: 0.74rem; cursor: pointer">Start</button>
        </div>
      </div>
    </div>

    <div style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 12px; padding: 10px; background: rgba(255,255,255,0.04); border-radius: 14px">
        <div style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #ff6b8b, #ff3b6b); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 900; color: white">1</div>
        <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=200&q=70" alt="" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Henderson County Heritage Museum</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">12 min · Open until 5 PM</div>
        </div>
      </div>
      <div style="display: flex; gap: 12px; padding: 10px; background: rgba(255,255,255,0.04); border-radius: 14px">
        <div style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #5ba5ff, #2a7ad9); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 900; color: white">2</div>
        <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=200&q=70" alt="" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">DELUXE</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">8 min from #1</div>
        </div>
      </div>
      <div style="display: flex; gap: 12px; padding: 10px; background: rgba(255,255,255,0.04); border-radius: 14px">
        <div style="flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #20e0cf, #0fa698); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 900; color: #06080e">3</div>
        <img src="https://images.unsplash.com/photo-1559925393-8be0ec4767c8?w=200&q=70" alt="" style="width: 48px; height: 48px; border-radius: 10px; object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.88rem; font-weight: 800; color: var(--text)">Shine</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">8 min from #2</div>
        </div>
      </div>
    </div>
  </div>
</div>
