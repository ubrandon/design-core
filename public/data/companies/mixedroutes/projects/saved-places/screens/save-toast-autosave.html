<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; position: relative">
  <div class="mr-scope">
    <div style="position: relative">
      <img
        src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=900&q=70"
        alt=""
        style="width: 100%; height: 280px; object-fit: cover; display: block"
        loading="lazy"
      />
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(1,11,20,0.55) 0%, rgba(1,11,20,0) 30%, rgba(1,11,20,0) 60%, rgba(1,11,20,0.85) 100%)"></div>
      <header style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0">
        <button type="button" class="mr-nav-icon-btn" aria-label="Back" style="background: rgba(0,0,0,0.45); backdrop-filter: blur(10px)">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="mr-nav-icon-btn" aria-label="Share" style="background: rgba(0,0,0,0.45); backdrop-filter: blur(10px)">
          <i class="ph ph-share-network" aria-hidden="true"></i>
        </button>
      </header>
    </div>

    <div style="padding: 16px 16px 0">
      <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text); margin: 0 0 6px; line-height: 1.15">Henderson County Heritage Museum</h1>
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px">
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: 700; color: var(--text)">
          <i class="ph-fill ph-star" style="color: #f5c451; font-size: 14px"></i> 4.6
          <span style="color: rgba(255,255,255,0.5); font-weight: 500">(182)</span>
        </span>
        <span style="color: rgba(255,255,255,0.3)">·</span>
        <span style="font-size: 0.85rem; color: rgba(255,255,255,0.7)">Museum</span>
      </div>
      <p style="font-size: 0.92rem; color: rgba(255,255,255,0.7); margin: 0 0 16px; line-height: 1.5">A re-created courthouse & general store join military exhibits at this local history facility.</p>
    </div>

    <div style="padding: 0 16px 24px">
      <div style="font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px">Hours</div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: rgba(255,255,255,0.04); border-radius: 12px">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem">
          <span style="color: var(--text); font-weight: 700">Today</span>
          <span style="color: #20e0cf; font-weight: 700">10 AM – 5 PM</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: rgba(255,255,255,0.6)">
          <span>Tomorrow</span>
          <span>10 AM – 5 PM</span>
        </div>
      </div>
    </div>

    <div style="height: 200px"></div>
  </div>

  <div style="position: absolute; bottom: 96px; left: 16px; right: 16px; padding: 12px 14px; background: rgba(15,30,50,0.92); backdrop-filter: blur(20px); border: 1px solid rgba(91,165,255,0.35); border-radius: 18px; box-shadow: 0 18px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(91,165,255,0.1); display: flex; align-items: center; gap: 12px; animation: slideUp 0.3s ease-out">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, rgba(91,165,255,0.3), rgba(32,224,207,0.18)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative">
      <i class="ph-fill ph-clipboard-text" style="color: #5ba5ff; font-size: 20px"></i>
      <div style="position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: #20e0cf; border: 2px solid #0f1e32; display: flex; align-items: center; justify-content: center">
        <i class="ph-bold ph-check" style="font-size: 10px; color: #06080e"></i>
      </div>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 0.86rem; font-weight: 800; color: var(--text); margin-bottom: 2px">Saved to Asheville</div>
      <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Shared · 5 members</div>
    </div>
    <button type="button" style="padding: 7px 12px; border-radius: 999px; background: rgba(91,165,255,0.18); border: 1px solid rgba(91,165,255,0.35); color: #5ba5ff; font-weight: 800; font-size: 0.74rem; cursor: pointer; flex-shrink: 0">Change</button>
    <button type="button" style="padding: 7px 12px; border-radius: 999px; background: linear-gradient(135deg, #5ba5ff, #20e0cf); border: 0; color: #06080e; font-weight: 800; font-size: 0.74rem; cursor: pointer; flex-shrink: 0">View</button>
  </div>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px; background: linear-gradient(180deg, rgba(1,11,20,0) 0%, rgba(1,11,20,0.95) 30%, rgba(1,11,20,1) 100%); display: flex; gap: 10px">
    <button type="button" aria-label="Saved to Asheville" style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 16px; background: rgba(255,107,139,0.16); border: 1px solid rgba(255,107,139,0.4); color: #ff6b8b; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative">
      <i class="ph-fill ph-heart" style="font-size: 22px"></i>
      <span style="position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: #20e0cf; border: 2px solid var(--bg-0); display: flex; align-items: center; justify-content: center">
        <i class="ph-bold ph-check" style="font-size: 9px; color: #06080e"></i>
      </span>
    </button>
    <button type="button" style="flex: 1; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #5ba5ff, #20e0cf); border: 0; color: #06080e; font-weight: 800; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <i class="ph-fill ph-calendar-plus" style="font-size: 18px"></i>
      Add to plan
    </button>
  </div>
</div>

<style>
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
