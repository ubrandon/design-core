<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh">
  <div class="mr-scope">
    <header style="display: flex; align-items: center; gap: 8px; padding: 18px 16px 8px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Back">
        <i class="ph ph-arrow-left" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1.1rem; font-weight: 800; color: var(--text); flex: 1">Members</span>
      <span style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">5</span>
    </header>

    <button type="button" style="display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; padding: 14px 16px; text-align: left; cursor: pointer">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #5ba5ff, #20e0cf); display: flex; align-items: center; justify-content: center; color: #06080e">
        <i class="ph-fill ph-user-plus" style="font-size: 20px"></i>
      </div>
      <div style="flex: 1">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Invite people</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">Send an invite link or share with contacts</div>
      </div>
      <i class="ph ph-caret-right" style="font-size: 14px; color: rgba(255,255,255,0.4)"></i>
    </button>

    <div style="padding: 12px 16px 6px">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Owner</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
      <div style="position: relative">
        <img src="https://i.pravatar.cc/72?img=11" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" />
        <div style="position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background: #20e0cf; border: 2px solid var(--bg-0)"></div>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Brandon Unglaub</span>
          <span style="font-size: 0.66rem; font-weight: 800; color: #f5c451; padding: 2px 6px; border-radius: 999px; background: rgba(245,196,81,0.14); letter-spacing: 0.04em; text-transform: uppercase">Owner</span>
        </div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@brandon · Active now</div>
      </div>
    </div>

    <div style="padding: 14px 16px 6px">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Editors · 1</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
      <div style="position: relative">
        <img src="https://i.pravatar.cc/72?img=14" alt="" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover" />
        <div style="position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; background: #20e0cf; border: 2px solid var(--bg-0)"></div>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Eric Hechavarria</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@erichech · Active 2 min ago</div>
      </div>
      <button type="button" style="padding: 6px 12px; border-radius: 999px; background: rgba(91,165,255,0.14); border: 1px solid rgba(91,165,255,0.3); color: #5ba5ff; font-weight: 800; font-size: 0.74rem; display: inline-flex; align-items: center; gap: 4px; cursor: pointer">
        Editor <i class="ph ph-caret-down" style="font-size: 10px"></i>
      </button>
    </div>

    <div style="padding: 14px 16px 6px">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase">Viewers · 2</div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
      <div style="position: relative">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: rgba(32,224,207,0.18); display: flex; align-items: center; justify-content: center; color: #20e0cf; font-weight: 800; font-size: 0.95rem">B</div>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Brandon Unglaub</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@mixyboi · Active yesterday</div>
      </div>
      <button type="button" style="padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.74rem; display: inline-flex; align-items: center; gap: 4px; cursor: pointer">
        Viewer <i class="ph ph-caret-down" style="font-size: 10px"></i>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); font-weight: 800; font-size: 0.85rem">TT</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Test Test</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">@test · Active 3 days ago</div>
      </div>
      <button type="button" style="padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); font-weight: 700; font-size: 0.74rem; display: inline-flex; align-items: center; gap: 4px; cursor: pointer">
        Viewer <i class="ph ph-caret-down" style="font-size: 10px"></i>
      </button>
    </div>

    <div style="padding: 14px 16px 6px">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(245,147,59,0.85); letter-spacing: 0.08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px">
        <i class="ph-fill ph-clock-countdown" style="font-size: 12px"></i> Pending · 1
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; opacity: 0.85">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,147,59,0.14); display: flex; align-items: center; justify-content: center; color: #f5933b">
        <i class="ph-fill ph-envelope" style="font-size: 18px"></i>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 0.95rem; font-weight: 800; color: var(--text)">jamie@example.com</div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.5)">Invited yesterday · expires in 6 days</div>
      </div>
      <button type="button" class="mr-nav-icon-btn" aria-label="Resend invite">
        <i class="ph ph-paper-plane-tilt" style="font-size: 16px; color: #f5933b"></i>
      </button>
    </div>

    <div style="padding: 18px 16px 24px">
      <div style="height: 1px; background: rgba(255,255,255,0.06); margin-bottom: 14px"></div>
      <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; background: transparent; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: rgba(255,255,255,0.85); font-weight: 700; font-size: 0.86rem; cursor: pointer; text-align: left">
        <i class="ph-fill ph-crown-simple" style="font-size: 16px; color: #f5c451"></i>
        Transfer ownership
        <i class="ph ph-caret-right" style="font-size: 12px; margin-left: auto; color: rgba(255,255,255,0.4)"></i>
      </button>
    </div>
  </div>
</div>
