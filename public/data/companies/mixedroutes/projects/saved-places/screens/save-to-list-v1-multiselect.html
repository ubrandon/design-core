<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<div style="background: var(--bg-0); overflow-x: clip; min-height: 100vh; padding-bottom: 100px">
  <div class="mr-scope">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px">
      <button type="button" class="mr-nav-icon-btn" aria-label="Cancel">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
      <span style="font-size: 1.05rem; font-weight: 800; color: var(--text)">Save place</span>
      <button type="button" style="padding: 6px 12px; border-radius: 999px; background: rgba(91,165,255,0.14); border: 1px solid rgba(91,165,255,0.3); color: #5ba5ff; font-weight: 800; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px">
        <i class="ph ph-plus" style="font-size: 12px"></i> New
      </button>
    </header>

    <div style="padding: 4px 16px 14px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px">
        <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=200&q=70" alt="" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover" />
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 0.9rem; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Henderson County Heritage Museum</div>
          <div style="font-size: 0.74rem; color: rgba(255,255,255,0.55)">Hendersonville, NC · Museum</div>
        </div>
      </div>
    </div>

    <div style="padding: 0 16px 14px">
      <div style="position: relative">
        <textarea placeholder="Add a note (optional)" rows="2" style="width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; color: var(--text); font-size: 0.88rem; outline: none; resize: none; font-family: inherit; line-height: 1.4"></textarea>
        <i class="ph ph-note-pencil" style="position: absolute; right: 12px; top: 12px; color: rgba(255,255,255,0.3); font-size: 14px"></i>
      </div>
    </div>

    <div style="padding: 0 16px 8px">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px">Recent</div>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; width: 100%; background: rgba(91,165,255,0.06); border: 0; cursor: pointer; text-align: left">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, rgba(91,165,255,0.3), rgba(32,224,207,0.18)); display: flex; align-items: center; justify-content: center">
        <i class="ph-fill ph-clipboard-text" style="color: #5ba5ff; font-size: 22px"></i>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 2px">
          <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Asheville</span>
          <span style="font-size: 0.62rem; padding: 2px 6px; border-radius: 999px; background: rgba(91,165,255,0.18); color: #5ba5ff; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">Shared</span>
        </div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55); display: inline-flex; align-items: center; gap: 4px">
          <span>3 places · 5 members</span>
        </div>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #5ba5ff, #20e0cf); display: flex; align-items: center; justify-content: center">
        <i class="ph-bold ph-check" style="font-size: 14px; color: #06080e"></i>
      </div>
    </button>

    <div style="padding: 12px 16px 8px">
      <div style="font-size: 0.7rem; font-weight: 800; color: rgba(255,255,255,0.5); letter-spacing: 0.08em; text-transform: uppercase">Your saved places</div>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; width: 100%; background: rgba(91,165,255,0.06); border: 0; cursor: pointer; text-align: left">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(255,107,139,0.18); display: flex; align-items: center; justify-content: center">
        <i class="ph-fill ph-heart" style="color: #ff6b8b; font-size: 22px"></i>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 2px">
          <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Favorites</span>
          <span style="font-size: 0.62rem; padding: 2px 6px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">Private</span>
        </div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">7 places</div>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #5ba5ff, #20e0cf); display: flex; align-items: center; justify-content: center">
        <i class="ph-bold ph-check" style="font-size: 14px; color: #06080e"></i>
      </div>
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; width: 100%; background: transparent; border: 0; cursor: pointer; text-align: left">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(245,196,81,0.18); display: flex; align-items: center; justify-content: center">
        <i class="ph-fill ph-fork-knife" style="color: #f5c451; font-size: 22px"></i>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 2px">
          <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Date night spots</span>
          <span style="font-size: 0.62rem; padding: 2px 6px; border-radius: 999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">Private</span>
        </div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">12 places</div>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></div>
    </button>

    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; width: 100%; background: transparent; border: 0; cursor: pointer; text-align: left">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(32,224,207,0.18); display: flex; align-items: center; justify-content: center">
        <i class="ph-fill ph-mountains" style="color: #20e0cf; font-size: 22px"></i>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 2px">
          <span style="font-size: 0.95rem; font-weight: 800; color: var(--text)">Hiking spots</span>
          <span style="font-size: 0.62rem; padding: 2px 6px; border-radius: 999px; background: rgba(91,165,255,0.18); color: #5ba5ff; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase">Shared</span>
        </div>
        <div style="font-size: 0.78rem; color: rgba(255,255,255,0.55)">4 places · 3 members</div>
      </div>
      <div style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2)"></div>
    </button>

    <div style="position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 22px; background: linear-gradient(180deg, rgba(1,11,20,0) 0%, rgba(1,11,20,0.95) 30%, rgba(1,11,20,1) 100%); display: flex; align-items: center; gap: 12px">
      <span style="font-size: 0.82rem; color: rgba(255,255,255,0.65)"><strong style="color: var(--text); font-weight: 800">2 lists</strong> selected</span>
      <button type="button" style="flex: 1; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #5ba5ff, #20e0cf); border: 0; color: #06080e; font-weight: 800; font-size: 0.92rem; cursor: pointer">Save</button>
    </div>
  </div>
</div>
