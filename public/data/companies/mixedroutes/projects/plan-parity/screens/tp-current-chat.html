<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .chat-scope { --chat-bg: #f1f4f7; --chat-surface: #ffffff; --chat-out: linear-gradient(90deg,#d8f0f1 0%,#cae9ee 100%); --chat-text: #1a2332; --chat-muted: #5c6b7d; --chat-primary: #06b6d4; --chat-medium: #9aa4b2; --chat-input: rgba(118,118,128,0.12); --chat-grad: linear-gradient(145deg,#14b8a6,#3b82f6); --bubble-radius: 18px; }
  .chat-scope .chat-wrap { background: var(--chat-bg); height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .chat-scope .chat-body { overflow-y: auto; }
  .chat-scope .chat-pattern { position: absolute; inset: 0; background: linear-gradient(rgba(241,244,247,0.85), rgba(241,244,247,0.85)), url('../../../design-system/mixedroutes-assets/plan-default.png'); background-size: 300px 300px; background-repeat: repeat; pointer-events: none; }
  .chat-scope .chat-header { position: sticky; top: 0; z-index: 3; display: grid; grid-template-columns: 28px 36px 1fr 28px; align-items: center; gap: 10px; padding: 10px 12px; background: #ffffff; border-bottom: 1px solid #e1e3e6; }
  .chat-scope .chat-header .back { background: transparent; border: 0; color: var(--chat-text); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .chat-scope .chat-header .back i { font-size: 22px; }
  .chat-scope .chat-header .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
  .chat-scope .chat-header .avatar.plan { border-radius: 10px; }
  .chat-scope .chat-header .title { font-size: 1rem; font-weight: 800; color: var(--chat-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-scope .chat-header .tag-btn { background: transparent; border: 0; color: var(--chat-text); padding: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .chat-scope .chat-header .tag-btn i { font-size: 20px; }

  .chat-scope .chat-body { position: relative; z-index: 1; flex: 1; padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 10px; }

  .chat-scope .msg-row { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: flex-start; }
  .chat-scope .msg-row.out { grid-template-columns: 1fr; }
  .chat-scope .msg-row .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; align-self: flex-start; }
  .chat-scope .msg-row .avatar.initials { background: #b45309; color: #fff; font-size: 0.7rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; letter-spacing: 0.02em; }
  .chat-scope .msg-stack { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
  .chat-scope .msg-row.out .msg-stack { margin-left: auto; align-items: flex-end; }

  .chat-scope .bubble { padding: 9px 12px 10px; border-radius: var(--bubble-radius); color: var(--chat-text); font-size: 0.95rem; line-height: 1.3; word-wrap: break-word; }
  .chat-scope .bubble.in { background: var(--chat-surface); border-bottom-left-radius: 6px; }
  .chat-scope .bubble.out { background: var(--chat-out); border-bottom-right-radius: 6px; }
  .chat-scope .bubble.emoji-only { background: transparent; padding: 0; font-size: 2.4rem; line-height: 1; }
  .chat-scope .bubble .sender { font-size: 0.82rem; font-weight: 800; color: #7c3aed; margin-bottom: 2px; }
  .chat-scope .bubble.in.contd { border-top-left-radius: 6px; }
  .chat-scope .msg-stack .bubble + .bubble.in { border-top-left-radius: 6px; }
  .chat-scope .msg-stack .bubble + .bubble.out { border-top-right-radius: 6px; }
  .chat-scope .msg-stack .bubble:not(:last-child).in { border-bottom-left-radius: 6px; }
  .chat-scope .msg-stack .bubble:not(:last-child).out { border-bottom-right-radius: 6px; }

  .chat-scope .seen { text-align: center; color: var(--chat-muted); font-size: 0.78rem; padding: 6px 0 2px; }

  .chat-scope .channel-row { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 4px 12px 6px; }
  .chat-scope .channel-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; background: #fff; color: #111; font-weight: 800; font-size: 0.9rem; }
  .chat-scope .channel-pill.outline { background: transparent; color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.18); }
  .chat-scope .channel-pill.outline.selected { background: rgba(91,165,255,0.14); border-color: rgba(91,165,255,0.4); color: #fff; }
  .chat-scope .channel-pill .ph { font-size: 14px; }
  .chat-scope .channel-edit-btn { width: 32px; height: 32px; border-radius: 50%; background: transparent; border: 1px solid rgba(255,255,255,0.18); color: rgba(255,255,255,0.7); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .chat-scope .channel-edit-btn i { font-size: 14px; }
  .chat-scope .channel-add-btn { width: 32px; height: 32px; border-radius: 50%; background: transparent; border: 1px dashed rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .chat-scope .channel-add-btn i { font-size: 16px; }

  .chat-scope .composer { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 48px; align-items: center; gap: 8px; padding: 8px 16px 20px; background: #ffffff; }
  .chat-scope .composer .input-pill { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 4px; height: 48px; padding: 0 8px; border-radius: 24px; background: var(--chat-input); }
  .chat-scope .composer .input-pill .placeholder { color: var(--chat-muted); font-size: 0.98rem; padding-left: 4px; }
  .chat-scope .composer .icon-btn { background: transparent; border: 0; color: var(--chat-medium); width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .chat-scope .composer .icon-btn i { font-size: 24px; }
  .chat-scope .composer .plus-btn { color: var(--chat-medium); }
  .chat-scope .composer .send-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--chat-input); color: var(--chat-medium); border: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .chat-scope .composer .send-btn i { font-size: 22px; }
</style>

<div class="mr-scope chat-scope">
  <div class="chat-wrap">
    <div class="chat-pattern" aria-hidden="true"></div>

    <header class="chat-header">
      <button type="button" class="back" aria-label="Back"><i class="ph ph-caret-left"></i></button>
      <img class="avatar plan" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=120&h=120&q=70" alt="" />
      <div class="title">Sunrise hike at Mt. Tam</div>
      <button type="button" class="tag-btn" aria-label="Tag"><i class="ph ph-tag"></i></button>
    </header>

    <div class="chat-body">
      <div class="msg-row">
        <img class="avatar" src="https://i.pravatar.cc/64?img=12" alt="" />
        <div class="msg-stack">
          <div class="bubble in">
            <div class="sender">Maya Chen</div>
            Who's up for the sunrise hike this weekend?
          </div>
        </div>
      </div>

      <div class="msg-row">
        <div class="avatar initials" aria-hidden="true">SO</div>
        <div class="msg-stack">
          <div class="bubble in">
            <div class="sender" style="color:#b45309">Sam Ortiz</div>
            I'm in, as long as we carpool
          </div>
          <div class="bubble emoji-only">❤️</div>
        </div>
      </div>

      <div class="msg-row out">
        <div class="msg-stack">
          <div class="bubble out">Same. I can drive from the Pantoll lot if we leave by 5:45</div>
        </div>
      </div>

      <div class="seen">Seen by you</div>
    </div>

    <div class="composer">
      <div class="input-pill">
        <button type="button" class="icon-btn plus-btn" aria-label="Add"><i class="ph ph-plus"></i></button>
        <span class="placeholder">Message</span>
        <button type="button" class="icon-btn" aria-label="Photo"><i class="ph ph-image"></i></button>
        <button type="button" class="icon-btn" aria-label="Emoji"><i class="ph ph-smiley"></i></button>
      </div>
      <button type="button" class="send-btn" aria-label="Send"><i class="ph ph-paper-plane-right"></i></button>
    </div>
  </div>
</div>
