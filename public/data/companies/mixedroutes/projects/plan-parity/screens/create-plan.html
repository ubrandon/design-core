<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<link rel="stylesheet" href="../pp.css" />

<div class="pp pp-create" style="background: #ffffff;">
  <div class="status"><span>9:41</span><span class="r"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>

  <div class="toolbar">
    <h1>Create plan</h1>
    <span class="icon-btn"><i class="ph ph-x"></i></span>
  </div>

  <div class="content">
    <!-- Cover picker, empty -->
    <div class="media">
      <div class="ph-img" style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=800&q=60');"></div>
      <div class="mrow"><span class="mbtn"><i class="ph ph-image-square"></i>Add banner</span></div>
    </div>

    <div class="details-card">
      <div class="name-wrap">
        <div class="name-input empty">
          <span class="lead"><i class="ph ph-smiley"></i></span>
          Plan name...
        </div>
      </div>

      <div class="plan-it">
        <h2 class="sec">What, when &amp; where?</h2>
        <div class="empty-row">
          <div class="tile"><i class="ph ph-list-checks"></i><span>Details</span><span class="plus-badge"><i class="ph ph-plus"></i></span></div>
          <div class="tile"><i class="ph ph-calendar-blank"></i><span>Date</span><span class="plus-badge"><i class="ph ph-plus"></i></span></div>
          <div class="tile"><i class="ph ph-map-pin"></i><span>Place</span><span class="plus-badge"><i class="ph ph-plus"></i></span></div>
        </div>
      </div>

      <div class="privacy-sec">
        <h2 class="sec">Invite &amp; share</h2>
        <div class="facet">
          <div class="head" style="align-items:center;">
            <span class="ibox dim"><i class="ph ph-user-plus"></i></span>
            <div class="txt"><div class="title label" style="margin-top:0;">Invite guests</div></div>
          </div>
          <span class="plus-badge"><i class="ph ph-plus"></i></span>
        </div>
        <div class="privacy">
          <span class="pibox"><i class="ph ph-lock"></i></span>
          <div class="ptxt"><div class="ptitle">Visibility and Sharing</div></div>
          <span class="pval">Private <i class="ph ph-caret-right"></i></span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="hint"><i class="ph-fill ph-info"></i>Give your plan a name</div>
    <span class="btn-grad" style="opacity:0.5;">Create private plan</span>
    <div class="home-bar"></div>
  </div>
</div>
