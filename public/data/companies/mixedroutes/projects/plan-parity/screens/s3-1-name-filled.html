<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<link rel="stylesheet" href="../pp.css" />

<div class="pp s3 s3-1b centered" style="background: #ffffff;">
  <div class="status"><span>9:41</span><span class="r"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>

  <div class="ts-toolbar">
    <span class="icon-btn"><i class="ph ph-x"></i></span>
    <span class="ttl">Plan something</span>
    <span class="skip hide">Skip</span>
  </div>
  <div class="steps"><span class="on"></span><span></span><span></span></div>

  <div class="content">
    <div class="banner-slot hide">
      <span class="bs-btn"><i class="ph ph-image"></i>Add banner</span>
    </div>
    <div class="banner-hero" style="background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=800&q=70');">
      <div class="bh-actions">
        <span class="bh-btn"><i class="ph ph-image"></i>Change</span>
        <span class="bh-btn icon-only bh-remove"><i class="ph ph-trash"></i></span>
      </div>
    </div>

    <div class="name-wrap2">
      <div class="name-input">
        <span class="lead emoji">🏃</span>
        Afternoon run
        <span class="drop-ic"><i class="ph ph-caret-down"></i></span>
      </div>
    </div>

    <div class="tags">
      <span class="chip sel" data-tag><em>🏃</em>Run <i class="ph-fill ph-check-circle"></i></span>
      <span class="chip" data-tag><em>🌉</em>Outdoors <i class="ph ph-plus"></i></span>
      <span class="chip" data-tag><em>☀️</em>Morning <i class="ph ph-plus"></i></span>
      <span class="chip add">Add tags <i class="ph ph-plus"></i></span>
    </div>
  </div>

  <div class="footer" style="padding-top:20px;">
    <span class="btn-grad">Continue</span>
    <span class="btn-ghost">Create now, just me</span>
    <div class="home-bar"></div>
  </div>
</div>

<script>
(function () {
  var root = document.querySelector('.s3-1b'); if (!root) return;
  var slot = root.querySelector('.banner-slot'), hero = root.querySelector('.banner-hero');
  root.querySelector('.bh-remove').addEventListener('click', function () { hero.classList.add('hide'); slot.classList.remove('hide'); });
  slot.querySelector('.bs-btn').addEventListener('click', function () { slot.classList.add('hide'); hero.classList.remove('hide'); });
  root.querySelectorAll('[data-tag]').forEach(function (c) {
    c.addEventListener('click', function () {
      var on = !c.classList.contains('sel'); c.classList.toggle('sel', on);
      c.querySelector('i').className = on ? 'ph-fill ph-check-circle' : 'ph ph-plus';
    });
  });
})();
</script>
