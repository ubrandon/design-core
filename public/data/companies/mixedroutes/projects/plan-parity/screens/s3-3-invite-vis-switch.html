<style>
  .pp.s3 .set-list { background: #f1f4f7; border-radius: 20px; padding: 0 12px; }
  .pp.s3 .set-item { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 2px 10px 6px; cursor: pointer; }
  .pp.s3 .set-item > i { font-size: 20px; color: #5c6b7d; width: 22px; text-align: center; flex-shrink: 0; }
  .pp.s3 .set-item > i.end { font-size: 16px; color: #858b94; width: auto; }
  .pp.s3 .set-item .st { flex: 1; min-width: 0; }
  .pp.s3 .set-item .st b { display: block; font-size: 16px; font-weight: 600; color: #1a2332; line-height: 1.25; }
  .pp.s3 .set-item .st span { display: block; font-size: 13px; color: #5c6b7d; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s3-3v .join-row { margin-bottom: 12px; }
  .s3-3v .join-row .set-item > i:first-child { color: #234e8a; }
  .s3-3v .hide { display: none !important; }
  .s3-3v .vs-sheet { border-radius: 24px 24px 0 0; padding-bottom: 28px; }
  .s3-3v .vs-sheet .sh-tb { height: 60px; padding: 4px 8px 0 20px; }
  .s3-3v .vs-sheet .sh-tb h2 { font-size: 22px; }
  .s3-3v .vs-sheet .sh-sec { padding: 22px 20px 8px; font-size: 13px; letter-spacing: 0.06em; }
  .s3-3v .vs-vis { margin: 0 16px; }
  .s3-3v .vs-seg-note { margin: 10px 6px 0; font-size: 14px; color: #5c6b7d; line-height: 1.35; }
  .s3-3v .vs-list { margin: 0 16px; border-radius: 18px; background: #f1f4f7; overflow: hidden; }
  .s3-3v .join-row .set-item + .set-item { box-shadow: inset 0 1px 0 rgba(16,23,36,0.08); }
  .s3-3v .vs-row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 12px; cursor: pointer; }
  .s3-3v .vs-row > i { font-size: 22px; color: #5c6b7d; width: 24px; text-align: center; flex-shrink: 0; }
  .s3-3v .vs-row .vt { flex: 1; min-width: 0; }
  .s3-3v .vs-row .vt b { display: block; font-size: 16px; font-weight: 700; color: #1a2332; line-height: 1.25; }
  .s3-3v .vs-row .vt span { display: block; font-size: 13px; color: #5c6b7d; margin-top: 2px; line-height: 1.3; }
  .s3-3v .vs-row .toggle { flex-shrink: 0; width: 46px; height: 28px; }
  .s3-3v .vs-row .toggle::after { width: 24px; height: 24px; }
  .s3-3v .vs-row .toggle.on::after { left: 20px; }
  .s3-3v .vs-sheet .sh-foot { padding: 20px 16px 0; }
  .s3-3p .vis-slim { cursor: pointer; padding: 10px 12px 10px 12px; }
  .s3-3p .vis-slim .vibox { width: 36px; height: 36px; font-size: 20px; }
  .s3-3p .vis-slim .vtxt { min-width: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
  .s3-3p .vis-slim .vtxt b { display: inline; font-size: 16px; }
  .s3-3p .vis-slim .vtxt span { font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
  .s3-3p .vis-slim .pval { color: #5c6b7d; }
  .s3-3p .selected-strip:empty { display: none; }
  .s3-3p .selected-strip { margin-top: 10px; }
</style>
<script>
(function () {
  var root = document.querySelector('.s3-3p'); if (!root) return;
  var strip = root.querySelector('.selected-strip'), cta = root.querySelector('.cta-lbl');
  var sel = {};
  function render() {
    strip.innerHTML = '';
    Object.keys(sel).forEach(function (id) {
      var r = sel[id], c = document.createElement('span'); c.className = 'selchip';
      c.innerHTML = (r.img ? '<img src="' + r.img + '" alt="" />' : '<span class="grp">' + r.grp + '</span>') + r.name + ' <i class="ph ph-x"></i>';
      c.querySelector('i').addEventListener('click', function () { setRow(root.querySelector('.prow[data-id=' + id + ']'), false); });
      strip.appendChild(c);
    });
    var n = Object.keys(sel).length;
    cta.textContent = n ? 'Create & invite ' + n : 'Create plan';
  }
  function setRow(row, on) {
    var id = row.getAttribute('data-id'), box = row.querySelector('.mr-checkbox');
    box.classList.toggle('is-checked', on);
    box.innerHTML = on ? '<i class="ph-fill ph-check-square"></i>' : '<i class="ph ph-square"></i>';
    if (on) sel[id] = { name: row.getAttribute('data-name'), img: row.getAttribute('data-img'), grp: row.getAttribute('data-grp') }; else delete sel[id];
    render();
  }
  root.querySelectorAll('.prow[data-id]').forEach(function (row) {
    row.addEventListener('click', function () { setRow(row, !row.querySelector('.mr-checkbox').classList.contains('is-checked')); });
  });
})();
</script>
