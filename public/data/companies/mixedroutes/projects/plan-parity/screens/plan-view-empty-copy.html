<div class="pp pp-plan-view pp-plan-empty" style="background: #ffffff;">
  <div class="status light"><span>9:41</span><span class="r"><i class="ph-fill ph-cell-signal-full"></i><i class="ph-fill ph-wifi-high"></i><i class="ph-fill ph-battery-full"></i></span></div>

  <div class="overlay-tb">
    <span class="circ"><i class="ph ph-caret-left"></i></span>
    <span class="right">
      <span class="circ"><i class="ph ph-share-network"></i></span>
      <span class="circ"><i class="ph ph-pencil-simple"></i></span>
      <span class="circ"><i class="ph ph-dots-three-vertical"></i></span>
    </span>
  </div>

  <div class="hero hero-emoji">
    <div class="grad"></div>
    <div class="fade"></div>
    <div class="hero-inner">
      <span class="hero-emoji-tile">🏃</span>
      <span class="date-badge">Later today</span>
      <h1>Afternoon run</h1>
      <div class="hero-btns">
        <span class="hb-chat"><i class="ph-fill ph-chat-circle"></i>Chat</span>
        <span class="hb-going"><i class="ph-fill ph-check-circle"></i>Going</span>
      </div>
    </div>
  </div>

  <div class="below">
    <div class="top-info">
      <div class="part-row">
        <div class="stack">
          <span class="st"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=96&h=96&q=80" alt="" /><span class="tag host"><i class="ph-fill ph-crown"></i></span></span>
          <span class="st"><img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=96&h=96&q=80" alt="" /></span>
          <span class="st"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=96&h=96&q=80" alt="" /></span>
          <span class="st"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=96&h=96&q=80" alt="" /></span>
        </div>
        <div class="ptext"><b>You + 3 invited</b><span><i class="ph-fill ph-lock"></i>Private plan</span></div>
        <i class="ph ph-caret-right"></i>
      </div>

      <div class="date-row"><i class="ph-fill ph-calendar-blank"></i><b>Later today</b><span>· no set time</span></div>
    </div>

    <div class="setup">
      <div class="setup-hd">
        <b>Finish setting up</b>
      </div>
      <div class="next-row">
        <span class="nx"><i class="ph ph-link"></i>Copy link</span>
        <span class="nx"><i class="ph ph-clock"></i>Set a time</span>
        <span class="nx"><i class="ph ph-map-pin"></i>Add place</span>
        <span class="nx"><i class="ph ph-user-plus"></i>Invite more</span>
      </div>
    </div>
  </div>
  <div class="home-bar"></div>
</div>
