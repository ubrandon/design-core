<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .ze-scope { --pv-bg: #0a0f14; --pv-green: #34c759; --pv-green-soft: rgba(52,199,89,0.16); --pv-amber: #f5b400; --pv-red: #ff5a5f; }
  .ze-scope, .ze-scope * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
  .ze-scope::-webkit-scrollbar, .ze-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .ze-scope .ze-wrap { background: var(--pv-bg); padding: 24px 20px; }

  .ze-scope .pv-card { background: linear-gradient(165deg, #1c2533 0%, #141b26 100%); border-radius: 22px; padding: 22px 20px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }

  .ze-scope .ze-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .ze-scope .ze-head .ht { flex: 1; min-width: 0; }
  .ze-scope .ze-head .ht .t1 { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
  .ze-scope .ze-head .ht .t2 { font-size: 0.86rem; font-weight: 700; color: #8ab4ff; margin-top: 6px; display: inline-flex; align-items: center; gap: 7px; }
  .ze-scope .ze-head .ht .t2 i { font-size: 15px; }
  .ze-scope .ze-head .sh { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.08); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .ze-scope .ze-head .sh i { font-size: 19px; }

  .ze-scope .ze-summary { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .ze-scope .ze-summary .empty { font-size: 0.92rem; font-weight: 700; color: rgba(255,255,255,0.5); }

  .ze-scope .ze-invite { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; border: 0; border-radius: 14px; padding: 15px; background: rgba(255,255,255,0.1); color: #fff; font-size: 0.98rem; font-weight: 800; cursor: pointer; }
  .ze-scope .ze-invite i { font-size: 19px; }
</style>

<div class="mr-scope ze-scope">
  <div class="ze-wrap">

    <div class="pv-card">

      <div class="ze-head">
        <div class="ht">
          <div class="t1">No guests yet</div>
          <div class="t2"><i class="ph-fill ph-lock-simple"></i> Private &middot; hosted by Brandon</div>
        </div>
        <button type="button" class="sh" aria-label="Share"><i class="ph ph-share-network"></i></button>
      </div>

      <div class="ze-summary">
        <span class="empty">No replies yet. Invite people to get started.</span>
      </div>

      <button type="button" class="ze-invite"><i class="ph-fill ph-user-plus"></i> Invite others</button>

    </div>

  </div>
</div>
