<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .bv-scope { --pv-bg: #0a0f14; --pv-card: #161d27; --pv-card-2: #1a2230; --pv-green: #34c759; --pv-green-soft: rgba(52,199,89,0.16); --pv-amber: #f5b400; --pv-red: #ff5a5f; }
  .bv-scope, .bv-scope * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
  .bv-scope::-webkit-scrollbar, .bv-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .bv-scope .bv-wrap { background: var(--pv-bg); padding: 24px 20px; }

  /* Same card frame as the original */
  .bv-scope .pv-card { background: rgba(26,34,48,0.6); border-radius: 20px; padding: 20px 18px; width: 100%; }

  /* Header: title + privacy + share, no leading avatar (matches C) */
  .bv-scope .bv-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .bv-scope .bv-head .ht { flex: 1; min-width: 0; }
  .bv-scope .bv-head .ht .t1 { font-size: 1.5rem; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
  .bv-scope .bv-head .ht .t2 { font-size: 0.86rem; font-weight: 700; color: #8ab4ff; margin-top: 6px; display: inline-flex; align-items: center; gap: 7px; }
  .bv-scope .bv-head .ht .t2 i { font-size: 15px; }
  .bv-scope .bv-head .sh { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.08); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .bv-scope .bv-head .sh i { font-size: 19px; }

  /* Reworked RSVP tiles: quieter, your own choice highlighted, faces tappable */
  .bv-scope .pv-rsvp { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bv-scope .pv-rsvp .tile { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 14px 6px 12px; text-align: center; border: 1.5px solid transparent; }
  .bv-scope .pv-rsvp .tile.active-going { border-color: var(--pv-green); background: var(--pv-green-soft); }
  .bv-scope .pv-rsvp .tile .num { font-size: 1.5rem; font-weight: 800; line-height: 1; }
  .bv-scope .pv-rsvp .tile.going .num { color: var(--pv-green); }
  .bv-scope .pv-rsvp .tile.maybe .num { color: #fff; }
  .bv-scope .pv-rsvp .tile.no .num { color: rgba(255,255,255,0.4); }
  .bv-scope .pv-rsvp .tile .lbl { font-size: 0.82rem; color: rgba(255,255,255,0.75); margin-top: 4px; }
  .bv-scope .pv-rsvp .tile .youtag { display: inline-block; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.04em; color: var(--pv-green); background: rgba(52,199,89,0.18); padding: 2px 7px; border-radius: 6px; margin-top: 7px; }

  /* Tappable faces strip inside the card */
  .bv-scope .bv-faces { display: flex; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.07); }
  .bv-scope .bv-faces .fstack { display: flex; align-items: center; flex: 1; }
  .bv-scope .bv-faces .fa { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2.5px solid var(--pv-card); margin-left: -10px; cursor: pointer; }
  .bv-scope .bv-faces .fa:first-child { margin-left: 0; }
  .bv-scope .bv-faces .fa.initials { background: #5a687c; color: #fff; font-size: 0.78rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
  .bv-scope .bv-faces .fa.more { background: #2a3340; color: rgba(255,255,255,0.85); font-size: 0.78rem; }
  .bv-scope .bv-faces .ftap { font-size: 0.86rem; font-weight: 700; color: var(--pv-green); cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; }
  .bv-scope .bv-faces .ftap i { font-size: 15px; }
</style>

<div class="mr-scope bv-scope">
  <div class="bv-wrap">

    <div class="pv-card">

      <div class="bv-head">
        <div class="ht">
          <div class="t1">10 guests</div>
          <div class="t2"><i class="ph-fill ph-lock-simple"></i> Private &middot; hosted by Brandon</div>
        </div>
        <button type="button" class="sh" aria-label="Share"><i class="ph ph-share-network"></i></button>
      </div>

      <div class="pv-rsvp">
        <div class="tile going active-going">
          <div class="num">4</div>
          <div class="lbl">Going</div>
          <span class="youtag">YOU</span>
        </div>
        <div class="tile maybe">
          <div class="num">6</div>
          <div class="lbl">Maybe</div>
        </div>
        <div class="tile no">
          <div class="num">0</div>
          <div class="lbl">Can't go</div>
        </div>
      </div>

      <div class="bv-faces">
        <div class="fstack">
          <img class="fa" src="https://i.pravatar.cc/120?img=12" alt="" />
          <span class="fa initials">MG</span>
          <img class="fa" src="https://i.pravatar.cc/120?img=32" alt="" />
          <img class="fa" src="https://i.pravatar.cc/120?img=45" alt="" />
          <span class="fa more">+6</span>
        </div>
        <span class="ftap">See everyone <i class="ph ph-caret-right"></i></span>
      </div>

    </div>

  </div>
</div>
