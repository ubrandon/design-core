<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .vb-scope { --vb-bg: #06080e; --vb-line: rgba(255,255,255,0.08); }
  .vb-scope, .vb-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .vb-scope::-webkit-scrollbar, .vb-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .vb-wrap { background: var(--vb-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .vb-body { flex: 1; overflow-y: auto; padding-bottom: 96px; }

  .vb-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 6px; }
  .vb-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .vb-sub { color: rgba(255,255,255,0.5); font-size: 0.88rem; font-weight: 700; padding: 0 20px 14px; }
  .vb-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .vb-close i { font-size: 22px; }

  .vb-share { margin: 4px 20px 8px; padding: 11px 12px 11px 14px; border-radius: 16px; background: rgba(32,224,207,0.08); border: 1px solid rgba(32,224,207,0.22); display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; }
  .vb-share .sicon { width: 34px; height: 34px; border-radius: 50%; background: rgba(32,224,207,0.16); display: inline-flex; align-items: center; justify-content: center; color: var(--neon-teal); }
  .vb-share .sicon i { font-size: 17px; }
  .vb-share .stitle { color: #fff; font-size: 0.95rem; font-weight: 850; line-height: 1.1; }
  .vb-share .stxt { color: rgba(255,255,255,0.55); font-size: 0.8rem; font-weight: 700; margin-top: 2px; }
  .vb-share .scopy { background: rgba(255,255,255,0.1); color: #fff; border: 0; border-radius: 999px; padding: 9px 16px; font-size: 0.85rem; font-weight: 850; display: inline-flex; align-items: center; gap: 6px; }
  .vb-share .scopy i { font-size: 15px; }

  .vb-section { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
  .vb-section .slabel { color: rgba(255,255,255,0.62); font-size: 0.72rem; font-weight: 850; letter-spacing: 0.1em; text-transform: uppercase; }
  .vb-section .scount { color: rgba(255,255,255,0.4); font-size: 0.72rem; font-weight: 850; }

  .vb-row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 13px; padding: 9px 20px; }
  .vb-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; position: relative; }
  .vb-row .av.muted { background: #4a5462; color: #fff; }
  .vb-row .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .vb-row .av .dot { position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; background: #2dd073; border: 2px solid var(--vb-bg); display: inline-flex; align-items: center; justify-content: center; }
  .vb-row .av .dot i { color: #061016; font-size: 11px; }
  .vb-name { color: #fff; font-size: 1.02rem; font-weight: 850; line-height: 1.15; }
  .vb-status { color: rgba(255,255,255,0.55); font-size: 0.86rem; font-weight: 700; margin-top: 2px; }
  .vb-status .host { color: var(--neon-amber, #ffd25a); font-weight: 850; }
  .vb-status .going { color: rgba(255,255,255,0.55); font-weight: 700; }
  .vb-pill { font-size: 0.72rem; font-weight: 850; padding: 4px 9px; border-radius: 999px; }
  .vb-pill.host { background: rgba(255,210,90,0.16); color: var(--neon-amber, #ffd25a); }
  .vb-remind { background: rgba(255,255,255,0.07); border: 0; color: rgba(255,255,255,0.78); border-radius: 999px; padding: 7px 13px; font-size: 0.78rem; font-weight: 850; }
  .vb-edit { background: transparent; border: 0; color: rgba(255,255,255,0.55); padding: 0; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
  .vb-edit i { font-size: 18px; }

  .vb-fab { position: absolute; right: 20px; bottom: 22px; display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; background: linear-gradient(135deg, #24b8aa, #4c87cf); color: rgba(255,255,255,0.98); font-size: 0.98rem; font-weight: 850; text-shadow: 0 1px 1px rgba(0,0,0,0.22); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .vb-fab i { font-size: 18px; }
</style>

<div class="mr-scope vb-scope">
  <div class="vb-wrap">
    <div class="vb-body">
      <header class="vb-header">
        <div class="vb-title">Guests</div>
        <button type="button" class="vb-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>
      <div class="vb-sub">3 going · 2 invited</div>

      <div class="vb-share">
        <span class="sicon"><i class="ph ph-link-simple"></i></span>
        <div>
          <div class="stitle">Share link</div>
          <div class="stxt">Anyone with the link can join</div>
        </div>
        <button type="button" class="scopy">Share</button>
      </div>

      <div class="vb-section">
        <span class="slabel">Going</span>
        <span class="scount">3</span>
      </div>

      <div class="vb-row">
        <span class="av"><span>B</span><span class="dot"><i class="ph ph-check"></i></span></span>
        <div>
          <div class="vb-name">Brandon Unglaub</div>
          <div class="vb-status"><span class="going">Going</span> · <span class="host">Host</span></div>
        </div>
        <button type="button" class="vb-edit"><i class="ph ph-pencil-simple"></i></button>
      </div>

      <div class="vb-row">
        <span class="av"><img src="https://i.pravatar.cc/96?img=12" alt="" loading="lazy" /><span class="dot"><i class="ph ph-check"></i></span></span>
        <div>
          <div class="vb-name">Nova Finch</div>
          <div class="vb-status"><span class="going">Going</span></div>
        </div>
        <button type="button" class="vb-edit"><i class="ph ph-pencil-simple"></i></button>
      </div>

      <div class="vb-row">
        <span class="av"><img src="https://i.pravatar.cc/96?img=49" alt="" loading="lazy" /><span class="dot"><i class="ph ph-check"></i></span></span>
        <div>
          <div class="vb-name">Lila Quill</div>
          <div class="vb-status"><span class="going">Going</span></div>
        </div>
        <button type="button" class="vb-edit"><i class="ph ph-pencil-simple"></i></button>
      </div>

      <div class="vb-section">
        <span class="slabel">Invited</span>
        <span class="scount">2</span>
      </div>

      <div class="vb-row">
        <img class="av" src="https://i.pravatar.cc/96?img=33" alt="" loading="lazy" />
        <div>
          <div class="vb-name">Soren Vale</div>
          <div class="vb-status">Hasn't replied yet</div>
        </div>
        <button type="button" class="vb-remind">Remind</button>
      </div>

      <div class="vb-row">
        <span class="av muted">PS</span>
        <div>
          <div class="vb-name">Piper Sol</div>
          <div class="vb-status">Hasn't replied yet</div>
        </div>
        <button type="button" class="vb-remind">Remind</button>
      </div>
    </div>

    <button type="button" class="vb-fab"><i class="ph-fill ph-user-plus"></i>Invite guests</button>
  </div>
</div>
