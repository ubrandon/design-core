<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .v3-scope { --v3-bg: #06080e; --v3-line: rgba(255,255,255,0.08); --v3-warn: #f5c451; }
  .v3-scope, .v3-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v3-scope::-webkit-scrollbar, .v3-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v3-wrap { background: var(--v3-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v3-body { flex: 1; overflow-y: auto; padding-bottom: 8px; filter: blur(2px); opacity: 0.5; }

  .v3-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 8px; }
  .v3-title { color: #fff; font-size: 1.7rem; font-weight: 850; }
  .v3-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v3-close i { font-size: 22px; }
  .v3-stub { margin: 8px 20px 14px; height: 46px; border-radius: 999px; background: rgba(255,255,255,0.07); }
  .v3-stub.banner { height: 70px; border-radius: 18px; background: rgba(32,224,207,0.06); border: 1px solid rgba(32,224,207,0.18); }
  .v3-stub.list { height: 260px; border-radius: 18px; background: rgba(255,255,255,0.03); }

  .v3-scrim { position: absolute; inset: 0; background: rgba(2,4,8,0.72); display: flex; align-items: flex-end; padding: 0 14px 18px; backdrop-filter: blur(6px); }
  .v3-sheet { width: 100%; border-radius: 28px; background: #0f1622; border: 1px solid rgba(255,255,255,0.12); padding: 22px 20px 20px; box-shadow: 0 32px 90px rgba(0,0,0,0.6); }
  .v3-sheet-icon { width: 56px; height: 56px; border-radius: 18px; background: rgba(245,196,81,0.16); color: var(--v3-warn); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .v3-sheet-icon i { font-size: 28px; }
  .v3-sheet h2 { margin: 0 0 8px; color: #fff; font-size: 1.38rem; line-height: 1.18; font-weight: 850; }
  .v3-sheet p { margin: 0 0 16px; color: rgba(255,255,255,0.66); font-size: 0.94rem; line-height: 1.45; }

  .v3-who { display: flex; gap: 8px; padding: 4px 0 16px; flex-wrap: wrap; }
  .v3-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 5px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #fff; font-size: 0.84rem; font-weight: 850; }
  .v3-chip img, .v3-chip .initial { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--neon-teal); color: #061016; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.74rem; }
  .v3-chip.is-add { background: rgba(32,224,207,0.18); }

  .v3-sheet-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .v3-sheet-actions button { min-height: 50px; border-radius: 999px; border: 0; color: #fff; font-size: 0.96rem; font-weight: 850; }
  .v3-sheet-actions .ghost { background: rgba(255,255,255,0.08); }
  .v3-sheet-actions .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }


</style>

<div class="mr-scope v3-scope">
  <div class="v3-wrap">
    <div class="v3-body">
      <header class="v3-header">
        <div class="v3-title">Who's going?</div>
        <button type="button" class="v3-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>
      <div class="v3-stub banner"></div>
      <div class="v3-stub"></div>
      <div class="v3-stub list"></div>
    </div>

    <div class="v3-scrim">
      <div class="v3-sheet">
        <div class="v3-sheet-icon"><i class="ph ph-user-plus"></i></div>
        <h2>Quinn isn't in Lake House</h2>
        <p>Adding Quinn means this won't stay attached to the Lake House group.</p>

        <div class="v3-who">
          <span class="v3-chip"><span class="initial">M</span>Milo</span>
          <span class="v3-chip"><img src="https://i.pravatar.cc/64?img=12" alt="" loading="lazy" />Nova</span>
          <span class="v3-chip"><img src="https://i.pravatar.cc/64?img=49" alt="" loading="lazy" />Lila</span>
          <span class="v3-chip is-add"><img src="https://i.pravatar.cc/64?img=20" alt="" loading="lazy" />Quinn</span>
        </div>

        <div class="v3-sheet-actions">
          <button type="button" class="ghost">Keep Lake House</button>
          <button type="button" class="primary">Invite them anyway</button>
        </div>
      </div>
    </div>
  </div>
</div>
