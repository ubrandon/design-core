<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .v2-scope { --v2-bg: #06080e; --v2-line: rgba(255,255,255,0.08); }
  .v2-scope, .v2-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v2-scope::-webkit-scrollbar, .v2-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v2-wrap { background: var(--v2-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v2-body { flex: 1; overflow-y: auto; padding-bottom: 8px; filter: blur(2px); opacity: 0.55; }

  .v2-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 4px; }
  .v2-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v2-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v2-close i { font-size: 22px; }
  .v2-sub { color: rgba(255,255,255,0.5); font-size: 0.86rem; font-weight: 700; padding: 0 20px 12px; }
  .v2-stub { margin: 0 20px 14px; height: 64px; border-radius: 18px; background: rgba(255,255,255,0.045); border: 1px solid var(--v2-line); }
  .v2-stub.gcard { height: 84px; border-radius: 18px; }
  .v2-stub.search { height: 46px; border-radius: 999px; }
  .v2-stub.list { height: 200px; }

  .v2-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 0 28px; }

  .na-alert { width: 100%; max-width: 312px; border-radius: 28px; overflow: hidden; background: #2b2930; box-shadow: 0 12px 50px rgba(0,0,0,0.5); font-family: "Roboto", -apple-system, "Helvetica Neue", sans-serif; }
  .na-content { padding: 24px 24px 0; }
  .na-title { color: #e6e1e9; font-size: 1.32rem; font-weight: 500; line-height: 1.3; margin-bottom: 16px; }
  .na-msg { color: #cac4cf; font-size: 0.92rem; line-height: 1.45; }
  .na-msg b { color: #e6e1e9; font-weight: 600; }
  .na-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 22px 18px 18px; }
  .na-btn { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #d0bcff; font-size: 0.92rem; font-weight: 600; letter-spacing: 0.02em; font-family: inherit; text-transform: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
</style>

<div class="mr-scope v2-scope">
  <div class="v2-wrap">
    <div class="v2-body">
      <header class="v2-header">
        <div class="v2-title">Invite guests</div>
        <button type="button" class="v2-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>
      <div class="v2-sub">Lake House group · 8 of 8 invited</div>
      <div class="v2-stub gcard"></div>
      <div class="v2-stub search" style="margin: 0 20px 14px;"></div>
      <div class="v2-stub list"></div>
    </div>

    <div class="v2-scrim">
      <div class="na-alert" role="alertdialog" aria-modal="true" aria-labelledby="na-t" aria-describedby="na-m">
        <div class="na-content">
          <div class="na-title" id="na-t">Remove from Lake House?</div>
          <div class="na-msg" id="na-m">This plan will <b>no longer be in the Lake House group</b>. It becomes a friends plan so you can invite anyone. Everyone already invited stays on the plan.</div>
        </div>
        <div class="na-actions">
          <button type="button" class="na-btn">Cancel</button>
          <button type="button" class="na-btn">Remove</button>
        </div>
      </div>
    </div>
  </div>
</div>
