<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .v2-scope { --v2-bg: #06080e; --v2-line: rgba(255,255,255,0.08); --v2-warn: #f5c451; }
  .v2-scope, .v2-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v2-scope::-webkit-scrollbar, .v2-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v2-wrap { background: var(--v2-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v2-body { flex: 1; overflow-y: auto; padding-bottom: 8px; filter: blur(2px); opacity: 0.55; }

  .v2-header { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 10px; padding: 18px 18px 8px; }
  .v2-icon-btn { width: 32px; height: 32px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.86); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v2-icon-btn i { font-size: 22px; }
  .v2-eyebrow { text-align: center; color: rgba(255,255,255,0.6); font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .v2-headline { padding: 8px 20px 14px; }
  .v2-headline h1 { margin: 0 0 6px; color: #fff; font-size: 1.6rem; font-weight: 850; }
  .v2-stub { margin: 0 20px 14px; height: 64px; border-radius: 18px; background: rgba(255,255,255,0.045); border: 1px solid var(--v2-line); }
  .v2-stub.search { height: 46px; border-radius: 999px; }
  .v2-stub.list { height: 260px; }

  .v2-scrim { position: absolute; inset: 0; background: rgba(2,4,8,0.72); display: flex; align-items: flex-end; padding: 0 14px 18px; backdrop-filter: blur(6px); }
  .v2-sheet { width: 100%; border-radius: 28px; background: #0f1622; border: 1px solid rgba(255,255,255,0.12); padding: 22px 20px 20px; box-shadow: 0 32px 90px rgba(0,0,0,0.6); }
  .v2-sheet-icon { width: 56px; height: 56px; border-radius: 18px; background: rgba(245,196,81,0.16); color: var(--v2-warn); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .v2-sheet-icon i { font-size: 28px; }
  .v2-sheet h2 { margin: 0 0 8px; color: #fff; font-size: 1.38rem; line-height: 1.18; font-weight: 850; letter-spacing: -0.005em; }
  .v2-sheet p { margin: 0 0 16px; color: rgba(255,255,255,0.66); font-size: 0.94rem; line-height: 1.45; }

  .v2-change { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(255,255,255,0.05); margin-bottom: 14px; }
  .v2-change-cell { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .v2-change-thumb { width: 44px; height: 44px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.1); display: inline-flex; align-items: center; justify-content: center; color: #fff; }
  .v2-change-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .v2-change-thumb i { font-size: 22px; }
  .v2-change-thumb.is-new { background: rgba(32,224,207,0.18); color: var(--neon-teal); }
  .v2-change-label { color: rgba(255,255,255,0.55); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .v2-change-name { color: #fff; font-size: 0.92rem; font-weight: 850; line-height: 1.15; }
  .v2-arrow { color: rgba(255,255,255,0.45); font-size: 22px; }

  .v2-who { display: flex; gap: 8px; padding: 6px 0 16px; flex-wrap: wrap; }
  .v2-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 5px; border-radius: 999px; background: rgba(255,255,255,0.08); color: #fff; font-size: 0.84rem; font-weight: 850; }
  .v2-chip img, .v2-chip .initial { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: var(--neon-teal); color: #061016; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.74rem; }
  .v2-chip.is-add { background: rgba(32,224,207,0.18); color: var(--neon-teal); }
  .v2-chip.is-add .initial { background: rgba(255,255,255,0.95); color: #061016; }

  .v2-sheet-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .v2-sheet-actions button { min-height: 50px; border-radius: 999px; border: 0; color: #fff; font-size: 0.96rem; font-weight: 850; }
  .v2-sheet-actions .ghost { background: rgba(255,255,255,0.08); }
  .v2-sheet-actions .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }


</style>

<div class="mr-scope v2-scope">
  <div class="v2-wrap">
    <div class="v2-body">
      <header class="v2-header">
        <button type="button" class="v2-icon-btn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
        <div class="v2-eyebrow">Step 5 · Adding an outsider</div>
        <button type="button" class="v2-icon-btn" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>
      <div class="v2-headline"><h1>Pick who's coming</h1></div>
      <div class="v2-stub"></div>
      <div class="v2-stub search" style="margin: 0 20px 14px;"></div>
      <div class="v2-stub list"></div>
    </div>

    <div class="v2-scrim">
      <div class="v2-sheet">
        <div class="v2-sheet-icon"><i class="ph ph-user-plus"></i></div>
        <h2>Quinn isn't in Otters</h2>
        <p>To invite Quinn, this stops being an Otters plan and becomes a regular people plan.</p>

        <div class="v2-change">
          <div class="v2-change-cell">
            <div class="v2-change-thumb"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
            <div class="v2-change-label">From</div>
            <div class="v2-change-name">Otters plan</div>
          </div>
          <i class="ph ph-arrow-right v2-arrow"></i>
          <div class="v2-change-cell">
            <div class="v2-change-thumb is-new"><i class="ph ph-user"></i></div>
            <div class="v2-change-label">To</div>
            <div class="v2-change-name">People plan</div>
          </div>
        </div>

        <div class="v2-who">
          <span class="v2-chip"><span class="initial">M</span>Milo</span>
          <span class="v2-chip"><img src="https://i.pravatar.cc/64?img=12" alt="" loading="lazy" />Nova</span>
          <span class="v2-chip"><img src="https://i.pravatar.cc/64?img=49" alt="" loading="lazy" />Lila</span>
          <span class="v2-chip is-add"><span class="initial">+</span>Quinn</span>
        </div>

        <div class="v2-sheet-actions">
          <button type="button" class="ghost">Keep Otters</button>
          <button type="button" class="primary">Share with these 4</button>
        </div>
      </div>
    </div>
  </div>
</div>
