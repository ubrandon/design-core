<style>
  .v3-scope { --v3-bg: #06080e; --v3-line: rgba(255,255,255,0.08); }
  .v3-scope, .v3-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v3-scope::-webkit-scrollbar, .v3-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v3-wrap { background: var(--v3-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v3-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v3-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 8px; }
  .v3-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v3-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v3-close i { font-size: 22px; }

  .v3-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 8px 20px 16px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v3-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v3-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v3-label { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 20px 10px; color: rgba(255,255,255,0.72); font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v3-label .count { color: rgba(255,255,255,0.46); }

  .v3-grouplist { padding: 0 20px 12px; display: flex; flex-direction: column; }
  .v3-grouprow { display: grid; grid-template-columns: 48px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v3-grouprow .gthumb { width: 48px; height: 48px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; }
  .v3-grouprow .gthumb img { width: 100%; height: 100%; object-fit: cover; }
  .v3-grouprow .gthumb i { color: #fff; font-size: 22px; }
  .v3-grouprow .gname { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v3-grouprow .gmeta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v3-grouprow .chev { color: rgba(255,255,255,0.4); font-size: 18px; display: inline-flex; align-items: center; justify-content: center; }

  .v3-divider { height: 1px; background: var(--v3-line); margin: 8px 20px 12px; }

  .v3-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v3-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v3-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v3-row .av.muted { background: #4a5462; color: #fff; }
  .v3-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v3-handle { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }

  .v3-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
  .v3-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v3-cta .ghost { background: rgba(255,255,255,0.08); }
  .v3-cta .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }
  .v3-cta .primary[disabled] { opacity: 0.5; }


</style>

<div class="mr-scope v3-scope">
  <div class="v3-wrap">
    <div class="v3-body">
      <header class="v3-header">
        <div class="v3-title">Who's going?</div>

      <div class="v3-search">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" placeholder="Search people or groups" />
      </div>

      <div class="v3-grouplist">
        <div class="v3-grouprow">
          <div class="gthumb"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div><div class="gname">Lake House</div><div class="gmeta">8 members</div></div>
          <span class="chev"><i class="ph ph-caret-right"></i></span>
        </div>
        <div class="v3-grouprow">
          <div class="gthumb"><img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div><div class="gname">Family</div><div class="gmeta">4 members</div></div>
          <span class="chev"><i class="ph ph-caret-right"></i></span>
        </div>
        <div class="v3-grouprow">
          <div class="gthumb"><img src="https://images.unsplash.com/photo-1559827260-dc66d52bef19?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div><div class="gname">Climbing gym</div><div class="gmeta">3 members</div></div>
          <span class="chev"><i class="ph ph-caret-right"></i></span>
        </div>
      </div>

      <div class="v3-divider"></div>

      <div class="v3-label"><span>Friends</span></div>
      <div class="v3-list">
        <div class="v3-row">
          <img class="av" src="https://i.pravatar.cc/96?img=12" alt="" loading="lazy" />
          <div><div class="v3-name">Nova Finch</div><div class="v3-handle">@novafinch</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v3-row">
          <span class="av">M</span>
          <div><div class="v3-name">Milo Wren</div><div class="v3-handle">@milowren</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v3-row">
          <img class="av" src="https://i.pravatar.cc/96?img=49" alt="" loading="lazy" />
          <div><div class="v3-name">Lila Quill</div><div class="v3-handle">@lilaquill</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v3-row">
          <img class="av" src="https://i.pravatar.cc/96?img=33" alt="" loading="lazy" />
          <div><div class="v3-name">Soren Vale</div><div class="v3-handle">@sorenvale</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v3-row">
          <span class="av muted">PS</span>
          <div><div class="v3-name">Piper Sol</div><div class="v3-handle">@pipersol</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
      </div>
    </div>

    <div class="v3-cta">
      <button type="button" class="ghost">Cancel</button>
      <button type="button" class="primary" disabled>Add to plan</button>
    </div>
  </div>
</div>
