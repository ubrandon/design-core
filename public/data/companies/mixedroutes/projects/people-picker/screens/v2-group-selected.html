<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .v2-scope { --v2-bg: #06080e; --v2-line: rgba(255,255,255,0.08); --v2-warn: #f5c451; }
  .v2-scope, .v2-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v2-scope::-webkit-scrollbar, .v2-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v2-wrap { background: var(--v2-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v2-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v2-header { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 10px; padding: 18px 18px 8px; }
  .v2-icon-btn { width: 32px; height: 32px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,0.86); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v2-icon-btn i { font-size: 22px; }
  .v2-eyebrow { text-align: center; color: rgba(255,255,255,0.6); font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }

  .v2-headline { padding: 8px 20px 14px; }
  .v2-headline h1 { margin: 0 0 6px; color: #fff; font-size: 1.6rem; line-height: 1.1; font-weight: 850; }
  .v2-headline p { margin: 0; color: rgba(255,255,255,0.58); font-size: 0.9rem; line-height: 1.42; }

  .v2-state-card { margin: 4px 20px 16px; padding: 14px; border-radius: 18px; background: rgba(32,224,207,0.07); border: 1px solid rgba(32,224,207,0.32); display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px; }
  .v2-state-card img { width: 48px; height: 48px; border-radius: 14px; object-fit: cover; }
  .v2-state-label { color: var(--neon-teal); font-size: 0.72rem; font-weight: 850; letter-spacing: 0.06em; text-transform: uppercase; }
  .v2-state-value { color: #fff; font-size: 1.02rem; font-weight: 850; margin-top: 2px; }
  .v2-state-action { color: #fff; font-size: 0.84rem; font-weight: 850; background: rgba(255,255,255,0.1); border: 0; padding: 8px 12px; border-radius: 999px; }

  .v2-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 0 20px 14px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v2-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v2-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v2-scope-tabs { margin: 0 20px 16px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.06); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .v2-scope-tab { min-height: 56px; border-radius: 11px; border: 0; background: transparent; color: rgba(255,255,255,0.62); padding: 8px 10px; text-align: center; }
  .v2-scope-tab .ttl { display: block; font-size: 0.92rem; font-weight: 850; }
  .v2-scope-tab .sub { display: block; font-size: 0.74rem; font-weight: 700; margin-top: 2px; opacity: 0.82; }
  .v2-scope-tab.is-active { background: #fff; color: #061016; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }
  .v2-scope-tab.is-active .sub { color: rgba(6,16,22,0.66); }

  .v2-summary { margin: 0 20px 14px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .v2-summary .left { color: #fff; font-size: 0.92rem; font-weight: 850; }
  .v2-summary .left .muted { color: rgba(255,255,255,0.55); font-weight: 700; }
  .v2-summary .actions { display: flex; gap: 8px; }
  .v2-summary .actions button { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.84rem; font-weight: 850; padding: 4px 6px; }

  .v2-label { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 20px 8px; color: rgba(255,255,255,0.72); font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v2-label .count { color: rgba(255,255,255,0.46); }

  .v2-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v2-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v2-row.is-on { background: rgba(32,224,207,0.09); }
  .v2-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v2-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v2-meta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v2-meta .host { color: var(--v2-warn); font-weight: 800; }
  .v2-check { width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.26); display: inline-flex; align-items: center; justify-content: center; }
  .v2-check.is-on { border-color: var(--neon-teal); background: var(--neon-teal); color: #061016; }
  .v2-check i { font-size: 14px; }

  .v2-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
  .v2-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v2-cta .ghost { background: rgba(255,255,255,0.08); }
  .v2-cta .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }


</style>

<div class="mr-scope v2-scope">
  <div class="v2-wrap">
    <div class="v2-body">
      <header class="v2-header">
        <button type="button" class="v2-icon-btn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
        <div class="v2-eyebrow">Step 4 · Choose members</div>
        <button type="button" class="v2-icon-btn" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>

      <div class="v2-headline">
        <h1>Pick who's coming</h1>
        <p>Still an Otters plan — just a smaller invite list this time.</p>
      </div>

      <div class="v2-state-card">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" />
        <div>
          <div class="v2-state-label">Group plan</div>
          <div class="v2-state-value">Otters</div>
        </div>
        <button type="button" class="v2-state-action">Change</button>
      </div>

      <div class="v2-search">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" placeholder="Search Otters members" />
      </div>

      <div class="v2-scope-tabs">
        <button type="button" class="v2-scope-tab">
          <span class="ttl">Everyone</span>
          <span class="sub">Current and future</span>
        </button>
        <button type="button" class="v2-scope-tab is-active">
          <span class="ttl">Choose members</span>
          <span class="sub">Pick specific people</span>
        </button>
      </div>

      <div class="v2-summary">
        <div class="left">3 of 8 selected <span class="muted">· from Otters</span></div>
        <div class="actions">
          <button type="button">Select all</button>
          <button type="button">Clear</button>
        </div>
      </div>

      <div class="v2-label"><span>Otters members</span><span class="count">8 total</span></div>
      <div class="v2-list">
        <div class="v2-row is-on">
          <span class="av">M</span>
          <div><div class="v2-name">Milo Wren</div><div class="v2-meta"><span class="host">Host</span></div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v2-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=12" alt="" loading="lazy" />
          <div><div class="v2-name">Nova Finch</div><div class="v2-meta">Member</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v2-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=49" alt="" loading="lazy" />
          <div><div class="v2-name">Lila Quill</div><div class="v2-meta">Member</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v2-row">
          <img class="av" src="https://i.pravatar.cc/96?img=33" alt="" loading="lazy" />
          <div><div class="v2-name">Soren Vale</div><div class="v2-meta">Member</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v2-row">
          <img class="av" src="https://i.pravatar.cc/96?img=44" alt="" loading="lazy" />
          <div><div class="v2-name">Wren Holt</div><div class="v2-meta">Member</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
      </div>
    </div>

    <div class="v2-cta">
      <button type="button" class="ghost">Cancel</button>
      <button type="button" class="primary">Invite 3</button>
    </div>
  </div>
</div>
