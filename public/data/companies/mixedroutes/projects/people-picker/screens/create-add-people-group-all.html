<link rel="stylesheet" href="../../../../../../styles/ds.css" />

<style>
  .v5-scope { --v5-bg: #06080e; --v5-line: rgba(255,255,255,0.08); --v5-warn: #f5c451; }
  .v5-scope, .v5-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v5-scope::-webkit-scrollbar, .v5-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v5-wrap { background: var(--v5-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v5-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v5-header { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; padding: 22px 20px 14px; }
  .v5-back { background: transparent; border: 0; color: #fff; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v5-back i { font-size: 22px; }
  .v5-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }

  .v5-group-banner { margin: 0 20px 16px; padding: 14px 16px; border-radius: 20px; background: rgba(32,224,207,0.08); border: 1px solid rgba(32,224,207,0.32); display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 14px; }
  .v5-group-banner img, .v5-banner-thumb { width: 56px; height: 56px; border-radius: 16px; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; }
  .v5-banner-label { color: var(--neon-teal); font-size: 0.7rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v5-banner-name { color: #fff; font-size: 1.18rem; font-weight: 850; margin-top: 3px; line-height: 1.15; }
  .v5-banner-meta { color: rgba(255,255,255,0.6); font-size: 0.84rem; font-weight: 700; margin-top: 3px; }

  .v5-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 0 20px 14px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v5-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v5-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v5-summary { margin: 0 20px 14px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .v5-summary .left { color: #fff; font-size: 0.92rem; font-weight: 850; }
  .v5-summary .left .muted { color: rgba(255,255,255,0.55); font-weight: 700; }
  .v5-summary .actions { display: flex; gap: 8px; }
  .v5-summary .actions button { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.84rem; font-weight: 850; padding: 4px 6px; }

  .v5-label { display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 10px; color: rgba(255,255,255,0.72); font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v5-label .action { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.78rem; font-weight: 850; letter-spacing: 0.04em; text-transform: none; padding: 4px 0; cursor: pointer; }

  .v5-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v5-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v5-row.is-on { background: rgba(32,224,207,0.09); }
  .v5-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v5-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v5-meta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v5-meta .host { color: var(--v5-warn); font-weight: 800; }

  .v5-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .v5-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v5-cta .ghost { background: rgba(255,255,255,0.08); }
  .v5-cta .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }


</style>

        </div>
        <div class="v5-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=15" alt="" loading="lazy" />

        </div>

    </div>

    <div class="v5-cta">
      <button type="button" class="primary">Invite all members</button>
    </div>
  </div>
</div>
