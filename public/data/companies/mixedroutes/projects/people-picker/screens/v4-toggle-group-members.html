<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .v4-scope { --v4-bg: #06080e; --v4-line: rgba(255,255,255,0.08); --v4-warn: #f5c451; }
  .v4-scope, .v4-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v4-scope::-webkit-scrollbar, .v4-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v4-wrap { background: var(--v4-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v4-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v4-header { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 10px; padding: 22px 20px 12px; }
  .v4-back { background: transparent; border: 0; color: #fff; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v4-back i { font-size: 22px; }
  .v4-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v4-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v4-close i { font-size: 22px; }

  .v4-group-banner { margin: 0 20px 14px; padding: 12px 14px; border-radius: 18px; background: rgba(32,224,207,0.08); border: 1px solid rgba(32,224,207,0.32); display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 12px; }
  .v4-group-banner img { width: 44px; height: 44px; border-radius: 14px; object-fit: cover; }
  .v4-banner-label { color: var(--neon-teal); font-size: 0.7rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v4-banner-name { color: #fff; font-size: 1rem; font-weight: 850; margin-top: 2px; line-height: 1.15; }

  .v4-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 0 20px 14px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v4-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v4-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v4-summary { margin: 0 20px 14px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .v4-summary .left { color: #fff; font-size: 0.92rem; font-weight: 850; }
  .v4-summary .left .muted { color: rgba(255,255,255,0.55); font-weight: 700; }
  .v4-summary .actions { display: flex; gap: 8px; }
  .v4-summary .actions button { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.84rem; font-weight: 850; padding: 4px 6px; }

  .v4-label { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 12px; color: #fff; font-size: 1.6rem; font-weight: 850; letter-spacing: -0.01em; text-transform: none; }
  .v4-label .action { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.86rem; font-weight: 850; letter-spacing: 0; text-transform: none; padding: 4px 0; cursor: pointer; }

  .v4-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v4-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v4-row.is-on { background: rgba(32,224,207,0.09); }
  .v4-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v4-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v4-meta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v4-meta .host { color: var(--v4-warn); font-weight: 800; }

  .v4-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
  .v4-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v4-cta .ghost { background: rgba(255,255,255,0.08); }
  .v4-cta .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }


</style>

<div class="mr-scope v4-scope">
  <div class="v4-wrap">
    <div class="v4-body">
      <header class="v4-header">
        <button type="button" class="v4-back" aria-label="Back"><i class="ph ph-arrow-left"></i></button>

      <div class="v4-group-banner">

          <div class="v4-banner-name">Lake House</div>
        </div>
      </div>

      <div class="v4-label"><span>Lake House members</span><button type="button" class="action">Select all</button></div>
      <div class="v4-list">
        <div class="v4-row is-on">
          <span class="av">M</span>

        </div>
        <div class="v4-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=12" alt="" loading="lazy" />

        </div>
        <div class="v4-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=49" alt="" loading="lazy" />
          <div><div class="v4-name">Lila Quill</div><div class="v4-meta">@lilaquill</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v4-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=33" alt="" loading="lazy" />
          <div><div class="v4-name">Soren Vale</div><div class="v4-meta">@sorenvale</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v4-row">
          <img class="av" src="https://i.pravatar.cc/96?img=44" alt="" loading="lazy" />
          <div><div class="v4-name">Wren Holt</div><div class="v4-meta">@wrenholt</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
        <div class="v4-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=22" alt="" loading="lazy" />
          <div><div class="v4-name">Iris Mae</div><div class="v4-meta">@irismae</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v4-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=15" alt="" loading="lazy" />
          <div><div class="v4-name">Theo Mar</div><div class="v4-meta">@theomar</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v4-row">
          <img class="av" src="https://i.pravatar.cc/96?img=18" alt="" loading="lazy" />
          <div><div class="v4-name">Juno Pax</div><div class="v4-meta">@junopax</div></div>
          <span class="mr-checkbox"><i class="ph ph-square"></i></span>
        </div>
      </div>
    </div>

    <div class="v4-cta">
      <button type="button" class="ghost">Cancel</button>
      <button type="button" class="primary">Invite 6 members</button>
    </div>
  </div>
</div>
