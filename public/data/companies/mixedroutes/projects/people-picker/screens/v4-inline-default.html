<style>
  .v4i-scope { --v4i-bg: #06080e; --v4i-line: rgba(255,255,255,0.08); }
  .v4i-scope, .v4i-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v4i-scope::-webkit-scrollbar, .v4i-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v4i-wrap { background: var(--v4i-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v4i-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v4i-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 12px; }
  .v4i-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v4i-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v4i-close i { font-size: 22px; }

  .v4i-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 0 20px 16px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v4i-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v4i-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v4i-label { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 20px 10px; color: #fff; font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }

  .v4i-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v4i-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v4i-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v4i-row .av.muted { background: #4a5462; color: #fff; }
  .v4i-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v4i-meta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }

  .v4i-row.is-group .gthumb { width: 44px; height: 44px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; }
  .v4i-row.is-group .gthumb img { width: 100%; height: 100%; object-fit: cover; }
  .v4i-row .chev { color: rgba(255,255,255,0.4); font-size: 18px; display: inline-flex; align-items: center; justify-content: center; }

  .v4i-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 12px; }
  .v4i-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v4i-cta .ghost { background: rgba(255,255,255,0.08); }
  .v4i-cta .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); opacity: 0.5; }


</style>
