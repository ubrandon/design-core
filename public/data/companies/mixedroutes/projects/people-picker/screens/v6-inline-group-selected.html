<link rel="stylesheet" href="../../../../../../styles/ds.css" />

<style>
  .v6-scope { --v6-bg: #06080e; --v6-line: rgba(255,255,255,0.08); --v6-warn: #f5c451; }
  .v6-scope, .v6-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v6-scope::-webkit-scrollbar, .v6-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v6-wrap { background: var(--v6-bg); min-height: 844px; position: relative; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v6-body { flex: 1; padding-bottom: 8px; }

  .v6-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 8px; }
  .v6-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v6-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v6-close i { font-size: 22px; }

  .v6-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 8px 20px 16px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v6-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v6-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v6-label { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 20px 12px; color: #fff; font-size: 1.25rem; font-weight: 850; letter-spacing: -0.005em; }
  .v6-label .count { color: rgba(255,255,255,0.5); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }

  .v6-groups { display: flex; gap: 14px; padding: 8px 20px 14px; }
  .v6-group { flex: 0 0 96px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: transparent; border: 0; position: relative; }
  .v6-thumb { width: 64px; height: 64px; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .v6-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .v6-gname { color: #fff; font-size: 0.92rem; line-height: 1.15; font-weight: 850; }
  .v6-group.is-on .v6-thumb { box-shadow: 0 0 0 2px var(--neon-teal); }
  .v6-group.is-on::after { content: ""; position: absolute; left: calc(50% + 14px); top: 46px; width: 22px; height: 22px; border-radius: 50%; background: var(--neon-teal); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23061016' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>"); background-size: 13px 13px; background-repeat: no-repeat; background-position: center; box-shadow: 0 0 0 2px var(--v6-bg); }
  .v6-group.is-on .v6-gname { color: var(--neon-teal); }

  .v6-hint { margin: 0 20px 14px; padding: 10px 14px; border-radius: 12px; background: rgba(32,224,207,0.06); border: 1px solid rgba(32,224,207,0.22); display: grid; grid-template-columns: 18px 1fr; align-items: center; gap: 10px; }
  .v6-hint i { color: var(--neon-teal); font-size: 15px; }
  .v6-hint .txt { color: rgba(255,255,255,0.82); font-size: 0.82rem; font-weight: 700; line-height: 1.3; }
  .v6-hint b { color: #fff; font-weight: 850; }

  .v6-endhint { margin: 14px 20px 8px; padding: 14px 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .v6-endhint .txt { color: rgba(255,255,255,0.7); font-size: 0.92rem; font-weight: 800; line-height: 1.3; }
  .v6-endhint .txt b { color: #fff; font-weight: 850; }
  .v6-endhint .linkrow { display: inline-flex; align-items: center; gap: 6px; color: var(--neon-teal); font-size: 0.9rem; font-weight: 850; background: transparent; border: 0; padding: 4px 2px; cursor: pointer; }

  .v6-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v6-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v6-row.is-on { background: rgba(32,224,207,0.09); }
  .v6-row.is-locked { opacity: 0.55; }
  .v6-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v6-row .av.muted { background: #4a5462; color: #fff; }
  .v6-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v6-handle { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v6-meta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v6-meta .host { color: var(--v6-warn); font-weight: 800; }
  .v6-row.is-locked .v6-meta { color: rgba(245,196,81,0.85); font-weight: 700; }
  .v6-lock { color: rgba(255,255,255,0.45); font-size: 18px; display: inline-flex; align-items: center; justify-content: center; }

  .v6-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .v6-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v6-cta .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }


</style>

<div class="mr-scope v6-scope">
  <div class="v6-wrap">
    <div class="v6-body">
      <header class="v6-header">
        <div class="v6-title">Who's going?</div>
        <button type="button" class="v6-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>

      <div class="v6-search">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" placeholder="Search people" />
      </div>

      <div class="v6-label"><span>Add to a group</span><span class="count">5 of 5 going</span></div>

      <div class="v6-groups">
        <div class="v6-group is-on">
          <div class="v6-thumb"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div class="v6-gname">Lake House</div>
        </div>
        <div class="v6-group">
          <div class="v6-thumb"><img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div class="v6-gname">Family</div>
        </div>
        <div class="v6-group">
          <div class="v6-thumb"><img src="https://images.unsplash.com/photo-1559827260-dc66d52bef19?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div class="v6-gname">Climbing gym</div>
        </div>
      </div>

      <div class="v6-label"><span>Lake House members</span></div>
      <div class="v6-list">
        <div class="v6-row is-on">
          <span class="av">M</span>
          <div><div class="v6-name">Milo Wren</div><div class="v6-meta"><span class="host">Host</span></div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v6-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=12" alt="" loading="lazy" />
          <div><div class="v6-name">Nova Finch</div><div class="v6-meta">@novafinch</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v6-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=49" alt="" loading="lazy" />
          <div><div class="v6-name">Lila Quill</div><div class="v6-meta">@lilaquill</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v6-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=44" alt="" loading="lazy" />
          <div><div class="v6-name">Wren Holt</div><div class="v6-meta">@wrenholt</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
        <div class="v6-row is-on">
          <img class="av" src="https://i.pravatar.cc/96?img=15" alt="" loading="lazy" />
          <div><div class="v6-name">Theo Mar</div><div class="v6-meta">@theomar</div></div>
          <span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>
        </div>
      </div>

      <div class="v6-endhint">
        <div class="txt">That's everyone in <b>Lake House</b>.</div>
        <button type="button" class="linkrow" data-clear-group>Clear group, keep people</button>
      </div>
    </div>

    <div class="v6-cta">
      <button type="button" class="primary" data-cta>Invite Lake House (5)</button>
    </div>
  </div>
</div>

<script>
  (function () {
    const scope = document.currentScript.previousElementSibling;
    const root = scope.querySelector('.v6-scope');
    if (!root) return;
    const clearBtn = root.querySelector('[data-clear-group]');
    const groupChip = root.querySelector('.v6-group.is-on');
    const sectionLabel = root.querySelectorAll('.v6-label')[1]?.querySelector('span');
    const endhint = root.querySelector('.v6-endhint');
    const cta = root.querySelector('[data-cta]');
    if (!clearBtn || !groupChip) return;
    clearBtn.addEventListener('click', () => {
      groupChip.classList.remove('is-on');
      if (sectionLabel) sectionLabel.textContent = 'Selected';
      if (cta) cta.textContent = 'Invite 5 people';
      if (endhint) endhint.style.display = 'none';
    });
  })();
</script>
