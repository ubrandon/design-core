<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  .v5-scope { --v5-bg: #06080e; --v5-line: rgba(255,255,255,0.08); }
  .v5-scope, .v5-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v5-scope::-webkit-scrollbar, .v5-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v5-wrap { background: var(--v5-bg); height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v5-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v5-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 8px; }
  .v5-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v5-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .v5-close i { font-size: 22px; }

  .v5-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 8px 20px 16px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v5-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v5-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v5-label { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 20px 12px; color: #fff; font-size: 1.25rem; font-weight: 850; letter-spacing: -0.005em; }
  .v5-label .count { color: rgba(255,255,255,0.5); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }

  .v5-groups-hint { margin: 0 20px 14px; padding: 8px 8px 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--v5-line); display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px; }
  .v5-groups-hint i.lead { color: rgba(255,255,255,0.55); font-size: 15px; line-height: 1; }
  .v5-groups-hint .txt { color: rgba(255,255,255,0.78); font-size: 0.82rem; font-weight: 800; line-height: 1.2; }
  .v5-groups-hint .txt b { color: #fff; font-weight: 900; }
  .v5-groups-hint .switch-pill { background: var(--neon-teal); border: 0; color: #061016; font-size: 0.8rem; font-weight: 900; padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .v5-groups-hint .switch-pill i { color: #061016; font-size: 12px; }

  .v5-groups { display: flex; gap: 14px; padding: 0 20px 18px; overflow-x: auto; }
  .v5-group { flex: 0 0 96px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: transparent; border: 0; position: relative; }
  .v5-thumb { width: 64px; height: 64px; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .v5-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .v5-thumb i { color: #fff; font-size: 28px; }
  .v5-group.is-on .v5-thumb { box-shadow: 0 0 0 2px var(--neon-teal); }
  .v5-group.is-on::after { content: ""; position: absolute; left: calc(50% + 14px); top: 46px; width: 22px; height: 22px; border-radius: 50%; background: var(--neon-teal); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23061016' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>"); background-size: 13px 13px; background-repeat: no-repeat; background-position: center; box-shadow: 0 0 0 2px var(--v5-bg); }
  .v5-gname { color: #fff; font-size: 0.92rem; line-height: 1.15; font-weight: 850; }
  .v5-group.is-on .v5-gname { color: var(--neon-teal); }

  .v5-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v5-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; }
  .v5-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v5-row .av.muted { background: #4a5462; color: #fff; }
  .v5-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v5-handle { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v5-empty { padding: 14px 20px 16px; color: rgba(255,255,255,0.6); font-size: 0.86rem; line-height: 1.4; }
  .v5-empty b { color: #fff; font-weight: 850; }

  .v5-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .v5-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; }
  .v5-cta .ghost { background: rgba(255,255,255,0.08); }
  .v5-cta .primary { background: linear-gradient(135deg, #24b8aa, #4c87cf); }


</style>

<div class="mr-scope v5-scope">
  <div class="v5-wrap">
    <div class="v5-body">
      <header class="v5-header">
        <div class="v5-title">Who's going?</div>
        <button type="button" class="v5-close" aria-label="Close"><i class="ph ph-x"></i></button>
      </header>

      <div class="v5-search">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" placeholder="Search people" />
      </div>

      <div class="v5-label"><span>Add to a group</span><span class="count">5 of 8 going</span></div>
      <div class="v5-groups">
        <div class="v5-group is-on">
          <div class="v5-thumb"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div class="v5-gname">Lake House</div>
        </div>
        <div class="v5-group">
          <div class="v5-thumb"><img src="https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div class="v5-gname">Family</div>
        </div>
        <div class="v5-group">
          <div class="v5-thumb"><img src="https://images.unsplash.com/photo-1559827260-dc66d52bef19?auto=format&fit=crop&w=200&h=200&q=80" alt="" loading="lazy" /></div>
          <div class="v5-gname">Climbing gym</div>
        </div>
      </div>

      <div class="v5-label"><span>Or invite people</span></div>
      <div class="v5-groups-hint">
        <i class="ph ph-user lead"></i>
        <div class="txt">Inviting <b>friends</b> instead?</div>
        <button type="button" class="switch-pill">Switch<i class="ph-bold ph-arrow-right"></i></button>
      </div>
      <div class="v5-list">
        <div class="v5-row">
          <img class="av" src="https://i.pravatar.cc/96?img=12" alt="" loading="lazy" style="opacity:0.4" />
          <div style="opacity:0.4"><div class="v5-name">Nova Finch</div><div class="v5-handle">@novafinch</div></div>
          <span class="mr-checkbox" style="opacity:0.3"><i class="ph ph-square"></i></span>
        </div>
        <div class="v5-row">
          <span class="av" style="opacity:0.4">PS</span>
          <div style="opacity:0.4"><div class="v5-name">Piper Sol</div><div class="v5-handle">@pipersol</div></div>
          <span class="mr-checkbox" style="opacity:0.3"><i class="ph ph-square"></i></span>
        </div>
      </div>
    </div>

    <div class="v5-cta">
      <button type="button" class="primary">Invite 5 members</button>
    </div>
  </div>
</div>
