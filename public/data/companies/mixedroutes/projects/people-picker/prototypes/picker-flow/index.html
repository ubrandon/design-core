<link rel="stylesheet" href="../../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../design-system/company.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06080e; overflow-x: clip; }
  body { font-family: var(--font-body); }

  .v5-scope { --v5-bg: #06080e; --v5-line: rgba(255,255,255,0.08); --v5-warn: #f5c451; }
  .v5-scope, .v5-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v5-scope::-webkit-scrollbar, .v5-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v5-wrap { background: var(--v5-bg); height: 100vh; height: 100dvh; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v5-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v5-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 8px; }
  .v5-header.with-back { grid-template-columns: 28px 1fr; gap: 10px; padding: 22px 20px 14px; }
  .v5-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v5-close, .v5-back { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .v5-close i, .v5-back i { font-size: 22px; }

  .v5-group-banner { margin: 0 20px 16px; padding: 14px 16px; border-radius: 20px; background: rgba(32,224,207,0.08); border: 1px solid rgba(32,224,207,0.32); display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 14px; }
  .v5-group-banner img { width: 56px; height: 56px; border-radius: 16px; object-fit: cover; }
  .v5-banner-label { color: var(--neon-teal); font-size: 0.7rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v5-banner-name { color: #fff; font-size: 1.18rem; font-weight: 850; margin-top: 3px; line-height: 1.15; }
  .v5-banner-meta { color: rgba(255,255,255,0.6); font-size: 0.84rem; font-weight: 700; margin-top: 3px; }

  .v5-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 8px 20px 16px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v5-search.tight { margin: 0 20px 14px; }
  .v5-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v5-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v5-label { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 20px 12px; color: #fff; font-size: 1.25rem; font-weight: 850; letter-spacing: -0.005em; }
  .v5-label.tight-top { padding-top: 0; }
  .v5-label.sm { align-items: center; padding: 6px 20px 10px; color: rgba(255,255,255,0.72); font-size: 0.74rem; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
  .v5-label .count { color: rgba(255,255,255,0.5); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .v5-label.sm .count { color: rgba(255,255,255,0.46); font-size: inherit; letter-spacing: inherit; }
  .v5-label .action { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.78rem; font-weight: 850; letter-spacing: 0.04em; text-transform: none; padding: 4px 0; cursor: pointer; }

  .v5-groups { display: flex; gap: 8px; padding: 0 20px 18px; overflow-x: auto; }
  .v5-group { flex: 0 0 96px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: transparent; border: 0; position: relative; cursor: pointer; }
  .v5-thumb { width: 64px; height: 64px; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .v5-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .v5-group.is-on .v5-thumb { box-shadow: 0 0 0 2px var(--neon-teal); }
  .v5-group.is-on .v5-thumb::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--neon-teal); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23061016' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>"); background-size: 12px 12px; background-repeat: no-repeat; background-position: center; box-shadow: 0 0 0 2px var(--v5-bg); }
  .v5-gname { color: #fff; font-size: 0.92rem; line-height: 1.15; font-weight: 850; }
  .v5-gmeta { color: rgba(255,255,255,0.5); font-size: 0.74rem; font-weight: 700; line-height: 1.2; margin-top: -4px; }
  .v5-group.is-on .v5-gname { color: var(--neon-teal); }

  .v5-chips { display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; flex-wrap: nowrap; }
  .v5-chips:empty { display: none; }
  .v5-chips .mr-pp-chip { flex: 0 0 auto; }

  .v5-groups-hint { margin: 0 20px 16px; padding: 18px 22px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid var(--v5-line); display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .v5-groups-hint > i { color: var(--neon-teal); font-size: 22px; line-height: 1; }
  .v5-groups-hint .col { flex: 1; display: flex; flex-direction: column; }
  .v5-groups-hint .txt { color: #fff; font-size: 1rem; font-weight: 850; line-height: 1.2; }
  .v5-groups-hint .txt b { color: var(--neon-teal); font-weight: 850; }
  .v5-groups-hint .swap { color: var(--neon-teal); font-size: 22px; line-height: 1; }
  .v5-groups-hint .sub { color: rgba(255,255,255,0.55); font-size: 0.78rem; font-weight: 700; line-height: 1.3; margin-top: 3px; }
  .v5-groups-hint .show { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.84rem; font-weight: 850; padding: 4px 4px; cursor: pointer; }

  .v5-list { padding: 0; display: flex; flex-direction: column; }
  .v5-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 20px; border-radius: 0; width: 100%; cursor: pointer; }
  .v5-row.is-on { background: rgba(32,224,207,0.09); }
  .v5-row.is-locked { cursor: default; }
  .v5-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v5-row .av.muted { background: #4a5462; color: #fff; }
  .v5-row .av.dim, .v5-row.is-dim .av, .v5-row.is-locked .av { opacity: 0.45; }
  .v5-row.is-locked > div:not(.mr-checkbox) { opacity: 0.4; }
  .v5-row.is-locked .mr-checkbox { opacity: 0.3; }
  .v5-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v5-handle, .v5-meta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v5-meta .host { color: var(--v5-warn); font-weight: 800; }
  .v5-row.is-dim .v5-name { color: rgba(255,255,255,0.55); }
  .v5-row.is-dim .v5-meta { color: rgba(255,255,255,0.35); }

  .v5-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .v5-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; cursor: pointer; }
  .v5-cta .primary { background: linear-gradient(135deg, var(--neon-teal), var(--neon-blue)); }
  .v5-cta .primary[disabled] { opacity: 0.5; cursor: not-allowed; }

  .v5-toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: rgba(255,255,255,0.96); color: #061016; font-weight: 850; font-size: 0.9rem; padding: 12px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 100; }
  .v5-toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .v5-undo { margin: 4px 20px 0; padding: 16px 20px; border-radius: 16px; background: rgba(255,255,255,0.08); border: 1px solid var(--v5-line); display: flex; align-items: center; gap: 12px; }
  .v5-undo .msg { flex: 1; display: flex; align-items: center; gap: 12px; color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.2; }
  .v5-undo .msg > i { color: var(--neon-teal); font-size: 20px; line-height: 1; }
  .v5-undo .undo { background: transparent; border: 0; color: var(--neon-teal); font-size: 0.98rem; font-weight: 850; padding: 4px 4px; cursor: pointer; }
</style>

<div class="mr-scope v5-scope">
  <div class="v5-wrap" id="screen"></div>
  <div class="v5-toast" id="toast"></div>
</div>

<script>
(function () {
  // ----- DATA -----
  var FRIENDS = [
    { id: 'nova',  name: 'Nova Finch', handle: '@novafinch', avatar: 'https://i.pravatar.cc/96?img=12' },
    { id: 'milo',  name: 'Milo Wren',  handle: '@milowren',  initials: 'M' },
    { id: 'lila',  name: 'Lila Quill', handle: '@lilaquill', avatar: 'https://i.pravatar.cc/96?img=49' },
    { id: 'soren', name: 'Soren Vale', handle: '@sorenvale', avatar: 'https://i.pravatar.cc/96?img=33' },
    { id: 'piper', name: 'Piper Sol',  handle: '@pipersol',  initials: 'PS', muted: true },
    { id: 'wren',  name: 'Wren Holt',  handle: '@wrenholt',  avatar: 'https://i.pravatar.cc/96?img=44' },
    { id: 'iris',  name: 'Iris Mae',   handle: '@irismae',   avatar: 'https://i.pravatar.cc/96?img=22' }
  ];

  var GROUPS = [
    {
      id: 'lake', name: 'Lake House',
      thumb: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80',
      members: [
        { id: 'milo',   name: 'Milo Wren',  handle: '@milowren',  initials: 'M', host: true },
        { id: 'nova',   name: 'Nova Finch', handle: '@novafinch', avatar: 'https://i.pravatar.cc/96?img=12' },
        { id: 'lila',   name: 'Lila Quill', handle: '@lilaquill', avatar: 'https://i.pravatar.cc/96?img=49' },
        { id: 'soren',  name: 'Soren Vale', handle: '@sorenvale', avatar: 'https://i.pravatar.cc/96?img=33' },
        { id: 'wren',   name: 'Wren Holt',  handle: '@wrenholt',  avatar: 'https://i.pravatar.cc/96?img=44' },
        { id: 'iris',   name: 'Iris Mae',   handle: '@irismae',   avatar: 'https://i.pravatar.cc/96?img=22' },
        { id: 'theo',   name: 'Theo Mar',   handle: '@theomar',   avatar: 'https://i.pravatar.cc/96?img=15' },
        { id: 'juno',   name: 'Juno Pax',   handle: '@junopax',   avatar: 'https://i.pravatar.cc/96?img=18' }
      ]
    },
    {
      id: 'family', name: 'Family',
      thumb: 'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=200&h=200&q=80',
      members: [
        { id: 'mom',  name: 'Mom',          handle: '@mom',     initials: 'MM' },
        { id: 'dad',  name: 'Dad',          handle: '@dad',     initials: 'DD' },
        { id: 'sib',  name: 'Sam (sibling)',handle: '@sam',     avatar: 'https://i.pravatar.cc/96?img=51' },
        { id: 'aunt', name: 'Aunt Robin',   handle: '@robin',   avatar: 'https://i.pravatar.cc/96?img=37' }
      ]
    },
    {
      id: 'gym', name: 'Climbing',
      thumb: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?auto=format&fit=crop&w=200&h=200&q=80',
      members: [
        { id: 'kai',  name: 'Kai Brun',  handle: '@kaibrun', avatar: 'https://i.pravatar.cc/96?img=64' },
        { id: 'ari',  name: 'Ari Lex',   handle: '@arilex',  avatar: 'https://i.pravatar.cc/96?img=68' },
        { id: 'noor', name: 'Noor Vega', handle: '@noorvega',avatar: 'https://i.pravatar.cc/96?img=23' }
      ]
    }
  ];

  // ----- STATE -----
  // mode: 'default' | 'friends' | 'group'
  // route: 'picker' | 'group-detail'
  // selectedFriends: Set of friend ids
  // selectedGroupId: id or null
  // selectedMembers: { [groupId]: Set of member ids } — defaults to all when a group is first chosen
  var state = {
    mode: 'default',
    route: 'picker',
    selectedFriends: new Set(),
    selectedGroupId: null,
    selectedMembers: {},
    clearedFriends: [],
    showRestored: false
  };

  // ----- HELPERS -----
  function findFriend(id) { return FRIENDS.find(function (f) { return f.id === id; }); }
  function findGroup(id) { return GROUPS.find(function (g) { return g.id === id; }); }
  function firstName(name) { return name.split(' ')[0]; }
  function escAttr(s) { return String(s).replace(/"/g, '&quot;'); }
  function nameList(names) {
    if (names.length === 0) return '';
    if (names.length === 1) return names[0];
    if (names.length === 2) return names[0] + ' and ' + names[1];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }

  function selectGroup(groupId) {
    var g = findGroup(groupId);
    state.mode = 'group';
    state.selectedGroupId = groupId;
    if (!state.selectedMembers[groupId]) {
      state.selectedMembers[groupId] = new Set(g.members.map(function (m) { return m.id; }));
    }
    state.selectedFriends.clear();
  }
  function clearAll() {
    state.mode = 'default';
    state.selectedGroupId = null;
    state.selectedFriends.clear();
  }
  function toggleFriend(id) {
    if (state.selectedFriends.has(id)) state.selectedFriends.delete(id);
    else state.selectedFriends.add(id);
    state.mode = state.selectedFriends.size > 0 ? 'friends' : 'default';
  }

  // ----- AVATAR HTML -----
  function avatarHTML(person, extraClass) {
    var cls = 'av' + (extraClass ? ' ' + extraClass : '') + (person.muted ? ' muted' : '');
    if (person.avatar) {
      return '<img class="' + cls + '" src="' + escAttr(person.avatar) + '" alt="" loading="lazy" />';
    }
    return '<span class="' + cls + '">' + (person.initials || person.name[0]) + '</span>';
  }
  function chipAvatarHTML(person) {
    if (person.avatar) {
      return '<img class="mr-pp-chip-avatar" src="' + escAttr(person.avatar) + '" alt="" loading="lazy" />';
    }
    return '<span class="mr-pp-chip-avatar is-initials">' + (person.initials || person.name[0]) + '</span>';
  }

  // ----- TOAST -----
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-on'); }, 1800);
  }

  // ----- RENDER: PICKER -----
  function renderPicker() {
    var html = '';
    html += '<div class="v5-body">';
    html += '<header class="v5-header"><div class="v5-title">Who\'s going?</div>';
    html += '<button type="button" class="v5-close" data-act="close" aria-label="Close"><i class="ph ph-x"></i></button></header>';

    // Friends mode: chips
    if (state.mode === 'friends' && state.selectedFriends.size > 0) {
      html += '<div class="v5-chips">';
      state.selectedFriends.forEach(function (fid) {
        var f = findFriend(fid);
        if (!f) return;
        html += '<span class="mr-pp-chip">' + chipAvatarHTML(f) + firstName(f.name);
        html += '<button type="button" class="mr-pp-chip-remove" data-act="remove-friend" data-id="' + fid + '" aria-label="Remove"><i class="ph ph-x"></i></button></span>';
      });
      html += '</div>';
    }

    // Groups section — only show in default/group modes
    if (state.mode !== 'friends') {
      var goingCount = 0, totalCount = 0;
      if (state.mode === 'group') {
        var g = findGroup(state.selectedGroupId);
        var sel = state.selectedMembers[state.selectedGroupId];
        goingCount = sel ? sel.size : 0;
        totalCount = g.members.length;
      }
      var countLabel = state.mode === 'group' ? '<span class="count">' + goingCount + ' of ' + totalCount + ' going</span>' : '';
      html += '<div class="v5-label"><span>Add to a group</span>' + countLabel + '</div>';
      html += '<div class="v5-groups">';
      GROUPS.forEach(function (gg) {
        var on = state.mode === 'group' && state.selectedGroupId === gg.id;
        html += '<div class="v5-group ' + (on ? 'is-on' : '') + '" data-act="select-group" data-id="' + gg.id + '">';
        html += '<div class="v5-thumb"><img src="' + gg.thumb + '" alt="" loading="lazy" /></div>';
        html += '<div class="v5-gname">' + gg.name + '</div>';
        html += '<div class="v5-gmeta">' + gg.members.length + ' members</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    // Friends section
    if (state.mode === 'group') {
      // Locked friends list with hint above
      html += '<div class="v5-label tight-top"><span>Or invite people</span></div>';
      html += '<div class="v5-groups-hint" data-act="clear-group">';
      html += '<div class="col"><div class="txt">Switch to <b>friends</b> plan</div>';
      html += '<div class="sub">Pick individual friends instead of the group</div></div>';
      html += '<i class="ph-fill ph-user-switch swap"></i>';
      html += '</div>';
      var lockedPrimary = FRIENDS.filter(function (f) { return !f.muted; }).slice(0, 2);
      var lockedSuggested = FRIENDS.filter(function (f) { return lockedPrimary.indexOf(f) === -1; }).slice(0, 1);
      var lockedRow = function (f) {
        var row = '<div class="v5-row is-locked">' + avatarHTML(f);
        row += '<div><div class="v5-name">' + f.name + '</div><div class="v5-handle">' + f.handle + '</div></div>';
        row += '<span class="mr-checkbox"><i class="ph ph-square"></i></span></div>';
        return row;
      };
      html += '<div class="v5-label sm"><span>Friends</span></div>';
      html += '<div class="v5-list">';
      lockedPrimary.forEach(function (f) { html += lockedRow(f); });
      html += '</div>';
      if (lockedSuggested.length) {
        html += '<div class="v5-label sm"><span>Suggested</span></div>';
        html += '<div class="v5-list">';
        lockedSuggested.forEach(function (f) { html += lockedRow(f); });
        html += '</div>';
      }
    } else {
      // Default + friends modes
      if (state.mode === 'friends') {
        html += '<div class="v5-label"><span>Add to a group</span></div>';
        html += '<div class="v5-groups-hint" data-act="switch-to-group">';
        html += '<div class="col"><div class="txt">Switch to a <b>group</b> plan</div>';
        html += '<div class="sub">Pick a group to attach this plan to</div></div>';
        html += '<i class="ph-fill ph-user-switch swap"></i>';
        html += '</div>';
        html += '<div class="v5-label"><span>Or invite people</span><span class="count">' + state.selectedFriends.size + ' selected</span></div>';
      } else {
        html += '<div class="v5-label tight-top"><span>Or invite people</span></div>';
      }
      var friendRow = function (f) {
        var on = state.selectedFriends.has(f.id);
        var row = '<div class="v5-row ' + (on ? 'is-on' : '') + '" data-act="toggle-friend" data-id="' + f.id + '">';
        row += avatarHTML(f);
        row += '<div><div class="v5-name">' + f.name + '</div><div class="v5-handle">' + f.handle + '</div></div>';
        row += on
          ? '<span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>'
          : '<span class="mr-checkbox"><i class="ph ph-square"></i></span>';
        row += '</div>';
        return row;
      };
      var primary = FRIENDS.filter(function (f) { return !f.muted; }).slice(0, 4);
      var suggested = FRIENDS.filter(function (f) { return primary.indexOf(f) === -1; });
      html += '<div class="v5-label sm"><span>Friends</span></div>';
      html += '<div class="v5-list">';
      primary.forEach(function (f) { html += friendRow(f); });
      html += '</div>';
      if (suggested.length) {
        html += '<div class="v5-label sm"><span>Suggested</span></div>';
        html += '<div class="v5-list">';
        suggested.forEach(function (f) { html += friendRow(f); });
        html += '</div>';
      }
    }

    html += '</div>'; // .v5-body

    // Undo bar — pinned above the CTA, after switching away from friends
    if (state.clearedFriends.length > 0) {
      var clearedNames = state.clearedFriends.map(function (f) { return firstName(f.name); });
      html += '<div class="v5-undo">';
      html += '<div class="msg">Cleared ' + nameList(clearedNames) + '</div>';
      html += '<button type="button" class="undo" data-act="undo-clear">Undo</button>';
      html += '</div>';
    } else if (state.showRestored) {
      var rn = state.selectedFriends.size;
      html += '<div class="v5-undo">';
      html += '<div class="msg"><i class="ph ph-arrow-counter-clockwise"></i>Your ' + rn + ' pick' + (rn === 1 ? '' : 's') + ' ' + (rn === 1 ? 'is' : 'are') + ' back</div>';
      html += '</div>';
    }

    // CTA
    var ctaLabel = 'Add to plan';
    var ctaDisabled = true;
    if (state.mode === 'friends') {
      var n = state.selectedFriends.size;
      ctaLabel = 'Invite ' + n + ' ' + (n === 1 ? 'person' : 'people');
      ctaDisabled = n === 0;
    } else if (state.mode === 'group') {
      var sel = state.selectedMembers[state.selectedGroupId];
      var c = sel ? sel.size : 0;
      ctaLabel = c > 0 ? 'Invite ' + c + ' member' + (c === 1 ? '' : 's') : 'Pick members';
      ctaDisabled = c === 0;
    }
    html += '<div class="v5-cta"><button type="button" class="primary" data-act="cta"' + (ctaDisabled ? ' disabled' : '') + '>' + ctaLabel + '</button></div>';

    document.getElementById('screen').innerHTML = html;
  }

  // ----- RENDER: GROUP DETAIL -----
  function renderGroupDetail() {
    var g = findGroup(state.selectedGroupId);
    if (!g) { state.route = 'picker'; renderPicker(); return; }
    var sel = state.selectedMembers[g.id];
    var allOn = sel.size === g.members.length;

    var bannerMeta = allOn
      ? g.members.length + ' members · all invited'
      : sel.size + ' of ' + g.members.length + ' invited';

    var html = '';
    html += '<div class="v5-body">';
    html += '<header class="v5-header with-back">';
    html += '<button type="button" class="v5-back" data-act="back-to-picker" aria-label="Back"><i class="ph ph-arrow-left"></i></button>';
    html += '<div class="v5-title">' + g.name + '</div></header>';

    html += '<div class="v5-group-banner"><img src="' + g.thumb + '" alt="" loading="lazy" /><div>';
    html += '<div class="v5-banner-label">Group plan</div>';
    html += '<div class="v5-banner-name">' + g.name + '</div>';
    html += '<div class="v5-banner-meta">' + bannerMeta + '</div></div></div>';

    var actLabel = allOn ? 'Deselect all' : 'Select all';
    var actVal = allOn ? 'deselect-all' : 'select-all';
    html += '<div class="v5-label sm"><span>' + g.name + ' members</span>';
    html += '<button type="button" class="action" data-act="' + actVal + '">' + actLabel + '</button></div>';

    html += '<div class="v5-list">';
    g.members.forEach(function (m) {
      var on = sel.has(m.id);
      var rowCls = on ? 'is-on' : 'is-dim';
      html += '<div class="v5-row ' + rowCls + '" data-act="toggle-member" data-id="' + m.id + '">';
      html += avatarHTML(m, on ? '' : 'dim');
      var meta = m.host ? '<span class="host">Host</span>' : (on ? m.handle : 'Not invited');
      html += '<div><div class="v5-name">' + m.name + '</div><div class="v5-meta">' + meta + '</div></div>';
      if (on) {
        html += '<span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>';
      } else {
        html += '<span class="mr-checkbox"><i class="ph ph-square"></i></span>';
      }
      html += '</div>';
    });
    html += '</div>';

    html += '</div>'; // body

    var ctaLabel = allOn ? 'Invite all members' : 'Invite ' + sel.size + ' member' + (sel.size === 1 ? '' : 's');
    var ctaDisabled = sel.size === 0;
    html += '<div class="v5-cta"><button type="button" class="primary" data-act="cta-group"' + (ctaDisabled ? ' disabled' : '') + '>' + ctaLabel + '</button></div>';

    document.getElementById('screen').innerHTML = html;
  }

  function render() {
    if (state.route === 'group-detail') renderGroupDetail();
    else renderPicker();
  }

  // ----- EVENTS -----
  document.getElementById('screen').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');

    // Dismiss the undo/restored bars on any action other than the undo flow itself
    if (act !== 'switch-to-group' && act !== 'undo-clear') {
      state.clearedFriends = [];
      state.showRestored = false;
    }

    switch (act) {
      case 'close':
        toast('Closed');
        return;
      case 'toggle-friend':
        toggleFriend(id);
        render();
        return;
      case 'remove-friend':
        e.stopPropagation();
        state.selectedFriends.delete(id);
        if (state.selectedFriends.size === 0) state.mode = 'default';
        render();
        return;
      case 'select-group':
        if (state.mode === 'group' && state.selectedGroupId === id) {
          clearAll();
          render();
          return;
        }
        selectGroup(id);
        state.route = 'group-detail';
        render();
        return;
      case 'clear-group':
        clearAll();
        render();
        return;
      case 'switch-to-group':
        state.clearedFriends = Array.from(state.selectedFriends).map(findFriend).filter(Boolean);
        state.selectedFriends.clear();
        state.showRestored = false;
        state.mode = 'default';
        render();
        return;
      case 'undo-clear':
        state.clearedFriends.forEach(function (f) { state.selectedFriends.add(f.id); });
        state.clearedFriends = [];
        state.mode = state.selectedFriends.size > 0 ? 'friends' : 'default';
        state.showRestored = true;
        render();
        return;
      case 'cta':
        if (state.mode === 'group') {
          state.route = 'group-detail';
          render();
        } else if (state.mode === 'friends') {
          toast('Invited ' + state.selectedFriends.size + ' ' + (state.selectedFriends.size === 1 ? 'person' : 'people'));
        }
        return;
      case 'back-to-picker':
        state.route = 'picker';
        render();
        return;
      case 'toggle-member':
        var sel = state.selectedMembers[state.selectedGroupId];
        if (sel.has(id)) sel.delete(id);
        else sel.add(id);
        render();
        return;
      case 'select-all':
        var g = findGroup(state.selectedGroupId);
        state.selectedMembers[g.id] = new Set(g.members.map(function (m) { return m.id; }));
        render();
        return;
      case 'deselect-all':
        state.selectedMembers[state.selectedGroupId] = new Set();
        render();
        return;
      case 'cta-group':
        var s = state.selectedMembers[state.selectedGroupId];
        var gg = findGroup(state.selectedGroupId);
        toast('Invited ' + s.size + ' of ' + gg.members.length + ' to ' + gg.name);
        return;
    }
  });

  render();
})();
</script>
