<link rel="stylesheet" href="../../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../../design-system/company.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06080e; overflow-x: clip; }
  body { font-family: var(--font-body); }

  .v6-scope { --v6-bg: #06080e; --v6-line: rgba(255,255,255,0.08); --v6-warn: #f5c451; }
  .v6-scope, .v6-scope * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
  .v6-scope::-webkit-scrollbar, .v6-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .v6-wrap { background: var(--v6-bg); height: 100vh; height: 100dvh; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-body); }
  .v6-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }

  .v6-header { display: grid; grid-template-columns: 1fr 28px; align-items: center; padding: 22px 20px 8px; }
  .v6-title { color: #fff; font-size: 1.7rem; font-weight: 850; letter-spacing: -0.01em; }
  .v6-close { background: transparent; border: 0; color: rgba(255,255,255,0.85); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .v6-close i { font-size: 22px; }

  .v6-search { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; margin: 8px 20px 14px; padding: 12px 15px; background: rgba(255,255,255,0.07); border-radius: 999px; }
  .v6-search i { color: rgba(255,255,255,0.54); font-size: 17px; }
  .v6-search input { width: 100%; border: 0; outline: 0; padding: 0; background: transparent; color: #fff; font: inherit; font-size: 0.94rem; }

  .v6-chips { display: flex; gap: 8px; padding: 0 20px 14px; overflow-x: auto; flex-wrap: nowrap; }
  .v6-chips:empty { display: none; }
  .v6-chips .mr-pp-chip { flex: 0 0 auto; }
  .mr-pp-chip.is-conflict { background: rgba(245,196,81,0.15); color: var(--v6-warn); border-color: rgba(245,196,81,0.45); }

  .v6-label { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 20px 12px; color: #fff; font-size: 1.25rem; font-weight: 850; letter-spacing: -0.005em; }
  .v6-label.v6-label--tight { padding-top: 0; margin-top: -4px; }
  .v6-label .count { color: rgba(255,255,255,0.5); font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .v6-sublabel { padding: 4px 20px 6px; color: rgba(255,255,255,0.55); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }

  .v6-groups { display: flex; gap: 14px; padding: 0 20px 14px; overflow-x: auto; }
  .v6-group { flex: 0 0 96px; padding: 4px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; background: transparent; border: 0; position: relative; cursor: pointer; }
  .v6-thumb { width: 64px; height: 64px; border-radius: 18px; overflow: hidden; background: rgba(255,255,255,0.08); display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .v6-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .v6-gname { color: #fff; font-size: 0.92rem; line-height: 1.15; font-weight: 850; margin-top: 2px; }
  .v6-gmeta { color: rgba(255,255,255,0.5); font-size: 0.74rem; font-weight: 700; line-height: 1.2; margin-top: 0; }
  .v6-group.is-on .v6-thumb { box-shadow: 0 0 0 2px var(--neon-teal); }
  .v6-group.is-on .v6-thumb::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--neon-teal); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23061016' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>"); background-size: 12px 12px; background-repeat: no-repeat; background-position: center; box-shadow: 0 0 0 2px var(--v6-bg); }
  .v6-group.is-on .v6-gname { color: var(--neon-teal); }

  .v6-list { padding: 0 20px; display: flex; flex-direction: column; }
  .v6-row { display: grid; grid-template-columns: 44px 1fr 22px; align-items: center; gap: 13px; padding: 11px 8px; margin: 0 -4px; border-radius: 14px; cursor: pointer; }
  .v6-row.is-on { background: rgba(32,224,207,0.09); }
  .v6-row .av { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; background: var(--neon-teal); color: #061016; font-weight: 900; }
  .v6-row .av.muted { background: #4a5462; color: #fff; }
  .v6-name { color: #fff; font-size: 0.98rem; font-weight: 850; line-height: 1.15; }
  .v6-handle, .v6-meta { color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 2px; }
  .v6-meta .host { color: var(--v6-warn); font-weight: 800; }

  .v6-footnote { text-align: center; padding: 6px 20px 0; color: rgba(255,255,255,0.55); font-size: 0.86rem; font-weight: 700; }
  .v6-footnote b { color: #fff; font-weight: 850; }
  .v6-linkbtn { display: block; margin: 8px auto 0; background: transparent; border: 0; color: var(--neon-teal); font-size: 0.92rem; font-weight: 850; cursor: pointer; padding: 6px 8px; }

  .v6-cta { padding: 14px 20px 22px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .v6-cta button { min-height: 50px; border: 0; border-radius: 999px; color: #fff; font-size: 0.98rem; font-weight: 850; cursor: pointer; }
  .v6-cta .primary { background: linear-gradient(135deg, var(--neon-teal), var(--neon-blue)); }
  .v6-cta .primary[disabled] { opacity: 0.5; cursor: not-allowed; }

  .v6-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); z-index: 5; }
  .v6-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #11151d; border-radius: 24px 24px 0 0; padding: 22px 20px 22px; z-index: 6; border-top: 1px solid var(--v6-line); }
  .v6-sheet .grab { width: 36px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.18); margin: 0 auto 14px; }
  .v6-sheet .ico { width: 44px; height: 44px; border-radius: 14px; background: rgba(245,196,81,0.14); color: var(--v6-warn); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px; }
  .v6-sheet h3 { color: #fff; font-size: 1.18rem; font-weight: 850; margin: 0 0 6px; letter-spacing: -0.005em; }
  .v6-sheet p { color: rgba(255,255,255,0.7); font-size: 0.92rem; line-height: 1.35; margin: 0 0 12px; font-weight: 700; }
  .v6-sheet .who { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; max-height: 132px; overflow-y: auto; }
  .v6-sheet .who-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; background: rgba(255,255,255,0.06); border-radius: 999px; }
  .v6-sheet .who-chip img, .v6-sheet .who-chip .av-sm { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; font-size: 0.64rem; font-weight: 900; background: #4a5462; color: #fff; }
  .v6-sheet .who-name { color: #fff; font-size: 0.86rem; font-weight: 850; }
  .v6-sheet .actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .v6-sheet button { min-height: 50px; border: 0; border-radius: 999px; font-size: 0.98rem; font-weight: 850; cursor: pointer; }
  .v6-sheet .primary { background: linear-gradient(135deg, var(--neon-teal), var(--neon-blue)); color: #fff; }
  .v6-sheet .ghost { background: rgba(255,255,255,0.08); color: #fff; }

  .v6-toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); background: rgba(255,255,255,0.96); color: #061016; font-weight: 850; font-size: 0.9rem; padding: 12px 18px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 100; }
  .v6-toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<div class="mr-scope v6-scope">
  <div class="v6-wrap" id="screen"></div>
  <div class="v6-toast" id="toast"></div>
</div>

<script>
(function () {
  var FRIENDS = [
    { id: 'nova',  name: 'Nova Finch', handle: '@novafinch', avatar: 'https://i.pravatar.cc/96?img=12' },
    { id: 'milo',  name: 'Milo Wren',  handle: '@milowren',  initials: 'M' },
    { id: 'lila',  name: 'Lila Quill', handle: '@lilaquill', avatar: 'https://i.pravatar.cc/96?img=49' },
    { id: 'wren',  name: 'Wren Holt',  handle: '@wrenholt',  avatar: 'https://i.pravatar.cc/96?img=44' }
  ];
  var SUGGESTED = [
    { id: 'soren', name: 'Soren Vale', handle: '@sorenvale', avatar: 'https://i.pravatar.cc/96?img=33' },
    { id: 'piper', name: 'Piper Sol',  handle: '@pipersol',  initials: 'PS', muted: true }
  ];
  var ALL_PEOPLE = FRIENDS.concat(SUGGESTED);

  var GROUPS = [
    {
      id: 'lake', name: 'Lake House',
      thumb: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&h=200&q=80',
      members: [
        { id: 'milo', host: true },
        { id: 'nova' },
        { id: 'lila' },
        { id: 'wren' },
        { id: 'theo', name: 'Theo Mar', handle: '@theomar', avatar: 'https://i.pravatar.cc/96?img=15' }
      ]
    },
    {
      id: 'family', name: 'Family',
      thumb: 'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=200&h=200&q=80',
      members: [
        { id: 'mom',  name: 'Mom',        handle: '@mom',   initials: 'MM' },
        { id: 'dad',  name: 'Dad',        handle: '@dad',   initials: 'DD' },
        { id: 'sam',  name: 'Sam',        handle: '@sam',   avatar: 'https://i.pravatar.cc/96?img=51' }
      ]
    },
    {
      id: 'gym', name: 'Climbing gym',
      thumb: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?auto=format&fit=crop&w=200&h=200&q=80',
      members: [
        { id: 'kai', name: 'Kai Brun', handle: '@kaibrun', avatar: 'https://i.pravatar.cc/96?img=64' },
        { id: 'ari', name: 'Ari Lex',  handle: '@arilex',  avatar: 'https://i.pravatar.cc/96?img=68' }
      ]
    }
  ];

  // selectedGroupId + selectedMembers[groupId] = Set of member ids
  // selectedPeople = Set of person ids (independent of group selection)
  // warningOpen = bool
  var state = {
    selectedPeople: new Set(),
    selectedGroupId: null,
    selectedMembers: {},
    warningOpen: false
  };

  function findPerson(id) {
    var p = ALL_PEOPLE.find(function (x) { return x.id === id; });
    if (p) return p;
    // fall back to group members that aren't in ALL_PEOPLE (e.g. Theo, Mom)
    for (var i = 0; i < GROUPS.length; i++) {
      var m = GROUPS[i].members.find(function (x) { return x.id === id; });
      if (m) return resolveMember(m);
    }
    return null;
  }
  function resolveMember(m) {
    if (m.name) return m;
    var p = ALL_PEOPLE.find(function (x) { return x.id === m.id; });
    return p ? Object.assign({}, p, m) : m;
  }
  function findGroup(id) { return GROUPS.find(function (g) { return g.id === id; }); }
  function firstName(name) { return name.split(' ')[0]; }
  function escAttr(s) { return String(s).replace(/"/g, '&quot;'); }

  function groupMemberIds(groupId) {
    return findGroup(groupId).members.map(function (m) { return m.id; });
  }
  // people selected but NOT in the chosen group
  function outsiders() {
    if (!state.selectedGroupId) return [];
    var members = groupMemberIds(state.selectedGroupId);
    var out = [];
    state.selectedPeople.forEach(function (id) {
      if (members.indexOf(id) === -1) out.push(id);
    });
    return out;
  }

  function avatarHTML(person, extraClass) {
    var cls = 'av' + (extraClass ? ' ' + extraClass : '') + (person.muted ? ' muted' : '');
    if (person.avatar) {
      return '<img class="' + cls + '" src="' + escAttr(person.avatar) + '" alt="" loading="lazy" />';
    }
    return '<span class="' + cls + '">' + (person.initials || person.name[0]) + '</span>';
  }
  function chipAvatarHTML(person) {
    if (person.avatar) {
      return '<img class="mr-pp-chip-avatar" src="' + escAttr(person.avatar) + '" alt="" loading="lazy" />';
    }
    return '<span class="mr-pp-chip-avatar is-initials">' + (person.initials || person.name[0]) + '</span>';
  }
  function whoChipHTML(person) {
    if (person.avatar) {
      return '<span class="who-chip"><img src="' + escAttr(person.avatar) + '" alt="" loading="lazy" /><span class="who-name">' + person.name + '</span></span>';
    }
    return '<span class="who-chip"><span class="av-sm">' + (person.initials || person.name[0]) + '</span><span class="who-name">' + person.name + '</span></span>';
  }

  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-on'); }, 1800);
  }

  function rowHTML(p, conflict) {
    var on = state.selectedPeople.has(p.id);
    var cls = 'v6-row' + (on ? ' is-on' : '');
    var box = on
      ? '<span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>'
      : '<span class="mr-checkbox"><i class="ph ph-square"></i></span>';
    return '<div class="' + cls + '" data-act="toggle-person" data-id="' + p.id + '">'
      + avatarHTML(p)
      + '<div><div class="v6-name">' + p.name + '</div><div class="v6-handle">' + p.handle + '</div></div>'
      + box + '</div>';
  }

  function render() {
    var groupId = state.selectedGroupId;
    var group = groupId ? findGroup(groupId) : null;
    var memberSet = groupId ? state.selectedMembers[groupId] : null;
    var conflictIds = outsiders();
    var conflictSet = new Set(conflictIds);

    var html = '';
    html += '<div class="v6-body">';
    html += '<header class="v6-header"><div class="v6-title">Who\'s going?</div>';
    html += '<button type="button" class="v6-close" data-act="close" aria-label="Close"><i class="ph ph-x"></i></button></header>';

    html += '<div class="v6-search"><i class="ph ph-magnifying-glass"></i><input type="search" placeholder="Search people" /></div>';

    // Chips — only when in people mode (no group selected)
    if (!groupId && state.selectedPeople.size > 0) {
      html += '<div class="v6-chips">';
      state.selectedPeople.forEach(function (pid) {
        var p = findPerson(pid); if (!p) return;
        html += '<span class="mr-pp-chip">' + chipAvatarHTML(p) + firstName(p.name);
        html += '<button type="button" class="mr-pp-chip-remove" data-act="remove-person" data-id="' + pid + '" aria-label="Remove"><i class="ph ph-x"></i></button></span>';
      });
      html += '</div>';
    }

    // Group strip — count when a group is selected
    var groupCount = '';
    if (group) {
      groupCount = '<span class="count">' + memberSet.size + ' of ' + group.members.length + ' going</span>';
    }
    html += '<div class="v6-label"><span>Add to a group</span>' + groupCount + '</div>';
    html += '<div class="v6-groups">';
    GROUPS.forEach(function (g) {
      var on = groupId === g.id;
      html += '<div class="v6-group ' + (on ? 'is-on' : '') + '" data-act="select-group" data-id="' + g.id + '">';
      html += '<div class="v6-thumb"><img src="' + g.thumb + '" alt="" loading="lazy" /></div>';
      html += '<div class="v6-gname">' + g.name + '</div>';
      html += '<div class="v6-gmeta">' + g.members.length + ' members</div></div>';
    });
    html += '</div>';

    // Bottom section
    if (group) {
      // Group view: only group members shown
      html += '<div class="v6-label"><span>' + group.name + ' members</span></div>';
      html += '<div class="v6-list">';
      group.members.forEach(function (m) {
        var person = resolveMember(m);
        var on = memberSet.has(m.id);
        var cls = 'v6-row' + (on ? ' is-on' : '');
        var meta = m.host ? '<span class="host">Host</span>' : person.handle;
        var box = on
          ? '<span class="mr-checkbox is-checked"><i class="ph-fill ph-check-square"></i></span>'
          : '<span class="mr-checkbox"><i class="ph ph-square"></i></span>';
        html += '<div class="' + cls + '" data-act="toggle-member" data-id="' + m.id + '">'
          + avatarHTML(person)
          + '<div><div class="v6-name">' + person.name + '</div><div class="v6-meta">' + meta + '</div></div>'
          + box + '</div>';
      });
      html += '</div>';
      var allOn = memberSet.size === group.members.length;
      if (allOn) {
        html += '<div class="v6-footnote">That\'s everyone in <b>' + group.name + '</b>.</div>';
      } else {
        html += '<div class="v6-footnote">' + memberSet.size + ' of ' + group.members.length + ' selected.</div>';
      }
      html += '<button type="button" class="v6-linkbtn" data-act="clear-group">Clear group, keep people</button>';
    } else {
      // People view: Friends + Suggested
      html += '<div class="v6-label v6-label--tight"><span>Or invite friends</span>'
        + (state.selectedPeople.size > 0 ? '<span class="count">' + state.selectedPeople.size + ' selected</span>' : '')
        + '</div>';
      html += '<div class="v6-sublabel">Friends</div>';
      html += '<div class="v6-list">';
      FRIENDS.forEach(function (p) { html += rowHTML(p); });
      html += '</div>';
      html += '<div class="v6-sublabel">Suggested</div>';
      html += '<div class="v6-list">';
      SUGGESTED.forEach(function (p) { html += rowHTML(p); });
      html += '</div>';
    }

    html += '</div>'; // body

    // CTA
    var ctaLabel = 'Add to plan';
    var ctaDisabled = true;
    if (group) {
      var c = memberSet.size;
      ctaLabel = c === group.members.length
        ? 'Invite ' + group.name + ' (' + c + ')'
        : 'Invite ' + c + ' member' + (c === 1 ? '' : 's');
      ctaDisabled = c === 0;
    } else if (state.selectedPeople.size > 0) {
      var n = state.selectedPeople.size;
      ctaLabel = 'Invite ' + n + ' ' + (n === 1 ? 'person' : 'people');
      ctaDisabled = false;
    }
    html += '<div class="v6-cta"><button type="button" class="primary" data-act="cta"' + (ctaDisabled ? ' disabled' : '') + '>' + ctaLabel + '</button></div>';

    // Warning sheet
    if (state.warningOpen && conflictIds.length > 0 && group) {
      html += '<div class="v6-scrim" data-act="close-warning"></div>';
      html += '<div class="v6-sheet">';
      html += '<div class="grab"></div>';
      html += '<div class="ico"><i class="ph-fill ph-warning"></i></div>';
      var n = conflictIds.length;
      html += '<h3>' + n + ' ' + (n === 1 ? 'person isn\'t' : 'people aren\'t') + ' in ' + group.name + '</h3>';
      html += '<p>A ' + group.name + ' plan can only invite group members. ' + (n === 1 ? 'This person isn\'t' : 'These people aren\'t') + ' in the group:</p>';
      html += '<div class="who">';
      conflictIds.forEach(function (id) {
        var p = findPerson(id); if (p) html += whoChipHTML(p);
      });
      html += '</div>';
      html += '<div class="actions">';
      html += '<button type="button" class="primary" data-act="drop-outsiders">Drop them, use ' + group.name + '</button>';
      html += '<button type="button" class="ghost" data-act="clear-group-keep-people">Keep everyone, no group</button>';
      html += '</div></div>';
    }

    document.getElementById('screen').innerHTML = html;
  }

  document.getElementById('screen').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');

    switch (act) {
      case 'close':
        toast('Closed');
        return;

      case 'toggle-person': {
        if (state.selectedPeople.has(id)) state.selectedPeople.delete(id);
        else state.selectedPeople.add(id);
        render();
        return;
      }

      case 'remove-person':
        e.stopPropagation();
        state.selectedPeople.delete(id);
        render();
        return;

      case 'select-group': {
        if (state.selectedGroupId === id) {
          // tap selected group again to deselect
          state.selectedGroupId = null;
          state.warningOpen = false;
          render();
          return;
        }
        state.selectedGroupId = id;
        if (!state.selectedMembers[id]) {
          state.selectedMembers[id] = new Set(groupMemberIds(id));
        }
        // if there are selected people outside the group, open warning
        if (outsiders().length > 0) {
          state.warningOpen = true;
        }
        render();
        return;
      }

      case 'toggle-member': {
        var sel = state.selectedMembers[state.selectedGroupId];
        if (sel.has(id)) sel.delete(id);
        else sel.add(id);
        render();
        return;
      }

      case 'clear-group':
        state.selectedGroupId = null;
        state.warningOpen = false;
        render();
        return;

      case 'close-warning':
        state.warningOpen = false;
        // user dismissed without resolving — back out the group too, since the state is invalid
        state.selectedGroupId = null;
        render();
        return;

      case 'drop-outsiders': {
        outsiders().forEach(function (oid) { state.selectedPeople.delete(oid); });
        state.warningOpen = false;
        render();
        return;
      }

      case 'clear-group-keep-people':
        state.selectedGroupId = null;
        state.warningOpen = false;
        render();
        return;

      case 'cta': {
        if (state.selectedGroupId) {
          var g = findGroup(state.selectedGroupId);
          var s = state.selectedMembers[state.selectedGroupId];
          toast('Invited ' + s.size + ' to ' + g.name);
        } else {
          var n = state.selectedPeople.size;
          toast('Invited ' + n + ' ' + (n === 1 ? 'person' : 'people'));
        }
        return;
      }
    }
  });

  render();
})();
</script>
