<style>
  .calsg-scope, .calsg-scope * { scrollbar-width: none; -ms-overflow-style: none; box-sizing: border-box; }
  .calsg-scope::-webkit-scrollbar, .calsg-scope *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .calsg-scope { font-family: "Geist", sans-serif; }

  .calsg-scope .cal-wrap { min-height: 844px; position: relative; display: flex; flex-direction: column; background: #ffffff; }

  .calsg-scope .cal-top { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #ffffff; }
  .calsg-scope .cal-title { color: #1a2332; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .calsg-scope .cal-top-actions { display: flex; align-items: center; gap: 18px; }
  .calsg-scope .cal-top-action { position: relative; width: 24px; height: 24px; display: inline-grid; place-items: center; color: #1a2332; font-size: 24px; line-height: 1; }
  .calsg-scope .cal-top-badge { position: absolute; top: -9px; right: -10px; min-width: 22px; height: 22px; padding: 0 4px; display: grid; place-items: center; border: 2px solid #ffffff; border-radius: 999px; background: #0ca678; color: #ffffff; font-size: 12px; font-weight: 700; }

  .calsg-scope .cal-filters { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; padding: 4px 16px 16px; }
  .calsg-scope .cal-filters .mr-chip { flex: 0 0 auto; white-space: nowrap; cursor: pointer; }
  .calsg-scope .cal-filters .mr-chip i { font-size: 15px; }

  .calsg-scope .calsg-invite { width: calc(100% - 32px); margin: 0 16px 4px; padding: 11px 14px; display: flex; align-items: center; gap: 11px; border: 1px solid rgba(16, 23, 36, 0.08); border-radius: 18px; background: #ffffff; box-shadow: 0 2px 6px rgba(16, 24, 40, 0.05), 0 10px 24px rgba(16, 24, 40, 0.08); font-family: inherit; text-align: left; cursor: pointer; }
  .calsg-scope .calsg-invite-faces { display: flex; align-items: center; flex-shrink: 0; }
  .calsg-scope .calsg-invite-faces img { width: 30px; height: 30px; border: 2px solid #ffffff; border-radius: 50%; object-fit: cover; }
  .calsg-scope .calsg-invite-faces img + img { margin-left: -8px; }
  .calsg-scope .calsg-invite-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .calsg-scope .calsg-invite-title { color: #101724; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .calsg-scope .calsg-invite-desc { overflow: hidden; color: #5c6b7d; font-size: 13px; line-height: 1.3; white-space: nowrap; text-overflow: ellipsis; }
  .calsg-scope .calsg-invite-count { min-width: 24px; height: 24px; padding: 0 7px; flex-shrink: 0; display: inline-grid; place-items: center; border-radius: 999px; background: #0ca678; color: #ffffff; font-size: 13px; font-weight: 700; line-height: 1; }
  .calsg-scope .calsg-invite-caret { flex-shrink: 0; color: #5c6b7d; font-size: 17px; line-height: 1; }

  .calsg-scope .cal-section { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em; color: #1a2332; padding: 16px 16px 12px; }

  .calsg-scope .cal-list { padding: 0 16px; }
  .calsg-scope .cal-rows { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }

  .calsg-scope .plan-row { min-height: 118px; position: relative; overflow: hidden; display: grid; grid-template-columns: 116px 1fr; border-radius: 20px; color: #fff; background: #1e2832; isolation: isolate; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 4px 28px rgba(0, 0, 0, 0.32); }
  .calsg-scope .plan-row .ambient { position: absolute; inset: 0; z-index: -2; background: center / cover no-repeat; filter: blur(70px) saturate(4) brightness(1.35); transform: scale(1.35); opacity: 1; }
  .calsg-scope .plan-row .shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8, 10, 18, 0), rgba(8, 10, 18, 0.18)); }
  .calsg-scope .plan-row .plan-media { min-height: 118px; position: relative; background: center / cover no-repeat; -webkit-mask-image: linear-gradient(to right, #000 48%, transparent 100%); mask-image: linear-gradient(to right, #000 48%, transparent 100%); }
  .calsg-scope .plan-row .plan-copy { min-width: 0; padding: 15px 14px 14px 0; display: flex; flex-direction: column; gap: 4px; }
  .calsg-scope .plan-row .plan-time { color: rgba(255, 255, 255, 0.8); font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; text-shadow: 0 0 16px rgba(0, 0, 0, 0.32); }
  .calsg-scope .plan-row .plan-title { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: #fff; font-size: 16px; font-weight: 800; line-height: 1.25; text-shadow: 0 0 18px rgba(0, 0, 0, 0.38); }
  .calsg-scope .plan-row .plan-meta { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: auto; color: rgba(255, 255, 255, 0.9); font-size: 11px; text-shadow: 0 0 16px rgba(0, 0, 0, 0.32); }
  .calsg-scope .plan-row .loc { min-width: 0; display: flex; align-items: center; gap: 4px; }
  .calsg-scope .plan-row .loc i { font-size: 13px; flex-shrink: 0; }
  .calsg-scope .plan-row .loc span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .calsg-scope .plan-row .who { display: flex; align-items: center; gap: 6px; }
  .calsg-scope .plan-row .plan-avatars { display: flex; align-items: center; flex-shrink: 0; }
  .calsg-scope .plan-row .plan-avatars img { width: 18px; height: 18px; object-fit: cover; border-radius: 50%; border: 1.5px solid #fff; margin-left: -6px; }
  .calsg-scope .plan-row .plan-avatars img:first-child { margin-left: 0; }

  .calsg-scope .calsg-declined { width: 100%; min-height: 50px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 2px 0 6px; border-radius: 14px; border: 1px solid #dfe3e8; background: #f7f8fa; box-shadow: 0 1px 2px rgba(16, 23, 36, 0.04); cursor: pointer;
    font-family: inherit; font-size: 0.85rem; font-weight: 700; color: #465262; text-align: left; }
  .calsg-scope .calsg-declined-icon { width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: #f8e8e6; color: #a5453d; }
  .calsg-scope .calsg-declined-icon i { font-size: 17px; }
  .calsg-scope .calsg-declined-label { flex: 1; }
  .calsg-scope .calsg-declined-count { min-width: 24px; height: 24px; padding: 0 7px; display: inline-grid; place-items: center; border-radius: 999px; background: #e7eaee; color: #465262; font-size: 12px; font-weight: 800; line-height: 1; }
  .calsg-scope .calsg-declined-caret { color: #697586; font-size: 16px; transition: transform 0.18s ease; }
  .calsg-scope .calsg-declined:hover { border-color: #cbd1d9; background: #f2f4f6; }
  .calsg-scope .calsg-declined.is-open .calsg-declined-caret { transform: rotate(180deg); }

  .calsg-scope .calsg-declined-panel { display: none; }
  .calsg-scope .calsg-declined-panel.is-open { display: block; }
  .calsg-scope .calsg-declined-panel .plan-row { opacity: 0.45; filter: saturate(0.6); }

  .calsg-scope .cal-page-fill { flex: 1 1 auto; min-height: 28px; }
  .calsg-scope .cal-tabwrap { position: sticky; bottom: 0; z-index: 5; flex: 0 0 auto; padding-top: 8px; background: linear-gradient(180deg, transparent, #ffffff 34%); }
  .calsg-scope .app-tab-bar { height: 67px; display: flex; align-items: flex-start; padding-top: 9px; background: #ffffff; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12); }
  .calsg-scope .app-tab { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: #3b4551; }
  .calsg-scope .app-tab i { font-size: 24px; line-height: 1; }
  .calsg-scope .app-tab--discover i { font-size: 26px; }
  .calsg-scope .app-tab.is-selected { color: #1a2332; }
  .calsg-scope .app-tab-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; }
</style>

<script>
  (function () {
    const scope = document.querySelector('.calsg-scope');
    if (!scope) return;

    scope.querySelectorAll('.cal-filters .mr-chip').forEach(function (pill) {
      pill.addEventListener('click', function () {
        scope.querySelectorAll('.cal-filters .mr-chip').forEach(function (p) { p.classList.remove('mr-chip-active'); });
        pill.classList.add('mr-chip-active');
      });
    });

    const toggle = scope.querySelector('[data-declined-toggle]');
    const panel = scope.querySelector('[data-declined-panel]');
    if (toggle && panel) {
      toggle.addEventListener('click', function () {
        const open = panel.classList.toggle('is-open');
        toggle.classList.toggle('is-open', open);
        toggle.querySelector('.calsg-declined-label').textContent = open ? 'Hide declined plans' : 'Declined plans';
      });
    }
  })();
</script>
