<style>
  .stfg3 { position: relative; width: 1024px; height: 500px; overflow: hidden; background: #f5f2ec; font-family: "Geist", -apple-system, sans-serif; box-sizing: border-box; }
  .stfg3 * { box-sizing: border-box; }
  .stfg3-texture { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .stfg3-texture svg { display: block; width: 100%; height: 100%; }

  .stfg3-headline { position: absolute; top: 84px; left: 68px; z-index: 2; margin: 0; font-size: 84px; font-weight: 800; line-height: 1.04; letter-spacing: -0.025em; color: #1a2332; }
  .stfg3-headline i { font-style: normal; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stfg3-sub { position: absolute; top: 296px; left: 70px; z-index: 2; margin: 0; max-width: 400px; font-size: 34px; font-weight: 400; line-height: 1.35; color: #5c6b7d; }

  .stfg3-stack { position: absolute; top: 0; bottom: 0; right: 40px; z-index: 3; width: 452px; display: flex; flex-direction: column; justify-content: center; }
  /* App ActivityCard layout translated to light mode: inset photo left, details right */
  .stfg3-card { position: relative; display: flex; align-items: stretch; gap: 14px; width: 452px; padding: 8px; border-radius: 24px; background: #ffffff; box-shadow: 0 28px 44px rgba(26, 35, 50, 0.24), 0 10px 18px rgba(26, 35, 50, 0.12); }
  .stfg3-card:nth-child(1) { transform: rotate(-1.1deg); z-index: 3; }
  .stfg3-card:nth-child(2) { transform: rotate(0.7deg); z-index: 2; margin-top: -14px; margin-left: 8px; }
  .stfg3-card:nth-child(3) { transform: rotate(-0.4deg); z-index: 1; margin-top: -14px; }

  .stfg3-img { flex: none; width: 116px; height: 116px; border-radius: 16px; background-size: cover; background-position: center; }

  .stfg3-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 4px 12px 4px 2px; }
  .stfg3-when { font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #8794a4; line-height: 1; }
  .stfg3-when.is-live { background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stfg3-title { margin: 0; font-size: 25px; font-weight: 700; line-height: 1.1; color: #101724; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; }
  .stfg3-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 3px; }
  .stfg3-loc { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 16px; font-weight: 500; color: #5c6b7d; white-space: nowrap; overflow: hidden; }
  .stfg3-loc i { flex: none; font-size: 17px; color: #8794a4; }

  .stfg3-avs { display: flex; align-items: center; justify-content: flex-end; flex: none; }
  .stfg3-av { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #ffffff; margin-left: -11px; background-size: cover; background-position: center; box-shadow: 0 2px 6px rgba(26, 35, 50, 0.14); }
  .stfg3-av:first-child { margin-left: 0; }
  .stfg3-av.is-more { display: flex; align-items: center; justify-content: center; background: #e9edf2; color: #5c6b7d; font-size: 13px; font-weight: 700; }

  .stfg3-going { position: absolute; top: -16px; right: -14px; display: grid; place-items: center; width: 52px; height: 52px; border: 5px solid #ffffff; border-radius: 50%; background: #22c55e; color: #ffffff; box-shadow: 0 10px 24px rgba(34, 197, 94, 0.38); }
  .stfg3-going i { font-size: 25px; line-height: 1; }
</style>
