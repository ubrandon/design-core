<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<style>
html, body { margin: 0; min-height: 0; background: #fff; }
.mr-selected-logo { --bg-0: #fff; height: 480px; display: flex; align-items: center; justify-content: center; overflow: clip; }
.mr-selected-logo-crop { position: relative; width: 368px; height: 304px; overflow: hidden; }
.mr-selected-logo-crop img { position: absolute; width: 2006.4px; height: 2006.4px; max-width: none; left: -91.2px; top: -1096px; }

.mr-app-comparison { --bg-0:#fff; position:relative; height:480px; overflow:clip; background:var(--bg-0); }
.mr-app-main { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform:translateX(-30px) scale(.8); }
.mr-app-tile { position:absolute; right:24px; bottom:105px; width:76px; height:76px; border-radius:19px; background:#005bff; overflow:hidden; isolation:isolate; }
.mr-app-mini { position:absolute; left:50%; top:50%; width:368px; height:304px; transform:translate(-50%,-50%) scale(0.14673913043478262); filter:grayscale(1) invert(1) contrast(12); mix-blend-mode:screen; }
.mr-vote-letter { position:absolute; top:22px; left:24px; z-index:1; color:#000; font-size:24px; font-weight:700; line-height:1; }
</style>
<div class="mr-scope mr-app-comparison" style="background:#fff;">
  <span class="mr-vote-letter" aria-label="Option C">C</span>
  <div class="mr-app-main"><div class="mr-selected-logo-crop"><img src="../assets/selected-logo-explorations/fresh-concepts-17-32.png" width="1254" height="1254" alt="Concept 25: bold blue angular MR monogram" /></div></div>
  <div class="mr-app-tile" role="img" aria-label="White logo on a blue app icon">
    <div class="mr-app-mini" aria-hidden="true"><div class="mr-selected-logo-crop"><img src="../assets/selected-logo-explorations/fresh-concepts-17-32.png" width="1254" height="1254" alt="Concept 25: bold blue angular MR monogram" /></div></div>
  </div>
</div>
