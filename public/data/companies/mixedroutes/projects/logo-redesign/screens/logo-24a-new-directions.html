<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<style>
html, body { margin: 0; min-height: 0; background: #fff; }
.mr-logo-directions { --bg-0: #fff; --text: #111827; --muted: #697281; color: var(--text); font-family: var(--font-body); overflow-x: clip; }
.mr-logo-directions header { padding: 36px 48px 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; }
.mr-logo-directions h1 { margin: 8px 0; font-size: 28px; letter-spacing: -1px; font-weight: 700; }
.mr-logo-directions p { color: var(--muted); font-size: 14px; line-height: 1.5; }
.mr-logo-directions .mr-logo-kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.mr-logo-directions .mr-logo-parent { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.mr-logo-directions .mr-logo-parent img { width: 64px; height: 64px; }
.mr-logo-directions figure { margin: 0; }
.mr-logo-directions .mr-logo-sheet { display: block; width: 100%; height: auto; }
.mr-logo-directions figcaption { padding: 0 48px 32px; display: flex; gap: 24px; justify-content: space-between; color: var(--muted); font-size: 12px; }
</style>
<div class="mr-scope mr-scope--light mr-logo-directions" style="background: var(--bg-0);">
  <header>
    <div>
      <p class="mr-logo-kicker">MixedRoutes / Exploration 24A</p>
      <h1>Same meeting point. New directions.</h1>
      <p>Six ways to bring an M and crossing routes together.</p>
    </div>
    <div class="mr-logo-parent"><img src="../assets/selected-logo-explorations/24a-without-lower-piece.png" width="64" height="64" alt="Original 24A logo" /><span>Starting point<br />24A</span></div>
  </header>
  <figure>
    <img class="mr-logo-sheet" src="../assets/selected-logo-explorations/24a-new-directions.png" width="1536" height="1024" alt="Six blue M logo explorations: 01 angular folded planes, 02 flowing crossing ribbons, 03 modular crossing pieces, 04 open outline, 05 bold block, 06 asymmetric tapered routes." />
    <figcaption><span>01 Folded</span><span>02 Flow</span><span>03 Junction</span><span>04 Outline</span><span>05 Monolith</span><span>06 Momentum</span></figcaption>
  </figure>
</div>
