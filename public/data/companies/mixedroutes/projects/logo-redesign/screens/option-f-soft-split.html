<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<style>
html, body { margin:0; min-height:0; background:#fff; }
.mr-app-comparison { --bg-0:#fff; position:relative; height:480px; overflow:clip; background:var(--bg-0); }
.mr-app-main { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform:translateX(-30px) scale(.8); }
.mr-f-mark { display:block; width:350px; height:280px; object-fit:contain; }
.mr-app-tile { position:absolute; right:24px; bottom:105px; width:76px; height:76px; border-radius:19px; background:#005bff; overflow:hidden; isolation:isolate; display:flex; align-items:center; justify-content:center; }
.mr-app-tile img { display:block; width:54px; height:44px; filter:brightness(0) invert(1); }
.mr-vote-letter { position:absolute; top:22px; left:24px; z-index:1; display:flex; align-items:center; gap:12px; color:#000; font-size:24px; font-weight:700; line-height:1; }
</style>
<div class="mr-scope mr-app-comparison" style="background:#fff;">
  <span class="mr-vote-letter" aria-label="Option F">F <span class="mr-logo-count mr-logo-count--none">0</span></span>
  <div class="mr-app-main"><img class="mr-f-mark" src="../assets/option-f-soft-split.svg" width="350" height="280" alt="Option F: blue soft split MixedRoutes mark." /></div>
  <div class="mr-app-tile" role="img" aria-label="White soft split logo on a blue app icon"><img src="../assets/option-f-soft-split.svg" width="54" height="44" alt="" /></div>
</div>
