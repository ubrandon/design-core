<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />

<style>
  @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&display=swap");
  @import url("https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css");

  /* Cold start, zero friends: top of Home only, one phone height */
  .mrv2-hempty, .mrv2-hempty * { box-sizing: border-box; font-family: "Geist", sans-serif; margin: 0; }
  .mrv2-hempty { background: #ffffff; color: #1a2332; position: relative; height: 844px; overflow: clip; display: flex; flex-direction: column; }
  .mrv2-hempty .content { flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }

  /* Toolbar */
  .mrv2-hempty .toolbar { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; background: #ffffff; }
  .mrv2-hempty .status-pill { height: 44px; padding: 0 14px 0 4px; border: 0; border-radius: 999px; background: #f1f4f7; display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
  .mrv2-hempty .status-pill .me { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
  .mrv2-hempty .status-pill .me img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: block; }
  .mrv2-hempty .status-pill .dot, .mrv2-hempty .tab-bar .you-wrap .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: #c5ccd4; border: 2px solid #f1f4f7; }
  .mrv2-hempty .status-pill .st { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; line-height: 1.2; text-align: left; }
  .mrv2-hempty .status-pill .st strong { font-size: 14px; font-weight: 700; color: #1a2332; white-space: nowrap; }
  .mrv2-hempty .status-pill .st small { font-size: 12px; font-weight: 600; color: #5c6b7d; white-space: nowrap; }
  .mrv2-hempty .toolbar .actions { display: flex; align-items: center; gap: 4px; }
  .mrv2-hempty .toolbar .actions .tbtn { position: relative; width: 44px; height: 44px; display: grid; place-items: center; color: #1a2332; font-size: 24px; line-height: 1; }

  /* Greeting */
  .mrv2-hempty .greet { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
  .mrv2-hempty .greet h1 { font-size: 36px; font-weight: 800; line-height: 1.15; }
  .mrv2-hempty .greet h1 .grad { background: linear-gradient(90deg, #1749E5 0%, #7C5CFF 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mrv2-hempty .greet .subline { font-size: 16px; font-weight: 600; color: #5c6b7d; line-height: 1.4; }

  /* Hero: the one job is adding friends */
  .mrv2-hempty .hero { border-radius: 20px; background: #ffffff; border: 1px solid rgba(16, 23, 36, 0.08); box-shadow: 0 2px 6px rgba(16, 24, 40, 0.05), 0 10px 24px rgba(16, 24, 40, 0.08); padding: 20px 16px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
  .mrv2-hempty .hero .faces { display: flex; align-items: center; margin-bottom: 6px; }
  .mrv2-hempty .hero .faces img, .mrv2-hempty .hero .faces .plus { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #ffffff; margin-left: -12px; box-shadow: 0 2px 8px rgba(16, 24, 40, 0.12); }
  .mrv2-hempty .hero .faces img { object-fit: cover; }
  .mrv2-hempty .hero .faces img:first-child { margin-left: 0; }
  .mrv2-hempty .hero .faces .plus { background: #f1f4f7; display: grid; place-items: center; color: #1a2332; font-size: 20px; }
  .mrv2-hempty .hero strong { font-size: 18px; font-weight: 700; color: #101724; line-height: 1.3; }
  .mrv2-hempty .hero p { font-size: 14px; color: #5c6b7d; line-height: 1.4; max-width: 280px; }
  .mrv2-hempty .hero .btn-ink { margin-top: 8px; width: 100%; height: 48px; border: 0; border-radius: 999px; background: #101724; color: #ffffff; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .mrv2-hempty .hero .quiet-link { height: 44px; border: 0; background: none; color: #5c6b7d; font-size: 14px; font-weight: 700; }

  /* Section header: title + grey circle caret */
  .mrv2-hempty section { display: flex; flex-direction: column; gap: 11px; }
  .mrv2-hempty .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .mrv2-hempty .sec-head h2 { font-size: 22px; font-weight: 700; line-height: 1.2; color: #1a2332; }
  .mrv2-hempty .sec-head .more { width: 36px; height: 36px; border-radius: 50%; background: #f1f4f7; color: #1a2332; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }

  /* People rail */
  .mrv2-hempty .rail { display: flex; align-items: stretch; gap: 7px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
  .mrv2-hempty .rail::-webkit-scrollbar { display: none; }
  .mrv2-hempty .mini-card { width: 108px; flex-shrink: 0; padding: 7px 5px; display: flex; flex-direction: column; align-items: center; gap: 11px; text-align: center; color: #101724; }
  .mrv2-hempty .mini-card .av { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; display: block; background: #68707a; }
  .mrv2-hempty .mini-card .txt { display: flex; flex-direction: column; gap: 5px; min-width: 0; width: 100%; }
  .mrv2-hempty .mini-card .txt strong { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrv2-hempty .mini-card .txt span { font-size: 14px; color: #5c6b7d; line-height: 1.3; }
  /* Event tiles, peeking under the tab bar */
  .mrv2-hempty .rail-places { gap: 12px; }
  .mrv2-hempty .tile { width: 164px; flex-shrink: 0; }
  .mrv2-hempty .tile .photo { aspect-ratio: 1.6 / 1; border-radius: 16px; background: #d9e1e7 center / cover no-repeat; }
  .mrv2-hempty .add-btn { margin-top: auto; height: 32px; padding: 0 12px; border-radius: 999px; background: #e1e3e6; color: #101724; font-size: 13px; font-weight: 600; border: 0; }

  /* Tab bar */
  .mrv2-hempty .tab-bar { position: relative; z-index: 5; flex-shrink: 0; background: #ffffff; box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12); display: flex; align-items: stretch; padding: 0 0 12px; }
  .mrv2-hempty .tab-bar .tab { flex: 1; height: 56px; display: flex; align-items: center; justify-content: center; color: #3b4551; }
  .mrv2-hempty .tab-bar .tab i { font-size: 24px; }
  .mrv2-hempty .tab-bar .tab.discover i { font-size: 26px; }
  .mrv2-hempty .tab-bar .tab.selected { color: #1a2332; }
  .mrv2-hempty .tab-bar .you-wrap { position: relative; display: inline-flex; }
  .mrv2-hempty .tab-bar .you-wrap .dot { border-color: #ffffff; }
  .mrv2-hempty .tab-bar .you { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: block; }
</style>

<div class="mrv2-hempty">
  <div class="toolbar">
    <button class="status-pill" aria-label="Set your status"><span class="me"><img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=96&h=96&q=80" alt="" /><span class="dot"></span></span><span class="st"><strong>Set a status</strong><small>Let friends know you're free</small></span></button>
    <div class="actions">
      <span class="tbtn" aria-label="Create plan"><i class="ph-bold ph-plus"></i></span>
      <span class="tbtn" aria-label="Notifications"><i class="ph-bold ph-bell"></i></span>
    </div>
  </div>

  <div class="content">
    <div class="greet">
      <h1><span class="grad">Welcome</span>, Brandon</h1>
      <h3 class="subline">Let's get your people in here</h3>
    </div>

    <div class="hero">
      <div class="faces">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=144&h=144&q=80" alt="" />
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=144&h=144&q=80" alt="" />
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=144&h=144&q=80" alt="" />
        <span class="plus"><i class="ph-bold ph-plus"></i></span>
      </div>
      <strong>MixedRoutes is better with your people</strong>
      <p>Add friends to see their plans, share spots, and make things happen together.</p>
      <button class="btn-ink"><i class="ph-bold ph-user-plus"></i>Add your friends</button>
      <button class="quiet-link">Share your invite link</button>
    </div>

    <section>
      <div class="sec-head">
        <h2>Suggested people</h2>
        <span class="more"><i class="ph-bold ph-caret-right"></i></span>
      </div>
      <div class="rail">
        <div class="mini-card">
          <img class="av" src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=144&h=144&q=80" alt="" />
          <div class="txt"><strong>Devon</strong><span>From your contacts</span></div>
          <button class="add-btn">Add</button>
        </div>
        <div class="mini-card">
          <img class="av" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=144&h=144&q=80" alt="" />
          <div class="txt"><strong>Maya</strong><span>From your contacts</span></div>
          <button class="add-btn">Add</button>
        </div>
        <div class="mini-card">
          <img class="av" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=144&h=144&q=80" alt="" />
          <div class="txt"><strong>Jordan</strong><span>From your contacts</span></div>
          <button class="add-btn">Add</button>
        </div>
        <div class="mini-card">
          <img class="av" src="https://images.unsplash.com/photo-1547425260-76bcadfb4f2c?auto=format&fit=crop&w=144&h=144&q=80" alt="" />
          <div class="txt"><strong>Alex</strong><span>From your contacts</span></div>
          <button class="add-btn">Add</button>
        </div>
      </div>
    </section>

    <section>
      <div class="sec-head">
        <h2>🎉 Events nearby</h2>
        <span class="more"><i class="ph-bold ph-caret-right"></i></span>
      </div>
      <div class="rail rail-places">
        <div class="tile"><div class="photo" style="background-image: url('https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?auto=format&fit=crop&w=400&q=80');"></div></div>
        <div class="tile"><div class="photo" style="background-image: url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=400&q=80');"></div></div>
        <div class="tile"><div class="photo" style="background-image: url('https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=400&q=80');"></div></div>
      </div>
    </section>
  </div>

  <div class="tab-bar">
    <span class="tab selected"><i class="ph-fill ph-house"></i></span>
    <span class="tab discover"><i class="ph-bold ph-compass"></i></span>
    <span class="tab"><span class="you-wrap"><img class="you" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=96&h=96&q=80" alt="" /><span class="dot"></span></span></span>
    <span class="tab"><i class="ph-bold ph-calendar-blank"></i></span>
    <span class="tab"><i class="ph-bold ph-chat"></i></span>
  </div>
</div>
