  // ---------- Router ----------
  var ROOTS = { home: 'home', discover: 'discover', 'discover-events': 'discover', 'discover-places': 'discover', 'discover-plans': 'discover', plans: 'plans', chats: 'chats', you: 'you' };
  var RENDER = { home: renderHome, notifications: renderNotifs, discover: renderDiscover, ask: renderAsk, plans: renderPlans, chats: renderChats, chat: renderChat, you: renderYou, event: renderEvent, place: renderPlace, plan: renderPlan, person: renderPerson };
  var stack = [], scrolls = {}, cur = null, curHash = '', curTab = 'home';
  function parse(h) {

  }
  function navigate(h) { if (location.hash.slice(1) === h) applyRoute(); else location.hash = h; }
  function applyRoute() {
    var h = location.hash.slice(1) || 'home', r = parse(h);

    if (r.root) curTab = ROOTS[h];
    RENDER[r.view](r.arg);
    next.classList.toggle('root', !!r.root);
    next.classList.toggle('over', !r.root);
    next.classList.remove('anim-pop', 'anim-push');
    next.classList.add('active');
    next.scrollTop = dir === 'push' ? 0 : (scrolls[h] || 0);
    if (prev && prev !== next) {
      if (dir === 'push') {
        next.classList.add('anim-push');
        next.addEventListener('animationend', function done() { next.removeEventListener('animationend', done); next.classList.remove('anim-push'); if (cur !== prev) prev.classList.remove('active'); });
      } else if (dir === 'pop') {

    $('app').classList.toggle('no-tabs', !r.root);

  }
  function back() {
    if (stack.length > 1) history.back();

  }
  function rerender() { var r = parse(curHash); if (r) { var st = cur.scrollTop; RENDER[r.view](r.arg); cur.scrollTop = st; } renderTabs(curTab); }

  // ---------- Actions ----------
  var A = {};
  A.back = back;
  A.tab = function (el) {

  A.chip = function (el) { navigate(el.getAttribute('data-id')); };

  A.save = function (el) {

  };
  A.join = function (el) {

    }
  };
  A.follow = function (el) {
    var id = el.getAttribute('data-id'); S.following[id] = !S.following[id];

  };
  A['banner-x'] = function (el, cta) {
    var card = el.closest('.home-banner-card'); if (!card || !card.classList.contains('is-top')) return;

  };
  A.invite = function (el) {

  };
  A.gs = function (el) {
    var id = el.getAttribute('data-id');
    if (id === 'friend') A.findfriends();

    else navigate('discover');
  };
  A['gs-dismiss'] = function () {
    S.gsHidden = true;

    if (card) { card.style.transition = 'opacity .25s ease, transform .25s ease'; card.style.opacity = '0'; card.style.transform = 'translateY(-8px)'; setTimeout(function () { card.remove(); }, 260); }
  };
  A.older = function (el) {
    S.olderShown = true;
    var tmp = document.createElement('div'); tmp.innerHTML = olderHTML(S.olderIds || []);
    el.replaceWith(tmp.firstChild);
  };
  A.teaser = function () { S.discoverFocus = 'weekend'; navigate('discover'); };
  A.status = openStatus;
  A.create = function (el) { var w = el.getAttribute('data-with'); openCreate(el.getAttribute('data-item'), w ? w.split(',') : null); };
  A.filter = function (el) { openFilter(el.getAttribute('data-id')); };
  A['filter-clear'] = function (el) { S.filters[el.getAttribute('data-id')] = {}; rerender(); };
  A.findfriends = function () { sheetState = { type: 'friends' }; openSheet(''); friendsSheet(); };
  A.review = function (el) { var id = el.getAttribute('data-id'), m = S.reviews[id]; sheetState = { type: 'review', place: id, stars: m ? m.stars : 0, tags: m ? m.tags.slice() : [], q: m ? m.q : '' }; openSheet(''); reviewSheet(); };
  A.checkin = function (el) {

  A['ask-sug'] = function (el) {

    else { S.ask = r; S.askRefine = null; }

  A['sheet-close'] = closeSheet;
  // Filter sheet
  A.fopt = function (el) {
    var g = el.getAttribute('data-id'), v = el.getAttribute('data-v'), f = sheetState.draft, grp = FILTERS[sheetState.kind].groups.filter(function (x) { return x.key === g; })[0];
    if (grp.multi) { var arr = f[g] || []; var at = arr.indexOf(v); if (at > -1) arr.splice(at, 1); else arr.push(v); f[g] = arr; }
    else f[g] = f[g] === v ? '' : v;
    var sc = $('sheet').scrollTop, tiles = $('sheet').querySelector('.tiles'), tl = tiles ? tiles.scrollLeft : 0;

  };
  A['filter-reset'] = function () { sheetState.draft = {}; filterSheet(); };

  // Create sheet
  function keepTitle() { var t = $('c-title'); if (t) sheetState.title = t.value; }
  var IDEA_TITLES = { '☕ Coffee': 'Coffee', '🌮 Tacos': 'Taco night', '🍻 Drinks': 'Drinks', '🥾 Hike': 'Morning hike', '🎬 Movie': 'Movie night' };
  A['c-idea'] = function (el) { keepTitle(); var t = el.getAttribute('data-id'); sheetState.title = IDEA_TITLES[t]; if (!sheetState.place && /Coffee/.test(t)) sheetState.place = 'ultra'; if (!sheetState.place && /Drinks/.test(t)) sheetState.place = 'jumbo'; createSheet(); };
  A['c-when'] = function (el) { keepTitle(); sheetState.when = el.getAttribute('data-id'); createSheet(); };
  A['c-place'] = function (el) { keepTitle(); var k = el.getAttribute('data-id'); sheetState.place = sheetState.place === k ? null : k; createSheet(); };
  A['c-who'] = function (el) { keepTitle(); var p = el.getAttribute('data-id'), w = sheetState.who, at = w.indexOf(p); if (at > -1) w.splice(at, 1); else w.push(p); el.classList.toggle('on', at < 0); };
  A['c-go'] = function () { keepTitle(); if ((sheetState.title || '').trim()) doCreate(); };
  // Status sheet
  A['st-s'] = function (el) { sheetState.s = el.getAttribute('data-id'); statusSheet(); };
  A['st-at'] = function (el) { sheetState.at = el.getAttribute('data-id'); statusSheet(); };
  A['st-save'] = function () { S.status = { s: sheetState.s, at: sheetState.at }; closeSheet(); toast('Status updated', 'ph-check-circle'); rerender(); };
  A['st-clear'] = function () { S.status = null; closeSheet(); toast('Status cleared', 'ph-x-circle'); rerender(); };
  // Review sheet
  function keepReview() { var q = $('rv-q'); if (q) sheetState.q = q.value; }
  A['rv-star'] = function (el) { keepReview(); sheetState.stars = +el.getAttribute('data-id'); reviewSheet(); };
  A['rv-tag'] = function (el) { keepReview(); var t = el.getAttribute('data-id'), a = sheetState.tags, at = a.indexOf(t); if (at > -1) a.splice(at, 1); else a.push(t); el.classList.toggle('on', at < 0); };

  function setMode(m) {
    S = fresh(m);
    try { localStorage.setItem('mrp-v2-mode', m); } catch (e) {}
    scrolls = {};
    toast(m === 'active' ? 'Home: active user' : m === 'few' ? 'Home: few friends' : 'Home: day one', 'ph-arrows-clockwise');
    if (curHash === 'you') rerender(); else navigate('home');
  }

  var lastDiscover = null;
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');

    if (g) { e.preventDefault(); if ($('sheet-host').classList.contains('open')) closeSheet(); navigate(g.getAttribute('data-go')); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target, kind = f.getAttribute('data-form');

  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'chat-q') $('chat-list').innerHTML = chatRows(e.target.value);

  });
  document.addEventListener('focusin', function (e) { var w = e.target.closest && e.target.closest('.ask-wrap'); if (w) w.classList.add('focus'); });
  document.addEventListener('focusout', function (e) { var w = e.target.closest && e.target.closest('.ask-wrap'); if (w) setTimeout(function () { w.classList.remove('focus'); }, 150); });

  });
  window.navigate = navigate;
  applyRoute();
})();
