<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; position: relative; flex-shrink: 0;">
    <i class="ph ph-caret-left" style="font-size: 24px; padding: 8px;"></i>
    <div style="position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; pointer-events: none;">Continue with email</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column;">
    <h1 style="margin: 0 0 11px; font-size: 36px; font-weight: 700; line-height: 1.15;">What's your email?</h1>
    <div style="font-size: 16px; color: #5c6b7d; line-height: 1.45; margin-bottom: 28px;">If you already have an account, we'll log you in. If not, we'll get you set up.</div>

    <div style="height: 56px; border: 1.5px solid #0d9a8a; border-radius: 28px; background: #ffffff; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #1a2332;">brandon@example.com</div>

    <div style="display: flex; align-items: flex-start; gap: 8px; margin: 16px 4px 0;">
      <i class="ph-fill ph-lock" style="font-size: 18px; color: #5c6b7d; flex-shrink: 0; margin-top: 1px;"></i>
      <div style="font-size: 13px; color: #5c6b7d; line-height: 1.4;">We only use your email to sign you in. No newsletters unless you ask.</div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Continue</div>
  </div>
</div>
