<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; flex-shrink: 0;">
    <i class="ph ph-arrow-left" style="font-size: 24px; color: #1a2332;"></i>
    <div style="font-size: 17px; font-weight: 700;">Sign Up</div>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 0 16px 20px; flex-shrink: 0;">
    <div style="display: flex; gap: 6px;">
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: rgba(16,23,36,0.12);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: rgba(16,23,36,0.12);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: rgba(16,23,36,0.12);"></div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px;">
    <h1 style="margin: 0 0 5px; font-size: 36px; font-weight: 700; line-height: 1.15;">Set up your profile</h1>
    <div style="font-size: 16px; color: #5c6b7d; margin-bottom: 28px;">A photo helps friends recognize you when plans go out.</div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px;">
      <div style="position: relative;">
        <img src="https://i.pravatar.cc/216?img=12" alt="" style="width: 108px; height: 108px; border-radius: 50%; object-fit: cover; display: block;" />
        <div style="position: absolute; bottom: 0; right: 0; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(145deg, #14b8a6, #3b82f6); border: 3px solid #f2f2f7; display: flex; align-items: center; justify-content: center;">
          <i class="ph-fill ph-camera" style="font-size: 17px; color: #ffffff;"></i>
        </div>
      </div>
      <div style="font-size: 13px; color: #5c6b7d;">From your account. Tap to change.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="position: relative; height: 56px; border: 1.5px solid rgba(16,23,36,0.25); border-radius: 28px; background: #ffffff; display: flex; align-items: center; padding: 0 20px;">
        <span style="position: absolute; top: -8px; left: 20px; background: #f2f2f7; padding: 0 6px; font-size: 12px; font-weight: 600; color: #5c6b7d;">First name</span>
        <span style="font-size: 16px;">Brandon</span>
      </div>
      <div style="position: relative; height: 56px; border: 1.5px solid rgba(16,23,36,0.25); border-radius: 28px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;">
        <span style="position: absolute; top: -8px; left: 20px; background: #f2f2f7; padding: 0 6px; font-size: 12px; font-weight: 600; color: #5c6b7d;">Last name</span>
        <span style="font-size: 16px;">Keller</span>
        <span style="font-size: 13px; color: #99a0ac; flex-shrink: 0;">Optional</span>
      </div>
      <div>
        <div style="position: relative; height: 56px; border: 1.5px solid #0d9a8a; border-radius: 28px; background: #ffffff; display: flex; align-items: center; padding: 0 20px; gap: 6px;">
          <span style="position: absolute; top: -8px; left: 20px; background: #f2f2f7; padding: 0 6px; font-size: 12px; font-weight: 600; color: #0d9a8a;">Username</span>
          <span style="font-size: 16px; color: #5c6b7d;">@</span>
          <span style="font-size: 16px; flex: 1;">brandon_hikes</span>
          <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #0d9a8a;"></i>
        </div>
        <div style="font-size: 13px; font-weight: 600; color: #0d9a8a; margin: 6px 0 0 20px;">Nice, that one's available</div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px; background: #f2f2f7;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Continue</div>
  </div>
</div>
