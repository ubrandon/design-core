<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; flex-shrink: 0;">
    <i class="ph ph-caret-left" style="font-size: 24px; padding: 8px;"></i>
  </div>

  <div style="flex: 1; padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <div style="margin: 24px 0 16px;">
      <i class="ph ph-envelope-simple" style="font-size: 104px; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent;"></i>
    </div>

    <h1 style="margin: 0 0 11px; font-size: 36px; font-weight: 700;">Check your email!</h1>

    <p style="margin: 0 0 36px; font-size: 16px; line-height: 1.5; color: #101724;">
      We sent a verification link to <span style="font-weight: 700;">jordan@example.com</span>. Tap the link in that message to verify your account, then return to this app.
    </p>

    <div style="width: 100%; padding: 16px; border-radius: 11px; background: #e1e4eb; text-align: left;">
      <div style="display: flex; align-items: flex-start; gap: 11px;">
        <i class="ph-fill ph-info" style="font-size: 20px; color: #5c6b7d; margin-top: 1px;"></i>
        <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5c6b7d;">Don&rsquo;t see it? Check your spam, junk, or Promotions folder.</p>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 36px; width: 100%;">
      <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Resend link</div>
      <div style="height: 48px; border-radius: 999px; background: #cacdd6; color: #1a2332; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Change email</div>
    </div>
  </div>
