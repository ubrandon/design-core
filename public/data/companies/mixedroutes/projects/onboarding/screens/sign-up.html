<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; position: relative; flex-shrink: 0;">
    <i class="ph ph-caret-left" style="font-size: 24px; padding: 8px;"></i>
    <div style="position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; pointer-events: none;">Sign up</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <h1 style="margin: 0 0 11px; font-size: 36px; font-weight: 700; line-height: 1.15;">Let&rsquo;s get you set up &#127881;</h1>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <p style="margin: 0 0 7px; font-size: 16px; font-weight: 700; letter-spacing: 0.05rem; color: #101724;">Choose a unique username.</p>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #5c6b7d; background: transparent;">Username</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <p style="margin: 0 0 2px; font-size: 16px; font-weight: 700; letter-spacing: 0.05rem; color: #101724;">What should we call you?</p>
      <p style="margin: 0 0 5px; font-size: 14px; color: #5c6b7d;">A real name helps your friends find you.</p>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #5c6b7d;">First Name</div>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #5c6b7d;">Last Name</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <p style="margin: 0 0 7px; font-size: 16px; font-weight: 700; letter-spacing: 0.05rem; color: #101724;">Email and secure password.</p>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #5c6b7d;">Email</div>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 16px; color: #5c6b7d;">
        Password
        <i class="ph ph-eye" style="font-size: 22px; color: #5c6b7d;"></i>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 11px; padding: 16px; border-radius: 11px; background: #ffffff; border: 1px solid rgba(16,23,36,0.16);">
      <i class="ph-fill ph-info" style="font-size: 22px; color: #5c6b7d; margin-top: 1px;"></i>
      <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5c6b7d;">
        By signing up you agree to our <span style="color: #06b6d4;">Terms</span> and <span style="color: #06b6d4;">Privacy Policy</span>.
      </p>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; opacity: 0.5;">Sign up</div>
  </div>
</div>
