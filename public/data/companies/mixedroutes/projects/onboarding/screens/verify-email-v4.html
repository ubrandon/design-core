<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  @keyframes ve4spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .ve4-spin { animation: ve4spin 1s linear infinite; display: inline-flex; }
</style>
<div class="ve4-scope" style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; position: relative; flex-shrink: 0;">
    <i class="ph ph-caret-left" style="font-size: 24px; padding: 8px;"></i>
    <div style="position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; pointer-events: none;">Verify email</div>
  </div>

  <div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; align-items: center; text-align: center;">
    <div style="margin: 32px 0 16px;">
      <i class="ph ph-envelope-simple" style="font-size: 104px; background: linear-gradient(145deg, #14b8a6, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent;"></i>
    </div>

    <h1 style="margin: 0 0 11px; font-size: 36px; font-weight: 700; line-height: 1.15;">Check your email</h1>

    <p style="margin: 0 0 28px; font-size: 16px; line-height: 1.5; color: #5c6b7d;">
      We sent a verification link to <span style="font-weight: 700; color: #1a2332;">brandon@example.com</span>. Tap the link, then come back here.
    </p>

    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="ve4-spin"><i class="ph ph-circle-notch" style="font-size: 18px; color: #0d9a8a;"></i></span>
      <span style="font-size: 14px; font-weight: 600; color: #0d9a8a;">Waiting for you to verify&hellip;</span>
    </div>

    <p style="margin: 28px 0 0; font-size: 14px; line-height: 1.5; color: #5c6b7d;">
      Don't see it? Check your spam or Promotions folder,<br />or <span class="ve4-resend" style="color: #e8880a; font-weight: 700; cursor: pointer;">resend the link</span>.
    </p>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px; background: #f2f2f7;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Open email app</div>
  </div>
</div>
<script>
  (function () {
    var root = document.querySelector('.ve4-scope');
    if (!root) return;
    var resend = root.querySelector('.ve4-resend');
    var busy = false;
    resend.addEventListener('click', function () {
      if (busy) return;
      busy = true;
      resend.textContent = 'link sent';
      resend.style.color = '#0d9a8a';
      var left = 30;
      setTimeout(function tick() {
        resend.textContent = 'resend in 0:' + String(left).padStart(2, '0');
        resend.style.color = '#99a0ac';
        left--;
        if (left >= 0) { setTimeout(tick, 1000); return; }
        resend.textContent = 'resend the link';
        resend.style.color = '#e8880a';
        busy = false;
      }, 1500);
    });
  })();
</script>
