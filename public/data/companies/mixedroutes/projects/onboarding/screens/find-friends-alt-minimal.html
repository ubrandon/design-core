<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; flex-shrink: 0;">
    <i class="ph ph-arrow-left" style="font-size: 24px; color: #1a2332;"></i>
    <div style="font-size: 17px; font-weight: 700;">Sign Up</div>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 0 16px 20px; flex-shrink: 0;">
    <div style="display: flex; gap: 6px;">
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: rgba(16,23,36,0.12);"></div>
      <div style="height: 4px; flex: 1; border-radius: 999px; background: rgba(16,23,36,0.12);"></div>
    </div>
    <div style="font-size: 13px; font-weight: 600; color: #5c6b7d; margin-top: 8px;">Step 2 of 4</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-top: -40px;">
    <div style="width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(145deg, #14b8a6, #3b82f6); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 22px rgba(59,130,246,0.35); margin-bottom: 24px;">
      <i class="ph-fill ph-address-book" style="font-size: 46px; color: #ffffff;"></i>
    </div>

    <h1 style="margin: 0 0 8px; font-size: 32px; font-weight: 700; line-height: 1.15;">Find your people</h1>
    <div style="font-size: 16px; color: #5c6b7d; line-height: 1.4; margin-bottom: 28px; max-width: 300px;">Plans need people. See which of your contacts are already on MixedRoutes.</div>

    <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 28px;">
      <img src="https://i.pravatar.cc/72?img=15" alt="" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #f2f2f7;" />
      <img src="https://i.pravatar.cc/72?img=47" alt="" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #f2f2f7; margin-left: -10px;" />
      <img src="https://i.pravatar.cc/72?img=32" alt="" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #f2f2f7; margin-left: -10px;" />
      <img src="https://i.pravatar.cc/72?img=5" alt="" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #f2f2f7; margin-left: -10px;" />
      <div style="font-size: 14px; font-weight: 600; color: #5c6b7d; margin-left: 10px;">120+ people joined this week</div>
    </div>

    <div style="background: #ffffff; border-radius: 16px; padding: 6px 0; width: 100%; text-align: left;">
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px;">
        <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #0d9a8a; flex-shrink: 0;"></i>
        <div style="font-size: 15px; line-height: 1.4;">See which contacts are already here</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px;">
        <i class="ph-fill ph-check-circle" style="font-size: 22px; color: #0d9a8a; flex-shrink: 0;"></i>
        <div style="font-size: 15px; line-height: 1.4;">Add friends with one tap</div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px;">
        <i class="ph-fill ph-lock" style="font-size: 22px; color: #5c6b7d; flex-shrink: 0;"></i>
        <div style="font-size: 15px; line-height: 1.4;">We never post or message for you</div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px; background: #f2f2f7;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Find my friends</div>
    <div style="text-align: center; margin-top: 14px;">
      <span style="color: #5c6b7d; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05rem;">Skip for now</span>
    </div>
  </div>
</div>
