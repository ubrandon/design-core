<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<div style="background: #f2f2f7; height: 844px; display: flex; flex-direction: column; font-family: 'Geist', sans-serif; color: #1a2332; overflow: hidden;">

  <div style="display: flex; align-items: center; height: 56px; padding: 0 8px; position: relative; flex-shrink: 0;">
    <i class="ph ph-caret-left" style="font-size: 24px; padding: 8px;"></i>
    <div style="position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 700; pointer-events: none;">Sign up</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <h1 style="margin: 0 0 8px; font-size: 36px; font-weight: 700; line-height: 1.15;">Let&rsquo;s set you&nbsp;up&nbsp;&#127881;</h1>
      <div style="font-size: 14px; color: #5c6b7d;">Looks like you're new here. This takes about a minute.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0; font-size: 16px; font-weight: 700; color: #101724;">Your name</p>
      <p style="margin: -4px 0 0; font-size: 14px; color: #5c6b7d;">A real name helps your friends find you.</p>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; background: #ffffff; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #1a2332;">Brandon</div>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 16px; color: #5c6b7d;">
        Last name
        <span style="font-size: 13px; color: #99a0ac; flex-shrink: 0;">Optional</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <p style="margin: 0; font-size: 16px; font-weight: 700; color: #101724;">Email and password</p>
      <div style="height: 56px; border: 1px solid #99a0ac; border-radius: 28px; background: #ffffff; display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: #1a2332;">brandon@example.com</div>
      <div style="height: 56px; border: 1.5px solid #0d9a8a; border-radius: 28px; background: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 16px; color: #1a2332;">
        <span style="letter-spacing: 0.2em;">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span>
        <i class="ph ph-eye" style="font-size: 22px; color: #5c6b7d;"></i>
      </div>
      <p style="margin: 0 0 0 16px; font-size: 13px; color: #5c6b7d;">At least 8 characters, with a number.</p>
    </div>

  </div>

  <div style="flex-shrink: 0; padding: 8px 16px 20px;">
    <div style="height: 48px; border-radius: 999px; background: linear-gradient(145deg, #14b8a6, #3b82f6); color: #ffffff; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Sign up</div>
  </div>
</div>
