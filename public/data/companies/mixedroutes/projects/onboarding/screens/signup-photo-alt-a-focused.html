<link rel="stylesheet" href="../../../../../../styles/shared.css" />
<link rel="stylesheet" href="../../../../../../styles/ds.css" />
<link rel="stylesheet" href="../../../design-system/company.css" />
<style>
  .spa-field {
    height: 58px;
    border: 2px solid #0d9a8a;
    border-radius: 18px;
    background: #ffffff;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    box-shadow: 0 0 0 4px rgba(13, 154, 138, 0.1);
  }
  .spa-provider {
    height: 50px;
    flex: 1;
    border: 1px solid rgba(16, 23, 36, 0.12);
    border-radius: 16px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: #1a2332;
    font-size: 14px;
    font-weight: 700;
  }
</style>

<div class="mr-scope ds-no-scrollbar" style="background: #f4f5f2; height: 844px; position: relative; overflow: hidden; color: #162234;">
  <div style="height: 228px; position: relative; overflow: hidden;">
    <img src="https://images.unsplash.com/photo-1528605248644-14dd04022da1?q=80&amp;w=780&amp;h=520&amp;fit=crop&amp;auto=format" alt="Friends sharing a meal" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 48%;" />
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,10,14,0.48), rgba(8,12,16,0.18) 48%, rgba(8,12,16,0.72));"></div>

    <div style="position: absolute; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; color: #ffffff;">
      <i class="ph ph-arrow-left" style="font-size: 23px;"></i>
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.02em;">1 of 3</span>
    </div>

    <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;">
      <div style="font-size: 14px; font-weight: 700; line-height: 1.35; color: rgba(255,255,255,0.92); max-width: 190px;">Your next good story starts with a hello.</div>
      <img src="../img/white-logo.svg" alt="MixedRoutes" style="height: 44px; width: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));" />
    </div>
  </div>

  <div style="position: absolute; top: 202px; left: 0; right: 0; bottom: 0; border-radius: 30px 30px 0 0; background: #f4f5f2; padding: 30px 20px 22px; display: flex; flex-direction: column;">
    <div style="display: flex; gap: 6px; margin-bottom: 28px;">
      <span style="height: 5px; flex: 1; border-radius: 999px; background: linear-gradient(90deg, #14b8a6, #3b82f6);"></span>
      <span style="height: 5px; flex: 1; border-radius: 999px; background: #dfe3e2;"></span>
      <span style="height: 5px; flex: 1; border-radius: 999px; background: #dfe3e2;"></span>
    </div>

    <div>
      <div style="display: inline-flex; align-items: center; gap: 6px; color: #0d8579; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;">
        <i class="ph-fill ph-envelope-simple" style="font-size: 15px;"></i>
        Start simple
      </div>
      <h1 style="margin: 0; font-size: 34px; line-height: 1.06; letter-spacing: -0.035em; font-weight: 800; color: #101724;">What&rsquo;s your email?</h1>
      <p style="margin: 10px 0 22px; color: #667181; font-size: 15px; line-height: 1.45;">We&rsquo;ll use it to keep your plans and people in one place.</p>
    </div>

    <div class="spa-field">
      <i class="ph ph-envelope-simple" style="font-size: 21px; color: #0d9a8a;"></i>
      <span style="font-size: 16px; color: #8b939d;">you@example.com</span>
      <span style="height: 24px; width: 1.5px; background: #0d9a8a; margin-left: -3px;"></span>
    </div>

    <div class="btn btn-primary" style="width: 100%; height: 54px; margin-top: 16px; font-size: 17px;">Continue</div>

    <div class="ds-divider-text" style="margin: 22px 0 16px; color: #8a919a;">or use</div>

    <div style="display: flex; gap: 10px;">
      <div class="spa-provider"><img src="../img/apple-logo.png" alt="" style="width: 20px; height: 20px;" /> Apple</div>
      <div class="spa-provider"><img src="../img/google-logo.png" alt="" style="width: 20px; height: 20px;" /> Google</div>
    </div>

    <div style="margin-top: auto; text-align: center; color: #7c8590; font-size: 13px; line-height: 1.45;">
      Already have an account? <span style="color: #0d8579; font-weight: 800;">Log in</span>
      <div style="margin-top: 10px; font-size: 11px; color: #9ca3ac;">By continuing, you agree to our Terms and Privacy Policy.</div>
    </div>
  </div>
</div>
