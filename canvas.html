<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas | Design Core</title>
  <script>(function(){try{var t=localStorage.getItem('dc-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="styles/shared.css">
  <link rel="stylesheet" href="styles/ds.css">
  <link rel="stylesheet" href="styles/canvas-space.css">
  <link rel="stylesheet" href="styles/zoom-controls.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/tool-refresh.css">
</head>
<body>

  <div id="viewport" class="canvas-space-viewport is-select-tool">
    <div id="stage" class="canvas-space-stage"></div>
  </div>

  <div class="zoom-controls">
    <div class="canvas-tool-group" role="toolbar" aria-label="Canvas tools">
      <button id="tool-select" class="zoom-btn is-active" type="button" onclick="setCanvasTool('select')" title="Select tool (V)" aria-label="Select tool" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l13.5 8.6-6.1 1.7-3 5.7L5 3z"/><path d="M13 13l5 5"/></svg>
      </button>
      <button id="tool-hand" class="zoom-btn" type="button" onclick="setCanvasTool('hand')" title="Hand tool (H)" aria-label="Hand tool" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 11V6.5a1.5 1.5 0 0 1 3 0V10"/><path d="M10.5 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M13.5 10V6a1.5 1.5 0 0 1 3 0v5"/><path d="M16.5 11V8.5a1.5 1.5 0 0 1 3 0V14c0 4.4-2.8 7-7 7h-1.1a6 6 0 0 1-4.8-2.4L4 15.2a1.6 1.6 0 0 1 2.4-2.1l1.1.9"/></svg>
      </button>
      <button id="tool-text" class="zoom-btn" type="button" onclick="addText()" title="Title tool (T)" aria-label="Title tool" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7V4h14v3M9 20h6M12 4v16"/></svg>
      </button>
    </div>
    <button class="zoom-btn" type="button" onclick="refreshScreens()" title="Reload screens" aria-label="Reload screens">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <div class="zoom-controls__zoom-group">
      <button class="zoom-btn" onclick="pz.zoomBy(-0.04)" title="Zoom out">&minus;</button>
      <span id="zoom-label" class="zoom-level">100%</span>
      <button class="zoom-btn" onclick="pz.zoomBy(0.04)" title="Zoom in">+</button>
      <button class="zoom-btn" type="button" onclick="centerOnContent()" title="Frame all (Shift+1)" aria-label="Frame all canvas content">
        <!-- @phosphor-icons/core assets/regular/crosshair.svg (MIT) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232,120h-8.34A96.14,96.14,0,0,0,136,32.34V24a8,8,0,0,0-16,0v8.34A96.14,96.14,0,0,0,32.34,120H24a8,8,0,0,0,0,16h8.34A96.14,96.14,0,0,0,120,223.66V232a8,8,0,0,0,16,0v-8.34A96.14,96.14,0,0,0,223.66,136H232a8,8,0,0,0,0-16Zm-96,87.6V200a8,8,0,0,0-16,0v7.6A80.15,80.15,0,0,1,48.4,136H56a8,8,0,0,0,0-16H48.4A80.15,80.15,0,0,1,120,48.4V56a8,8,0,0,0,16,0V48.4A80.15,80.15,0,0,1,207.6,120H200a8,8,0,0,0,0,16h7.6A80.15,80.15,0,0,1,136,207.6ZM128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152Z"/></svg>
      </button>
    </div>
  </div>

  <script src="scripts/shared.js"></script>
  <script src="scripts/nav.js"></script>
  <script src="scripts/sidenav.js"></script>
  <script src="scripts/canvas-pan-zoom.js"></script>
  <script src="scripts/canvas-sync.js"></script>
  <script src="scripts/canvas-persistence.js"></script>
  <script src="scripts/canvas-renderer.js"></script>
  <script src="scripts/canvas-export.js"></script>
  <script src="scripts/live-reload.js"></script>
  <script src="scripts/canvas-interactions.js"></script>
</body>
</html>
